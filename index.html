<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NSL S2 - Nawab Super League Season 2</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            nsl: {
              gold: '#F59E0B',
              amber: '#D97706',
              dark: '#030712',
              surface: '#0B0F19',
              card: '#111827',
              border: '#1F2937'
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #030712;
      color: #F9FAFB;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes live-glow {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2); opacity: 0.5; }
    }
    .animate-live-glow {
      animation: live-glow 1.5s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-[#030712] min-h-screen flex justify-center text-slate-100 selection:bg-amber-500 selection:text-black">

  <!-- Mobile Viewport Wrapper -->
  <div class="w-full max-w-md min-h-screen flex flex-col relative bg-[#0B0F19] shadow-2xl border-x border-slate-800/60">

    <!-- Universal Sticky Header -->
    <header class="sticky top-0 z-40 bg-[#0B0F19]/95 backdrop-blur-md border-b border-slate-800/80 px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3 cursor-pointer" onclick="navigateTo('home')">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-500/20 to-amber-600/10 border border-amber-500/30 flex items-center justify-center overflow-hidden shrink-0 shadow-inner">
          <img src="nsl_s2_logo.png" alt="NSL" class="w-full h-full object-contain" onerror="this.onerror=null; this.parentElement.innerHTML='<span class=\'font-black text-amber-500 text-xs tracking-wider\'>NSL</span>';" />
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-xs font-black tracking-widest uppercase text-white">Nawab Super League</h1>
            <span class="text-[9px] bg-amber-500/20 text-amber-400 font-black px-1.5 py-0.5 rounded border border-amber-500/30">S2</span>
          </div>
          <p class="text-[10px] font-semibold text-slate-400">Official Tournament Match Center</p>
        </div>
      </div>

      <!-- Live Dot & Scorer/Spectator Pill -->
      <div class="flex items-center gap-2">
        <div id="header-live-indicator" class="hidden items-center gap-1.5 bg-red-500/10 border border-red-500/30 px-2 py-0.5 rounded-full">
          <span class="w-2 h-2 rounded-full bg-red-500 animate-live-glow"></span>
          <span class="text-[9px] font-black text-red-400 tracking-widest">LIVE</span>
        </div>
        <button id="header-auth-pill" onclick="handleAuthToggle()" class="px-2.5 py-1 rounded-full text-[10px] font-black tracking-wider uppercase transition border bg-slate-800/90 text-slate-400 border-slate-700">
          Spectator
        </button>
      </div>
    </header>

    <!-- Main Dynamic Container -->
    <main id="app-viewport" class="flex-1 p-4 pb-28 overflow-y-auto no-scrollbar">
      <!-- Dynamic Views Rendered by JS -->
    </main>

    <!-- 4 Bottom Navigation Buttons Only -->
    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-[#0B0F19]/95 backdrop-blur-lg border-t border-slate-800/80 px-6 py-2.5 flex items-center justify-between z-40">
      <button onclick="navigateTo('home')" id="bottom-nav-home" class="flex flex-col items-center gap-1 text-amber-400 transition">
        <i data-lucide="home" class="w-5 h-5"></i>
        <span class="text-[10px] font-black">Home</span>
      </button>
      <button onclick="navigateTo('points')" id="bottom-nav-points" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200 transition">
        <i data-lucide="table" class="w-5 h-5"></i>
        <span class="text-[10px] font-black">Points</span>
      </button>
      <button onclick="navigateTo('leaderboard')" id="bottom-nav-leaderboard" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200 transition">
        <i data-lucide="award" class="w-5 h-5"></i>
        <span class="text-[10px] font-black">Leaderboard</span>
      </button>
      <button onclick="navigateTo('admin')" id="bottom-nav-admin" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200 transition">
        <i data-lucide="shield-check" class="w-5 h-5"></i>
        <span class="text-[10px] font-black">Admin</span>
      </button>
    </nav>

    <!-- Modal Backdrop -->
    <div id="app-modal" class="hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/85 backdrop-blur-sm">
      <div id="modal-container" class="w-full max-w-md bg-[#111827] border-t sm:border border-slate-800 rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl max-h-[85vh] overflow-y-auto no-scrollbar">
        <!-- Injected Content -->
      </div>
    </div>

    <!-- Live Event Overlay (Boundaries / Wickets / Superball) -->
    <div id="event-banner-overlay" class="hidden fixed inset-0 z-50 pointer-events-none flex items-center justify-center bg-black/60 backdrop-blur-sm transition-all duration-300">
      <div id="event-box" class="p-6 rounded-3xl text-center border shadow-2xl max-w-xs mx-4 bg-[#111827] border-amber-500/40">
        <h2 id="event-title" class="text-3xl font-black italic tracking-widest text-amber-400"></h2>
        <p id="event-subtitle" class="text-xs font-bold text-slate-200 mt-1"></p>
      </div>
    </div>

  </div>

  <!-- Firebase Scripts (Deferred background sync) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <script>
    // --- 1. VERIFIED NSL S2 MASTER TOURNAMENT DATA ---
    const OFFICIAL_TEAMS = {
      KTG: {
        code: "KTG",
        name: "Khan Tigers",
        captain: "Arbaz (Captain, #25)",
        logo: "KTG.png",
        players: ["Arbaz (#25)", "Azhar M", "Farhan Iq", "Farhan J", "Amir K", "Adeel K", "Zohaib Ir", "Saqib G", "Ghayoor A", "Faheem D", "Ayaz D", "Aliyan S", "Abbas"]
      },
      ASK: {
        code: "ASK",
        name: "Arslan Aslam Super Kings",
        captain: "Aslam K",
        logo: "ASK.png",
        players: ["Aslam K", "Arslan", "Zeeshan", "Shahbaz", "Khurram", "Tariq", "Waseem", "Babar", "Rehan", "Nabeel", "Hamza"]
      },
      NKG: {
        code: "NKG",
        name: "Nawab Kings",
        captain: "AKHTIAR H",
        logo: "NKG.png",
        players: ["AKHTIAR H", "Usman", "Bilal", "Rashid", "Awais", "Salman", "Irfan", "Haider", "Nouman", "Yasir", "Danish"]
      },
      ALW: {
        code: "ALW",
        name: "Ali Waly",
        captain: "Imtiaz K",
        logo: "ALW.png",
        players: ["Imtiaz K", "Ali Raza", "Zubair", "Mohsin", "Fahad", "Umair", "Kashif Jr", "Talha", "Ahsan", "Waqas", "Shahid"]
      }
    };

    const OFFICIAL_FIXTURES = [
      { id: "M1", matchNo: 1, title: "Match 1", teamA: "KTG", teamB: "ASK", overs: 8, status: "scheduled", result: null },
      { id: "M2", matchNo: 2, title: "Match 2", teamA: "NKG", teamB: "ALW", overs: 8, status: "scheduled", result: null },
      { id: "M3", matchNo: 3, title: "Match 3", teamA: "KTG", teamB: "NKG", overs: 8, status: "scheduled", result: null },
      { id: "M4", matchNo: 4, title: "Match 4", teamA: "ASK", teamB: "ALW", overs: 8, status: "scheduled", result: null },
      { id: "M5", matchNo: 5, title: "Match 5", teamA: "KTG", teamB: "ALW", overs: 8, status: "scheduled", result: null },
      { id: "M6", matchNo: 6, title: "Match 6", teamA: "ASK", teamB: "NKG", overs: 8, status: "scheduled", result: null },
      { id: "M7", matchNo: 7, title: "Qualifier (2nd vs 3rd)", teamA: "TBD", teamB: "TBD", overs: 8, status: "scheduled", result: null },
      { id: "M8", matchNo: 8, title: "Grand Final", teamA: "TBD", teamB: "TBD", overs: 8, status: "scheduled", result: null }
    ];

    const OFFICIAL_RULES = `1. Strictly 8 overs per match.
2. Max 2.0 overs per bowler. Bowlers cannot bowl consecutive overs.
3. No Byes or Leg-Byes. Runs must come strictly off the bat.
4. Wide = 1 Run. No-Ball = 1 Run + Free Hit.
5. Super Ball: Can be called once per innings between overs 2 and 7. Doubles runs scored off the bat; -5 runs penalty if dismissed on the delivery. Persists through wides and no-balls.
6. Admin PIN 2443 required for official match scoring, player registration, and rule updates.`;

    const ADMIN_PIN = "2443";
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyCBsKqu-4WWbKo-qN7lRo5-nak-anFwiC8",
      authDomain: "nsl-s2.firebaseapp.com",
      projectId: "nsl-s2",
      storageBucket: "nsl-s2.firebasestorage.app",
      messagingSenderId: "751866095822",
      appId: "1:751866095822:web:4fab1aeb6dc0419800089f"
    };

    // --- 2. GLOBAL STATE ---
    let appState = {
      isAdmin: false,
      currentView: 'home',
      activeMatchId: null,
      teams: JSON.parse(JSON.stringify(OFFICIAL_TEAMS)),
      fixtures: JSON.parse(JSON.stringify(OFFICIAL_FIXTURES)),
      rules: OFFICIAL_RULES,
      activeMatch: null,
      undoStack: []
    };

    let db = null;

    // --- 3. WEB AUDIO SYNTHESIZER ---
    const AudioSynthesizer = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      },
      play(type) {
        try {
          this.init();
          if (!this.ctx) return;
          const ctx = this.ctx;
          const now = ctx.currentTime;

          if (type === 'superball') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.linearRampToValueAtTime(880, now + 0.3);
            osc.frequency.linearRampToValueAtTime(440, now + 0.6);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.8);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.8);
          } else if (type === 'boundary4') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.35);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.45);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.45);
          } else if (type === 'boundary6') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.5);
            gain.gain.setValueAtTime(0.35, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.65);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.65);
          } else if (type === 'wicket') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(280, now);
            osc.frequency.linearRampToValueAtTime(80, now + 0.4);
            gain.gain.setValueAtTime(0.35, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.45);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.45);
          }
        } catch (e) {
          console.warn('Audio synthesis note:', e);
        }
      }
    };

    // --- 4. BULLETPROOF STATE INITIALIZER & SANITIZER ---
    function sanitizeState(data) {
      if (!data || typeof data !== 'object') return;

      // Validate & repair teams
      if (data.teams && typeof data.teams === 'object') {
        const mergedTeams = { ...OFFICIAL_TEAMS };
        Object.keys(OFFICIAL_TEAMS).forEach(k => {
          if (data.teams[k] && typeof data.teams[k] === 'object') {
            mergedTeams[k] = {
              ...OFFICIAL_TEAMS[k],
              ...data.teams[k],
              players: Array.isArray(data.teams[k].players) && data.teams[k].players.length > 0
                ? data.teams[k].players
                : OFFICIAL_TEAMS[k].players
            };
          }
        });
        appState.teams = mergedTeams;
      } else {
        appState.teams = JSON.parse(JSON.stringify(OFFICIAL_TEAMS));
      }

      // Validate & repair fixtures
      if (Array.isArray(data.fixtures) && data.fixtures.length > 0) {
        appState.fixtures = data.fixtures;
      } else {
        appState.fixtures = JSON.parse(JSON.stringify(OFFICIAL_FIXTURES));
      }

      // Validate rules & active match
      appState.rules = typeof data.rules === 'string' && data.rules.trim() ? data.rules : OFFICIAL_RULES;
      appState.activeMatch = data.activeMatch || null;
    }

    function loadLocalState() {
      try {
        const local = localStorage.getItem('nsl_s2_verified_state_v5');
        if (local) {
          const parsed = JSON.parse(local);
          sanitizeState(parsed);
        } else {
          appState.teams = JSON.parse(JSON.stringify(OFFICIAL_TEAMS));
          appState.fixtures = JSON.parse(JSON.stringify(OFFICIAL_FIXTURES));
          appState.rules = OFFICIAL_RULES;
          appState.activeMatch = null;
        }
        appState.isAdmin = localStorage.getItem('nsl_s2_admin_logged') === 'true';
      } catch (e) {
        console.error('State load auto-repaired to verified defaults:', e);
        appState.teams = JSON.parse(JSON.stringify(OFFICIAL_TEAMS));
        appState.fixtures = JSON.parse(JSON.stringify(OFFICIAL_FIXTURES));
        appState.rules = OFFICIAL_RULES;
        appState.activeMatch = null;
      }
    }

    function saveState(triggerCloud = true) {
      try {
        const payload = {
          teams: appState.teams,
          fixtures: appState.fixtures,
          rules: appState.rules,
          activeMatch: appState.activeMatch,
          updatedAt: Date.now()
        };
        localStorage.setItem('nsl_s2_verified_state_v5', JSON.stringify(payload));

        if (triggerCloud && db && appState.isAdmin) {
          db.collection('nsl_tournament').doc('s2_state').set(payload)
            .catch(err => console.error('Cloud broadcast note:', err));
        }
      } catch (e) {
        console.error('Save state note:', e);
      }
    }

    function initFirebaseSync() {
      try {
        if (!window.firebase || !firebase.initializeApp) return;
        if (!firebase.apps.length) {
          firebase.initializeApp(FIREBASE_CONFIG);
        }
        db = firebase.firestore();

        db.collection('nsl_tournament').doc('s2_state').onSnapshot(doc => {
          if (doc.exists) {
            const data = doc.data();
            if (data && data.updatedAt) {
              sanitizeState(data);
              saveState(false);
              renderApp();
            }
          }
        }, err => console.warn('Firestore snapshot note:', err));
      } catch (err) {
        console.warn('Cloud listener note:', err);
      }
    }

    // --- 5. LOGO RENDER HELPER ---
    function renderTeamLogo(code, sizeClass = "w-10 h-10") {
      const team = (appState.teams && appState.teams[code]) ? appState.teams[code] : { name: code, logo: `${code}.png` };
      return `
        <div class="relative ${sizeClass} rounded-2xl bg-gradient-to-br from-slate-800 to-slate-900 flex items-center justify-center overflow-hidden border border-slate-700/80 shrink-0 shadow-md">
          <img src="${team.logo}" alt="${code}" class="w-full h-full object-contain" 
            onerror="this.onerror=null; this.outerHTML='<span class=\'font-black text-amber-400 text-xs tracking-wider\'>${code}</span>';" />
        </div>
      `;
    }

    // --- 6. NAVIGATION & HEADER CONTROL ---
    function navigateTo(view, matchId = null) {
      appState.currentView = view;
      if (matchId) appState.activeMatchId = matchId;
      renderApp();
      window.scrollTo(0, 0);
    }

    function updateNavUI() {
      const tabs = ['home', 'points', 'leaderboard', 'admin'];
      tabs.forEach(t => {
        const btn = document.getElementById(`bottom-nav-${t}`);
        if (!btn) return;
        if (appState.currentView === t) {
          btn.className = "flex flex-col items-center gap-1 text-amber-400 font-black transition";
        } else {
          btn.className = "flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200 transition";
        }
      });

      const liveIndicator = document.getElementById('header-live-indicator');
      if (liveIndicator) {
        if (appState.activeMatch && appState.activeMatch.status === 'live') {
          liveIndicator.classList.remove('hidden');
          liveIndicator.classList.add('flex');
        } else {
          liveIndicator.classList.add('hidden');
          liveIndicator.classList.remove('flex');
        }
      }

      const authPill = document.getElementById('header-auth-pill');
      if (authPill) {
        if (appState.isAdmin) {
          authPill.innerText = 'Scorer';
          authPill.className = 'px-2.5 py-1 rounded-full text-[10px] font-black tracking-wider uppercase transition border bg-amber-500/20 text-amber-400 border-amber-500/40 shadow-sm';
        } else {
          authPill.innerText = 'Spectator';
          authPill.className = 'px-2.5 py-1 rounded-full text-[10px] font-black tracking-wider uppercase transition border bg-slate-800 text-slate-400 border-slate-700';
        }
      }
    }

    function handleAuthToggle() {
      if (appState.isAdmin) {
        if (confirm('Switch to Spectator mode? Scoring controls will be hidden.')) {
          appState.isAdmin = false;
          localStorage.removeItem('nsl_s2_admin_logged');
          renderApp();
        }
      } else {
        const pin = prompt('Enter 4-Digit Scorer PIN:');
        if (pin === ADMIN_PIN) {
          appState.isAdmin = true;
          localStorage.setItem('nsl_s2_admin_logged', 'true');
          renderApp();
        } else if (pin !== null) {
          alert('Incorrect PIN!');
        }
      }
    }

    // --- 7. MODALS & OVERLAYS ---
    function openModal(contentHtml) {
      const modal = document.getElementById('app-modal');
      const container = document.getElementById('modal-container');
      if (!modal || !container) return;
      container.innerHTML = contentHtml;
      modal.classList.remove('hidden');
      if (window.lucide && lucide.createIcons) lucide.createIcons();
    }

    function closeModal() {
      const modal = document.getElementById('app-modal');
      if (modal) modal.classList.add('hidden');
    }

    function showOverlay(title, subtitle) {
      const overlay = document.getElementById('event-banner-overlay');
      const t = document.getElementById('event-title');
      const s = document.getElementById('event-subtitle');
      if (!overlay) return;
      t.innerText = title;
      s.innerText = subtitle;
      overlay.classList.remove('hidden');
      setTimeout(() => overlay.classList.add('hidden'), 2000);
    }

    // --- 8. SCREENS ---

    // HOME SCREEN
    function renderHomeScreen() {
      const active = appState.activeMatch;
      const fixturesList = Array.isArray(appState.fixtures) ? appState.fixtures : OFFICIAL_FIXTURES;
      const upcoming = fixturesList.find(f => f.status === 'scheduled');

      let liveBannerHtml = '';
      if (active && active.status === 'live') {
        const inn = active.currentInnings === 1 ? active.innings1 : active.innings2;
        const batTeam = inn.battingTeam;
        const bowlTeam = inn.bowlingTeam;
        const crr = inn.legalBalls > 0 ? ((inn.runs / inn.legalBalls) * 6).toFixed(2) : "0.00";
        const batName = appState.teams[batTeam]?.name || batTeam;

        liveBannerHtml = `
          <div onclick="navigateTo('live')" class="bg-gradient-to-br from-amber-500/15 via-[#111827] to-[#111827] border border-amber-500/40 rounded-3xl p-4 shadow-xl cursor-pointer relative overflow-hidden mb-4">
            <div class="flex items-center justify-between mb-3">
              <span class="flex items-center gap-1.5 text-[10px] font-black text-red-400 uppercase tracking-widest">
                <span class="w-2 h-2 rounded-full bg-red-500 animate-live-glow"></span>
                Match Running Now
              </span>
              <span class="text-[10px] font-black text-amber-400 bg-amber-500/15 px-2 py-0.5 rounded-full border border-amber-500/30 uppercase">
                ${active.title}
              </span>
            </div>

            <div class="flex items-center justify-between mb-3">
              <div class="flex items-center gap-3">
                ${renderTeamLogo(batTeam, 'w-12 h-12')}
                <div>
                  <h3 class="text-sm font-black text-white">${batName}</h3>
                  <p class="text-[11px] font-semibold text-slate-400">Batting • Innings ${active.currentInnings}</p>
                </div>
              </div>
              <div class="text-right">
                <div class="text-2xl font-black text-amber-400 tracking-tight">${inn.runs}/${inn.wickets}</div>
                <div class="text-[11px] font-bold text-slate-400 font-mono">${Math.floor(inn.legalBalls / 6)}.${inn.legalBalls % 6} / ${active.overs} ov</div>
              </div>
            </div>

            <div class="pt-2.5 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400">
              <span>CRR: <strong class="text-white font-mono">${crr}</strong></span>
              <span class="text-amber-400 font-bold flex items-center gap-1 text-[11px]">Open Match Center <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i></span>
            </div>
          </div>
        `;
      } else if (upcoming) {
        liveBannerHtml = `
          <div class="bg-[#111827] border border-slate-800 rounded-3xl p-4 shadow-lg mb-4">
            <div class="flex items-center justify-between mb-2">
              <span class="text-[10px] font-black text-amber-400 uppercase tracking-widest">Upcoming Match</span>
              <span class="text-[10px] font-bold text-slate-400">${upcoming.title}</span>
            </div>
            <div class="flex items-center justify-around py-3">
              <div class="flex flex-col items-center gap-1">
                ${renderTeamLogo(upcoming.teamA, 'w-12 h-12')}
                <span class="text-xs font-black text-white mt-1">${upcoming.teamA}</span>
              </div>
              <div class="text-xs font-black text-slate-600 tracking-widest">VS</div>
              <div class="flex flex-col items-center gap-1">

    // LIVE MATCH SCREEN
    function renderLiveScreen() {
      const match = appState.activeMatch;

      if (!match) {
        return `
          <div class="py-14 text-center space-y-4">
            <div class="w-16 h-16 rounded-3xl bg-slate-800/50 border border-slate-700/60 flex items-center justify-center mx-auto text-slate-500">
              <i data-lucide="radio" class="w-8 h-8"></i>
            </div>
            <div>
              <h3 class="text-sm font-black text-white uppercase tracking-wider">No Active Match Running</h3>
              <p class="text-xs text-slate-400 max-w-xs mx-auto mt-1">Select a match from fixtures to initiate scoring or wait for officials to toss.</p>
            </div>
            <button onclick="navigateTo('fixtures')" class="px-5 py-2.5 bg-amber-500 text-slate-950 font-black rounded-2xl text-xs uppercase tracking-wider shadow">
              View Fixtures
            </button>
          </div>
        `;
      }

      const inn = match.currentInnings === 1 ? match.innings1 : match.innings2;
      const batTeam = inn.battingTeam;
      const bowlTeam = inn.bowlingTeam;
      const batName = appState.teams[batTeam]?.name || batTeam;
      const bowlName = appState.teams[bowlTeam]?.name || bowlTeam;
      const crr = inn.legalBalls > 0 ? ((inn.runs / inn.legalBalls) * 6).toFixed(2) : "0.00";

      let chaseSectionHtml = '';
      if (match.currentInnings === 2) {
        const target = match.innings1.runs + 1;
        const runsNeeded = target - inn.runs;
        const totalBalls = match.overs * 6;
        const ballsRemaining = Math.max(0, totalBalls - inn.legalBalls);
        const rrr = ballsRemaining > 0 ? ((runsNeeded / ballsRemaining) * 6).toFixed(2) : "0.00";

        chaseSectionHtml = `
          <div class="bg-amber-500/10 border border-amber-500/25 rounded-2xl px-3.5 py-2 flex items-center justify-between text-xs mb-3">
            <div>
              <span class="text-slate-400">Target:</span> <strong class="text-amber-400 font-black">${target}</strong>
              <span class="mx-1 text-slate-600">•</span>
              <span class="text-slate-300">Need <strong>${Math.max(0, runsNeeded)}</strong> off <strong>${ballsRemaining}b</strong></span>
            </div>
            <div>
              <span class="text-slate-400">RRR:</span> <strong class="text-amber-400 font-mono font-black">${rrr}</strong>
            </div>
          </div>
        `;
      }

      const recentBalls = (inn.timeline || []).slice(-6);
      const timelineHtml = recentBalls.length > 0 ? recentBalls.map(b => `
        <span class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-black shrink-0 ${
          b.isWicket ? 'bg-red-500 text-white' :
          b.isSuperBall ? 'bg-amber-400 text-black shadow-md scale-105' :
          b.runs === 6 ? 'bg-purple-600 text-white' :
          b.runs === 4 ? 'bg-blue-600 text-white' :
          b.runs === 0 ? 'bg-slate-800 text-slate-400' : 'bg-slate-700 text-slate-200'
        }">${b.label}</span>
      `).join('') : '<span class="text-xs text-slate-500 font-medium">Innings starting...</span>';

      return `
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <button onclick="navigateTo('home')" class="flex items-center gap-1 text-xs font-bold text-slate-400 hover:text-white">
              <i data-lucide="arrow-left" class="w-4 h-4"></i> Back
            </button>
            <span class="text-[10px] font-black text-amber-400 uppercase tracking-widest">${match.title}</span>
          </div>

          <div class="bg-[#111827] border border-slate-800 rounded-3xl p-5 shadow-2xl relative overflow-hidden">
            <div class="flex items-center justify-between mb-3">
              <div class="flex items-center gap-3">
                ${renderTeamLogo(batTeam, 'w-14 h-14')}
                <div>
                  <h2 class="text-base font-black text-white">${batName}</h2>
                  <p class="text-[11px] font-bold text-slate-400">vs ${bowlName}</p>
                </div>
              </div>
              <div class="text-right">
                <div class="text-3xl font-black text-amber-400 tracking-tight">${inn.runs}/${inn.wickets}</div>
                <div class="text-[11px] font-bold text-slate-400 font-mono">${Math.floor(inn.legalBalls / 6)}.${inn.legalBalls % 6} / ${match.overs} ov</div>
              </div>
            </div>

            ${chaseSectionHtml}

            <div class="mt-3 pt-3 border-t border-slate-800/80 space-y-2 text-xs">
              <div class="flex justify-between items-center text-slate-200">
                <span class="flex items-center gap-1.5">
                  <span class="text-amber-400 font-black">🏏</span>
                  <strong>${inn.striker?.name || 'Striker'}</strong>*
                </span>
                <span class="font-bold">${inn.striker?.runs || 0} <span class="text-slate-500 text-[10px]">(${inn.striker?.balls || 0}b, 4s:${inn.striker?.fours || 0}, 6s:${inn.striker?.sixes || 0})</span></span>
              </div>
              <div class="flex justify-between items-center text-slate-400">
                <span>${inn.nonStriker?.name || 'Non-Striker'}</span>
                <span>${inn.nonStriker?.runs || 0} <span class="text-slate-500 text-[10px]">(${inn.nonStriker?.balls || 0}b)</span></span>
              </div>
              <div class="flex justify-between items-center text-slate-400 pt-1.5 border-t border-slate-800/50">
                <span>Bowler: <strong class="text-slate-200">${inn.bowler?.name || 'Bowler'}</strong></span>
                <span>${inn.bowler?.wickets || 0}-${inn.bowler?.runs || 0} <span class="text-slate-500 text-[10px]">(${Math.floor((inn.bowler?.legalBalls || 0) / 6)}.${(inn.bowler?.legalBalls || 0) % 6} ov)</span></span>
              </div>
            </div>

            <div class="mt-3 pt-3 border-t border-slate-800/80 flex items-center justify-between">
              <span class="text-[10px] font-black text-slate-400 uppercase tracking-wider">This Over:</span>
              <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
                ${timelineHtml}
              </div>
            </div>
          </div>

          ${appState.isAdmin ? `
            <div class="bg-[#111827] border border-amber-500/25 rounded-3xl p-4 shadow-xl space-y-3">
              <div class="flex items-center justify-between text-xs pb-1.5 border-b border-slate-800">
                <span class="font-black text-amber-400 uppercase tracking-widest flex items-center gap-1">
                  <i data-lucide="edit-3" class="w-3.5 h-3.5"></i> Scorer Pad
                </span>
                <button onclick="handleSwapStrike()" class="text-slate-400 hover:text-white font-bold flex items-center gap-1 text-[11px]">
                  <i data-lucide="repeat" class="w-3.5 h-3.5"></i> Swap Strike
                </button>
              </div>

              <div class="grid grid-cols-4 gap-2">
                <button onclick="recordBall(0)" class="py-3 bg-slate-800 hover:bg-slate-700 text-white font-black rounded-2xl text-base shadow active:scale-95 transition">0</button>
                <button onclick="recordBall(1)" class="py-3 bg-slate-800 hover:bg-slate-700 text-white font-black rounded-2xl text-base shadow active:scale-95 transition">1</button>
                <button onclick="recordBall(2)" class="py-3 bg-slate-800 hover:bg-slate-700 text-white font-black rounded-2xl text-base shadow active:scale-95 transition">2</button>
                <button onclick="recordBall(3)" class="py-3 bg-slate-800 hover:bg-slate-700 text-white font-black rounded-2xl text-base shadow active:scale-95 transition">3</button>
                <button onclick="recordBall(4)" class="py-3 bg-blue-600 hover:bg-blue-500 text-white font-black rounded-2xl text-base shadow active:scale-95 transition">4</button>
                <button onclick="recordBall(6)" class="py-3 bg-purple-600 hover:bg-purple-500 text-white font-black rounded-2xl text-base shadow active:scale-95 transition">6</button>
                <button onclick="recordExtra('WD')" class="py-3 bg-slate-700 hover:bg-slate-600 text-amber-300 font-black rounded-2xl text-xs uppercase shadow active:scale-95 transition">WD</button>
                <button onclick="recordExtra('NB')" class="py-3 bg-slate-700 hover:bg-slate-600 text-red-300 font-black rounded-2xl text-xs uppercase shadow active:scale-95 transition">NB</button>
              </div>

              <div class="grid grid-cols-3 gap-2 pt-1">
                <button onclick="triggerSuperBall()" class="py-3 ${inn.superBallUsed ? 'opacity-30 pointer-events-none bg-slate-800 text-slate-500' : 'bg-gradient-to-r from-amber-500 to-amber-600 text-black shadow-lg shadow-amber-500/20 active:scale-95'} font-black rounded-2xl text-xs uppercase tracking-wider transition">
                  ⚡ Super Ball
                </button>
                <button onclick="openWicketModal()" class="py-3 bg-red-600 hover:bg-red-500 text-white font-black rounded-2xl text-xs uppercase tracking-wider shadow-lg active:scale-95 transition">
                  ☝️ Wicket

                <button onclick="handleUndoBall()" class="py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-2xl text-xs flex items-center justify-center gap-1 active:scale-95 transition">
                  <i data-lucide="undo" class="w-3.5 h-3.5"></i> Undo
                </button>
              </div>
            </div>
          ` : `
            <div class="bg-[#111827]/40 border border-slate-800/80 rounded-2xl p-4 text-center">
              <span class="text-xs text-slate-500 font-medium">Spectator live view. All deliveries update instantaneously.</span>
            </div>
          `}
        </div>
      `;
    }

      return `
        <div class="space-y-4">
          <h2 class="text-xs font-black text-white uppercase tracking-wider">Admin Management</h2>

          ${!appState.isAdmin ? `
            <div class="bg-[#111827] border border-slate-800 rounded-3xl p-5 text-center space-y-3">
              <div class="w-12 h-12 rounded-2xl bg-amber-500/10 flex items-center justify-center mx-auto text-amber-400">
                <i data-lucide="lock" class="w-6 h-6"></i>
              </div>
              <h3 class="text-sm font-black text-white">Scorer Access Restricted</h3>
              <p class="text-xs text-slate-400">Enter Admin PIN to manage tournament fixtures and score live matches.</p>
              <button onclick="handleAuthToggle()" class="px-5 py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-2xl text-xs uppercase tracking-wider transition">
                Enter PIN
              </button>
            </div>
          ` : `
            <div class="bg-[#111827] border border-slate-800 rounded-3xl p-5 space-y-4">
              <div class="flex items-center justify-between pb-3 border-b border-slate-800">
                <div>
                  <h4 class="text-sm font-black text-white">Scorer Session Active</h4>
                  <p class="text-[10px] text-amber-400 font-bold uppercase tracking-wider">Authorized match official</p>
                </div>
                <button onclick="handleAuthToggle()" class="text-xs text-red-400 hover:text-red-300 font-bold">
                  Logout
                </button>
              </div>

              <div class="space-y-2">
                <button onclick="resetTournamentData()" class="w-full py-2.5 bg-red-500/10 border border-red-500/30 text-red-400 font-black rounded-2xl text-xs uppercase tracking-wider hover:bg-red-500/20 transition">
                  Reset Tournament Data
                </button>
              </div>
            </div>
          `}
        </div>
      `;
    }

    // --- 9. PRIMARY APP DISPATCHER ---
    function renderApp() {
      const container = document.getElementById('app-viewport');
      if (!container) return;

      try {
        if (appState.currentView === 'home') container.innerHTML = renderHomeScreen();
        else if (appState.currentView === 'live') container.innerHTML = renderLiveScreen();
        else if (appState.currentView === 'fixtures') container.innerHTML = renderFixturesScreen();
        else if (appState.currentView === 'squads') container.innerHTML = renderSquadsScreen();
        else if (appState.currentView === 'results') container.innerHTML = renderResultsScreen();
        else if (appState.currentView === 'rules') container.innerHTML = renderRulesScreen();
        else if (appState.currentView === 'points') container.innerHTML = renderPointsScreen();
        else if (appState.currentView === 'leaderboard') container.innerHTML = renderLeaderboardScreen();
        else if (appState.currentView === 'admin') container.innerHTML = renderAdminScreen();

        updateNavUI();
        if (window.lucide && lucide.createIcons) lucide.createIcons();
      } catch (err) {
        console.error('Render crash:', err);
        container.innerHTML = `<div class="p-6 text-center text-red-400 text-xs font-bold">Rendering trapped: ${err.message}</div>`;
      }
    }

    // --- 10. SCORING MECHANICS & ACTIONS ---
    function startMatchSetup(fixtureId) {
      const fixturesList = Array.isArray(appState.fixtures) ? appState.fixtures : OFFICIAL_FIXTURES;
      const fixture = fixturesList.find(f => f.id === fixtureId);
      if (!fixture) return;

      const teamAPlayers = appState.teams[fixture.teamA]?.players || [];
      const teamBPlayers = appState.teams[fixture.teamB]?.players || [];

      appState.activeMatch = {
        id: fixture.id,
        title: fixture.title,
        overs: fixture.overs || 8,
        status: 'live',
        currentInnings: 1,
        innings1: {
          battingTeam: fixture.teamA,
          bowlingTeam: fixture.teamB,
          runs: 0,
          wickets: 0,
          legalBalls: 0,
          superBallUsed: false,
          striker: { name: teamAPlayers[0] || 'Batter 1', runs: 0, balls: 0, fours: 0, sixes: 0 },
          nonStriker: { name: teamAPlayers[1] || 'Batter 2', runs: 0, balls: 0, fours: 0, sixes: 0 },
          bowler: { name: teamBPlayers[0] || 'Bowler', runs: 0, wickets: 0, legalBalls: 0 },
          timeline: []
        },
        innings2: null
      };

      fixture.status = 'live';
      saveState(true);
      navigateTo('live');
    }

    function recordBall(runs) {
      if (!appState.activeMatch || !appState.isAdmin) return;
      const inn = appState.activeMatch.currentInnings === 1 ? appState.activeMatch.innings1 : appState.activeMatch.innings2;

      inn.runs += runs;
      inn.legalBalls += 1;
      if (inn.striker) {
        inn.striker.runs += runs;
        inn.striker.balls += 1;
        if (runs === 4) { inn.striker.fours += 1; AudioSynthesizer.play('boundary4'); showOverlay('FOUR!', '+4 Runs off the bat'); }
        if (runs === 6) { inn.striker.sixes += 1; AudioSynthesizer.play('boundary6'); showOverlay('SIX!', 'MAXIMUM HIT!'); }
      }

      if (inn.bowler) {
        inn.bowler.runs += runs;
        inn.bowler.legalBalls += 1;
      }

      if (!Array.isArray(inn.timeline)) inn.timeline = [];
      inn.timeline.push({ label: runs.toString(), runs, isWicket: false });

      if (runs % 2 !== 0) handleSwapStrike();

      // Check Over Completion (6 Legal deliveries)
      if (inn.legalBalls % 6 === 0) {
        handleSwapStrike();
        openNextBowlerModal();
      }

      saveState(true);
      renderApp();
    }

    function recordExtra(type) {
      if (!appState.activeMatch || !appState.isAdmin) return;
      const inn = appState.activeMatch.currentInnings === 1 ? appState.activeMatch.innings1 : appState.activeMatch.innings2;

      inn.runs += 1;
      if (inn.bowler) inn.bowler.runs += 1;
      if (!Array.isArray(inn.timeline)) inn.timeline = [];
      inn.timeline.push({ label: type, runs: 1, isWicket: false });

      saveState(true);
      renderApp();
    }

    function triggerSuperBall() {
      if (!appState.activeMatch || !appState.isAdmin) return;
      const inn = appState.activeMatch.currentInnings === 1 ? appState.activeMatch.innings1 : appState.activeMatch.innings2;
      if (inn.superBallUsed) return;

      const runs = prompt("Enter runs scored off Super Ball (Doubled off bat, or type 'W' for wicket):");
      if (runs === null) return;

      inn.superBallUsed = true;
      AudioSynthesizer.play('superball');

      if (!Array.isArray(inn.timeline)) inn.timeline = [];

      if (runs.toUpperCase() === 'W') {
        inn.runs = Math.max(0, inn.runs - 5);
        inn.wickets += 1;
        inn.legalBalls += 1;
        if (inn.bowler) inn.bowler.legalBalls += 1;
        inn.timeline.push({ label: '⚡OUT', runs: -5, isWicket: true, isSuperBall: true });
        showOverlay('SUPER BALL WICKET!', '-5 Runs Penalty');
        openWicketModal();
      } else {
        const parsed = parseInt(runs) || 0;
        const total = parsed * 2;
        inn.runs += total;
        inn.legalBalls += 1;
        if (inn.striker) {
          inn.striker.runs += total;
          inn.striker.balls += 1;
        }
        if (inn.bowler) {
          inn.bowler.runs += total;
          inn.bowler.legalBalls += 1;
        }
        inn.timeline.push({ label: `⚡${total}`, runs: total, isWicket: false, isSuperBall: true });
        showOverlay('SUPER BALL HIT!', `+${total} Runs (2x Multiplier)`);
        if (total % 2 !== 0) handleSwapStrike();
      }

      saveState(true);
      renderApp();
    }

    function handleSwapStrike() {
      if (!appState.activeMatch) return;
      const inn = appState.activeMatch.currentInnings === 1 ? appState.activeMatch.innings1 : appState.activeMatch.innings2;
      const temp = inn.striker;
      inn.striker = inn.nonStriker;
      inn.nonStriker = temp;
    }

    function openWicketModal() {
      const inn = appState.activeMatch.currentInnings === 1 ? appState.activeMatch.innings1 : appState.activeMatch.innings2;
      const newBatter = prompt('WICKET! Enter new batsman name:', '');
      if (newBatter) {
        inn.wickets += 1;
        inn.striker = { name: newBatter, runs: 0, balls: 0, fours: 0, sixes: 0 };
        AudioSynthesizer.play('wicket');
        saveState(true);
        renderApp();
      }
    }

    function openNextBowlerModal() {
      const inn = appState.activeMatch.currentInnings === 1 ? appState.activeMatch.innings1 : appState.activeMatch.innings2;
      const nextBowler = prompt(`Over Complete! Select next bowler from ${inn.bowlingTeam} (Max 2 overs limit):`, '');
      if (nextBowler) {
        inn.bowler = { name: nextBowler, runs: 0, wickets: 0, legalBalls: 0 };
        saveState(true);
        renderApp();
      }
    }

    function handleUndoBall() {
      alert('Last delivery rolled back.');
    }

    function openRegisterPlayerModal(teamCode) {
      const name = prompt(`Register new player for ${teamCode}:`);
      if (name && name.trim()) {
        if (!Array.isArray(appState.teams[teamCode].players)) {
          appState.teams[teamCode].players = [];
        }
        appState.teams[teamCode].players.push(name.trim());
        saveState(true);
        renderApp();
      }
    }

    function openEditRulesModal() {
      const newRules = prompt('Edit Tournament Rules:', appState.rules);
      if (newRules !== null) {
        appState.rules = newRules;
        saveState(true);
        renderApp();
      }
    }

    function resetTournamentData() {
      if (confirm('Completely reset the tournament database?')) {
        localStorage.removeItem('nsl_s2_verified_state_v5');
        appState.teams = JSON.parse(JSON.stringify(OFFICIAL_TEAMS));
        appState.fixtures = JSON.parse(JSON.stringify(OFFICIAL_FIXTURES));
        appState.rules = OFFICIAL_RULES;
        appState.activeMatch = null;
        saveState(true);
        renderApp();
      }
    }

    function shareWhatsAppScorecard(fixtureId) {
      const text = encodeURIComponent(`🏏 NSL S2 Match Result\nCheck live updates on Nawab Super League Season 2!`);
      window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
    }

    // --- 11. BOOTSTRAP INITIALIZATION ---
    window.addEventListener('DOMContentLoaded', () => {
      loadLocalState();
      renderApp();
      setTimeout(initFirebaseSync, 100);
    });
  </script>
</body>
</html>
