<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NSL S2 - Nawab Super League Season 2</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti for Celebrations -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Teko', 'sans-serif']
          },
          colors: {
            nsl: {
              gold: '#F59E0B',
              goldLight: '#FDE68A',
              dark: '#0B0F19',
              card: '#131A29',
              cardLight: '#1A2338',
              accent: '#3B82F6',
              danger: '#EF4444',
              success: '#10B981',
              super: '#8B5CF6'
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbar & Aesthetics */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #0B0F19;
    }
    ::-webkit-scrollbar-thumb {
      background: #2A364F;
      border-radius: 4px;
    }
    .text-glow-gold {
      text-shadow: 0 0 12px rgba(245, 158, 11, 0.4);
    }
    .text-glow-super {
      text-shadow: 0 0 14px rgba(139, 92, 246, 0.6);
    }
    .touch-target {
      touch-action: manipulation;
    }
    .pulse-glow {
      animation: pulseGlow 2s infinite;
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(245, 158, 11, 0.25); }
      50% { box-shadow: 0 0 25px rgba(245, 158, 11, 0.6); }
    }
    .badge-clip {
      clip-path: polygon(50% 0%, 100% 15%, 100% 85%, 50% 100%, 0% 85%, 0% 15%);
    }
  </style>
</head>
<body class="bg-[#080C14] text-slate-100 min-h-screen flex flex-col font-sans select-none antialiased">

  <!-- Top App Bar Header -->
  <header class="sticky top-0 z-40 bg-[#0E1524]/90 backdrop-blur-md border-b border-slate-800/80 px-4 py-2.5 flex items-center justify-between shadow-lg">
    <div class="flex items-center space-x-2.5 cursor-pointer" onclick="navigateTo('home')">
      <!-- League Trophy Shield SVG -->
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-600 via-amber-500 to-yellow-300 p-0.5 shadow-md shadow-amber-500/20 flex items-center justify-center">
        <div class="w-full h-full bg-[#0E1524] rounded-[10px] flex items-center justify-center">
          <i data-lucide="trophy" class="w-5 h-5 text-amber-400"></i>
        </div>
      </div>
      <div>
        <div class="flex items-center space-x-1.5">
          <span class="font-display text-2xl tracking-wider font-bold bg-gradient-to-r from-amber-400 via-yellow-200 to-amber-500 bg-clip-text text-transparent">NSL S2</span>
          <span class="text-[10px] px-1.5 py-0.5 rounded bg-amber-500/10 text-amber-400 font-bold border border-amber-500/30">8 OVERS</span>
        </div>
        <p class="text-[10px] text-slate-400 -mt-1 tracking-tight">Nawab Super League • 2026</p>
      </div>
    </div>

    <!-- Quick Utilities -->
    <div class="flex items-center space-x-2">
      <button onclick="openSettingsModal()" class="w-9 h-9 rounded-lg bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700/60 flex items-center justify-center text-slate-300 transition-colors">
        <i data-lucide="settings" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- Main View Container -->
  <main id="appContent" class="flex-1 max-w-2xl w-full mx-auto p-4 pb-24 overflow-x-hidden"></main>

  <!-- Persistent Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-[#0C1220]/95 backdrop-blur-lg border-t border-slate-800/90 py-1.5 px-2">
    <div class="max-w-md mx-auto grid grid-cols-6 gap-0.5">
      <button onclick="navigateTo('home')" id="nav-home" class="flex flex-col items-center justify-center py-1 rounded-lg text-slate-400 hover:text-amber-400 transition-colors">
        <i data-lucide="home" class="w-4 h-4"></i>
        <span class="text-[9px] mt-1 font-semibold">Home</span>
      </button>
      <button onclick="navigateTo('fixtures')" id="nav-fixtures" class="flex flex-col items-center justify-center py-1 rounded-lg text-slate-400 hover:text-amber-400 transition-colors">
        <i data-lucide="calendar" class="w-4 h-4"></i>
        <span class="text-[9px] mt-1 font-semibold">Fixtures</span>
      </button>
      <button onclick="navigateTo('points')" id="nav-points" class="flex flex-col items-center justify-center py-1 rounded-lg text-slate-400 hover:text-amber-400 transition-colors">
        <i data-lucide="table" class="w-4 h-4"></i>
        <span class="text-[9px] mt-1 font-semibold">Table</span>
      </button>
      <button onclick="navigateTo('squads')" id="nav-squads" class="flex flex-col items-center justify-center py-1 rounded-lg text-slate-400 hover:text-amber-400 transition-colors">
        <i data-lucide="users" class="w-4 h-4"></i>
        <span class="text-[9px] mt-1 font-semibold">Squads</span>
      </button>
      <button onclick="navigateTo('leaderboard')" id="nav-leaderboard" class="flex flex-col items-center justify-center py-1 rounded-lg text-slate-400 hover:text-amber-400 transition-colors">
        <i data-lucide="flame" class="w-4 h-4"></i>
        <span class="text-[9px] mt-1 font-semibold">Leaders</span>
      </button>
      <button onclick="navigateTo('updates')" id="nav-updates" class="flex flex-col items-center justify-center py-1 rounded-lg text-slate-400 hover:text-amber-400 transition-colors">
        <i data-lucide="bell" class="w-4 h-4"></i>
        <span class="text-[9px] mt-1 font-semibold">Updates</span>
      </button>
    </div>
  </nav>

  <!-- Modals Container -->
  <div id="modalContainer" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-3"></div>

  <script>
    /**
     * NSL S2 MASTER DATA STORE & CRICKET ENGINE
     */
    const STORAGE_KEY = 'NSL_S2_LEAGUE_STORE_V1';

    // Initial Teams Definition
    const INITIAL_TEAMS = {
      'KTG': {
        id: 'KTG',
        name: 'Khan Tigers',
        shortName: 'KTG',
        primaryColor: '#D97706', // Gold / Crimson
        secondaryColor: '#B91C1C',
        badgeBg: 'from-amber-600 via-stone-900 to-red-900',
        textColor: 'text-amber-400',
        captain: 'Arbaz M',
        squad: [
          'Arbaz M (C)', 'Azhar M', 'Farhan Iq', 'Farhan J',
          'Amir K', 'Adeel K', 'Zohaib Ir', 'Saqib G',
          'Ghayoor A', 'Faheem D', 'Ayaz D', 'Aliyan S'
        ]
      },
      'ASK': {
        id: 'ASK',
        name: 'Arslan Aslam Super Kings',
        shortName: 'ASK',
        primaryColor: '#2563EB', // Royal Blue & Gold
        secondaryColor: '#F59E0B',
        badgeBg: 'from-blue-600 via-blue-950 to-amber-500',
        textColor: 'text-blue-400',
        captain: 'Aslam K',
        squad: [
          'Aslam K (C)', 'Shahzad M', 'Kashif K', 'Zeeshan Iq',
          'Irfan F', 'Ali N', 'Noman Ij', 'Atif M',
          'Hasan J', 'Danish R'
        ]
      },
      'NKG': {
        id: 'NKG',
        name: 'Nawab Kings',
        shortName: 'NKG',
        primaryColor: '#7C3AED', // Deep Purple & Gold
        secondaryColor: '#F59E0B',
        badgeBg: 'from-purple-700 via-indigo-950 to-amber-500',
        textColor: 'text-purple-400',
        captain: 'AKHTIAR H',
        squad: [
          'AKHTIAR H (C)', 'Zeehsan Sh', 'Asim P', 'Amir Ib',
          'Sadeeq D', 'Rehan J', 'Shabeer D', 'Ali B',
          'Saqib S', 'Ayan A'
        ]
      },
      'ALW': {
        id: 'ALW',
        name: 'Ali Waly',
        shortName: 'ALW',
        primaryColor: '#059669', // Emerald Green & Silver
        secondaryColor: '#94A3B8',
        badgeBg: 'from-emerald-600 via-slate-900 to-emerald-950',
        textColor: 'text-emerald-400',
        captain: 'Imtiaz K',
        squad: [
          'Imtiaz K (C)', 'Saddam D', 'Ijaz H', 'Saqlain Ir',
          'Hasan Ch', 'Shahzad R', 'Bilal D', 'Asad D',
          'Azhar Cf', 'Aftab Im'
        ]
      }
    };

    // Initial 6-Match League Fixtures + Knockout + Final
    const INITIAL_FIXTURES = [
      { id: 1, type: 'LEAGUE', name: 'Match 1', teamA: 'ASK', teamB: 'KTG', status: 'unlocked', result: null, scorecard: null },
      { id: 2, type: 'LEAGUE', name: 'Match 2', teamA: 'ALW', teamB: 'NKG', status: 'locked', result: null, scorecard: null },
      { id: 3, type: 'LEAGUE', name: 'Match 3', teamA: 'ASK', teamB: 'ALW', status: 'locked', result: null, scorecard: null },
      { id: 4, type: 'LEAGUE', name: 'Match 4', teamA: 'KTG', teamB: 'NKG', status: 'locked', result: null, scorecard: null },
      { id: 5, type: 'LEAGUE', name: 'Match 5', teamA: 'ASK', teamB: 'NKG', status: 'locked', result: null, scorecard: null },
      { id: 6, type: 'LEAGUE', name: 'Match 6', teamA: 'ALW', teamB: 'KTG', status: 'locked', result: null, scorecard: null },
      { id: 7, type: 'PLAYOFF', name: 'Playoff (Knockout)', subtitle: '2nd vs 3rd Place', teamA: null, teamB: null, status: 'locked', result: null, scorecard: null },
      { id: 8, type: 'FINAL', name: 'Grand Final', subtitle: '1st Place vs Playoff Winner', teamA: null, teamB: null, status: 'locked', result: null, scorecard: null }
    ];

    // Global App State
    let AppState = {
      currentView: 'home',
      teams: JSON.parse(JSON.stringify(INITIAL_TEAMS)),
      fixtures: JSON.parse(JSON.stringify(INITIAL_FIXTURES)),
      playerStats: {}, // { playerName: { team, matches, runs, balls, fours, sixes, hs, wickets, overs, runsConceded, bestWickets, bestRuns } }
      matchUpdates: [], // Bulletins feed
      liveMatch: null // active match state if match in progress
    };

    // Initialize player stats database
    function initializePlayerStats() {
      const stats = {};
      Object.values(AppState.teams).forEach(team => {
        team.squad.forEach(player => {
          stats[player] = {
            name: player,
            team: team.id,
            matches: 0,
            innings: 0,
            runs: 0,
            balls: 0,
            fours: 0,
            sixes: 0,
            highScore: 0,
            notOuts: 0,
            overs: 0,
            legalBallsBowled: 0,
            runsConceded: 0,
            wickets: 0,
            bestWickets: 0,
            bestRuns: 999
          };
        });
      });
      AppState.playerStats = stats;
    }

    // Load from LocalStorage
    function loadSavedData() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          AppState = Object.assign(AppState, parsed);
        } else {
          initializePlayerStats();
          saveData();
        }
      } catch (err) {
        console.error('Error loading stored NSL data:', err);
        initializePlayerStats();
      }
    }

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(AppState));
      } catch (err) {
        console.error('Failed to save to localStorage:', err);
      }
    }

    function resetTournament() {
      if (confirm("Reset NSL S2 tournament? All match results, scores, and statistics will be wiped back to Match 1.")) {
        AppState.teams = JSON.parse(JSON.stringify(INITIAL_TEAMS));
        AppState.fixtures = JSON.parse(JSON.stringify(INITIAL_FIXTURES));
        AppState.matchUpdates = [];
        AppState.liveMatch = null;
        initializePlayerStats();
        saveData();
        closeModal();
        navigateTo('home');
      }
    }

    /**
     * UI NAVIGATION & ROUTER
     */
    function navigateTo(view, params = {}) {
      AppState.currentView = view;
      window.scrollTo(0, 0);

      // Update Navigation Active State
      document.querySelectorAll('nav button').forEach(btn => {
        btn.classList.remove('text-amber-400');
        btn.classList.add('text-slate-400');
      });
      const activeNav = document.getElementById(`nav-${view}`);
      if (activeNav) {
        activeNav.classList.remove('text-slate-400');
        activeNav.classList.add('text-amber-400');
      }

      const content = document.getElementById('appContent');
      content.innerHTML = '';

      switch (view) {
        case 'home':
          renderHomeScreen(content);
          break;
        case 'fixtures':
          renderFixturesScreen(content);
          break;
        case 'points':
          renderPointsScreen(content);
          break;
        case 'squads':
          renderSquadsScreen(content);
          break;
        case 'leaderboard':
          renderLeaderboardScreen(content, params);
          break;
        case 'awards':
          renderAwardsScreen(content);
          break;
        case 'updates':
          renderUpdatesScreen(content);
          break;
        case 'preMatch':
          renderPreMatchScreen(content, params.matchId);
          break;
        case 'scorecard':
          renderScorecardScreen(content);
          break;
        default:
          renderHomeScreen(content);
      }

      lucide.createIcons();
    }

    /**
     * TEAM BADGE GENERATOR
     */
    function renderTeamBadge(teamId, size = 'md') {
      const team = AppState.teams[teamId];
      if (!team) return `<div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center font-bold text-xs text-slate-300">TBD</div>`;

      let dim = 'w-10 h-10 text-xs';
      if (size === 'sm') dim = 'w-7 h-7 text-[10px]';
      if (size === 'lg') dim = 'w-14 h-14 text-base';
      if (size === 'xl') dim = 'w-20 h-20 text-xl';

      return `
        <div class="${dim} rounded-xl bg-gradient-to-br ${team.badgeBg} p-0.5 shadow-lg flex items-center justify-center border border-white/10 shrink-0">
          <div class="w-full h-full bg-[#0E1524]/75 rounded-[10px] flex flex-col items-center justify-center">
            <span class="font-display font-bold tracking-wider ${team.textColor}">${team.shortName}</span>
          </div>
        </div>
      `;
    }

    /**
     * 1. HOME SCREEN
     */
    function renderHomeScreen(container) {
      // Find current active match
      const nextMatch = AppState.fixtures.find(f => f.status === 'unlocked' && !f.result) || 
                        AppState.fixtures.find(f => f.status === 'in_progress') ||
                        AppState.fixtures[0];

      // Top Performer Snapshot
      const topRunScorer = getTopRunScorer();
      const topWicketTaker = getTopWicketTaker();

      container.innerHTML = `
        <div class="space-y-4">
          <!-- Hero Tournament Card -->
          <div class="relative overflow-hidden rounded-2xl bg-gradient-to-br from-[#172238] via-[#101726] to-[#0A0E17] border border-amber-500/30 p-5 shadow-2xl pulse-glow">
            <!-- Background Decorative Watermark -->
            <div class="absolute -right-8 -bottom-8 opacity-10 pointer-events-none font-display font-bold text-9xl text-amber-300">NSL</div>
            <div class="relative z-10">
              <div class="flex items-center justify-between mb-2">
                <span class="px-2.5 py-0.5 rounded-full text-[11px] font-extrabold uppercase tracking-wider bg-amber-500/20 text-amber-400 border border-amber-500/40">Official Manager</span>
                <span class="text-xs text-slate-400 flex items-center gap-1"><i data-lucide="shield" class="w-3.5 h-3.5 text-amber-400"></i> Season 2</span>
              </div>
              <h1 class="text-3xl font-display font-bold tracking-wide text-white">NAWAB SUPER LEAGUE</h1>
              <p class="text-xs text-slate-300 mt-1 max-w-xs">4 Heavyweight Teams • 8 Overs Clashes • The Super Ball Arena</p>

              <!-- Main Hero Action Button: START THE TOURNAMENT -->
              <div class="mt-4 pt-3 border-t border-slate-700/50">
                <button onclick="handleStartTournamentClick()" class="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-amber-500 via-amber-400 to-yellow-500 hover:from-amber-600 hover:to-yellow-600 text-slate-950 font-extrabold text-base tracking-wider uppercase shadow-lg shadow-amber-500/30 flex items-center justify-center space-x-2 transition-all transform active:scale-95 touch-target">
                  <i data-lucide="play" class="w-5 h-5 fill-slate-950"></i>
                  <span>${AppState.liveMatch ? 'RESUME LIVE MATCH' : 'START THE TOURNAMENT'}</span>
                </button>
              </div>
            </div>
          </div>

          <!-- Quick Access Action Tiles -->
          <div class="grid grid-cols-2 gap-3">
            <!-- Points Table Card -->
            <div onclick="navigateTo('points')" class="p-4 rounded-xl bg-[#11192B] border border-slate-800 hover:border-slate-700 transition cursor-pointer flex flex-col justify-between">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Standings</span>
                <i data-lucide="table" class="w-4 h-4 text-amber-400"></i>
              </div>
              <div class="mt-3">
                <div class="text-lg font-bold text-white">Points Table</div>
                <div class="text-[11px] text-slate-400 mt-0.5">NRR & Qualification race</div>
              </div>
            </div>

            <!-- Squads Card -->
            <div onclick="navigateTo('squads')" class="p-4 rounded-xl bg-[#11192B] border border-slate-800 hover:border-slate-700 transition cursor-pointer flex flex-col justify-between">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Rosters</span>
                <i data-lucide="users" class="w-4 h-4 text-blue-400"></i>
              </div>
              <div class="mt-3">
                <div class="text-lg font-bold text-white">4 Squads</div>
                <div class="text-[11px] text-slate-400 mt-0.5">Player career stats & profiles</div>
              </div>
            </div>

            <!-- Leaderboard Card -->
            <div onclick="navigateTo('leaderboard')" class="p-4 rounded-xl bg-[#11192B] border border-slate-800 hover:border-slate-700 transition cursor-pointer flex flex-col justify-between">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Rankings</span>
                <i data-lucide="flame" class="w-4 h-4 text-red-400"></i>
              </div>
              <div class="mt-3">
                <div class="text-lg font-bold text-white">Leaderboard</div>
                <div class="text-[11px] text-slate-400 mt-0.5">Most runs, wickets & sixes</div>
              </div>
            </div>

            <!-- Awards Card -->
            <div onclick="navigateTo('awards')" class="p-4 rounded-xl bg-[#11192B] border border-slate-800 hover:border-slate-700 transition cursor-pointer flex flex-col justify-between">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Spotlight</span>
                <i data-lucide="award" class="w-4 h-4 text-purple-400"></i>
              </div>
              <div class="mt-3">
                <div class="text-lg font-bold text-white">Awards Hub</div>
                <div class="text-[11px] text-slate-400 mt-0.5">Orange & Purple Cap leaders</div>
              </div>
            </div>
          </div>

          <!-- Live Awards Quick Widget -->
          <div class="rounded-xl bg-gradient-to-r from-[#121B2D] to-[#18233C] border border-slate-800 p-4">
            <div class="flex items-center justify-between pb-2 border-b border-slate-800">
              <div class="flex items-center space-x-2">
                <i data-lucide="sparkles" class="w-4 h-4 text-amber-400"></i>
                <span class="text-xs font-bold uppercase tracking-wider text-slate-200">Current NSL Leaders</span>
              </div>
              <button onclick="navigateTo('awards')" class="text-[11px] text-amber-400 hover:underline">View Awards &rarr;</button>
            </div>
            <div class="grid grid-cols-2 gap-3 mt-3">
              <div class="bg-black/30 p-2.5 rounded-lg border border-amber-500/20">
                <div class="text-[10px] text-amber-400 font-bold uppercase flex items-center gap-1">
                  <i data-lucide="crosshair" class="w-3 h-3"></i> Top Run Scorer
                </div>
                <div class="font-bold text-sm text-white mt-1 truncate">${topRunScorer ? topRunScorer.name : 'No matches yet'}</div>
                <div class="text-xs text-amber-300 font-display text-lg tracking-wide">${topRunScorer ? topRunScorer.runs + ' runs' : '-'}</div>
              </div>

              <div class="bg-black/30 p-2.5 rounded-lg border border-purple-500/20">
                <div class="text-[10px] text-purple-400 font-bold uppercase flex items-center gap-1">
                  <i data-lucide="target" class="w-3 h-3"></i> Most Wickets
                </div>
                <div class="font-bold text-sm text-white mt-1 truncate">${topWicketTaker ? topWicketTaker.name : 'No matches yet'}</div>
                <div class="text-xs text-purple-300 font-display text-lg tracking-wide">${topWicketTaker ? topWicketTaker.wickets + ' wickets' : '-'}</div>
              </div>
            </div>
          </div>

          <!-- Updates & Bulletins Recent Feed -->
          <div class="rounded-xl bg-[#11192B] border border-slate-800 p-4">
            <div class="flex items-center justify-between mb-3">
              <div class="flex items-center space-x-2">
                <i data-lucide="bell-ring" class="w-4 h-4 text-blue-400"></i>
                <span class="text-xs font-bold uppercase tracking-wider text-slate-200">Latest Match Bulletins</span>
              </div>
              <button onclick="navigateTo('updates')" class="text-[11px] text-blue-400 hover:underline">See All</button>
            </div>
            ${AppState.matchUpdates.length === 0 ? `
              <div class="text-center py-5 text-slate-400 text-xs">
                Tournament has not started yet. Match bulletins and key highlights will appear here after Match 1.
              </div>
            ` : `
              <div class="space-y-2">
                ${AppState.matchUpdates.slice(-2).reverse().map(update => `
                  <div class="p-3 bg-slate-900/70 border border-slate-800 rounded-lg">
                    <div class="flex items-center justify-between text-xs">
                      <span class="font-bold text-amber-400">${update.matchName}</span>
                      <span class="text-[10px] text-slate-400">${update.date}</span>
                    </div>
                    <div class="text-xs font-semibold text-white mt-1">${update.winnerTitle}</div>
                    <div class="text-[11px] text-slate-300 mt-0.5">${update.highlightSummary}</div>
                  </div>
                `).join('')}
              </div>
            `}
          </div>
        </div>
      `;
    }

    function handleStartTournamentClick() {
      if (AppState.liveMatch) {
        navigateTo('scorecard');
        return;
      }
      // Navigate to Fixtures screen
      navigateTo('fixtures');
    }

    /**
     * 2. FIXTURES MENU (Sequential Locking Engine)
     */

    function updatePlayoffAndFinalParticipants() {
      // Check if Match 1 to 6 are all completed
      const leagueMatches = AppState.fixtures.filter(f => f.type === 'LEAGUE');
      const allLeagueFinished = leagueMatches.every(m => m.status === 'completed');

      const playoff = AppState.fixtures.find(f => f.type === 'PLAYOFF');
      const finalMatch = AppState.fixtures.find(f => f.type === 'FINAL');

      if (allLeagueFinished) {
        // Compute rankings
        const standings = calculatePointsTable();
        // 1st place -> directly to final
        // 2nd vs 3rd -> Playoff Knockout
        if (playoff && playoff.status === 'locked') {
          playoff.teamA = standings[1].id; // 2nd
          playoff.teamB = standings[2].id; // 3rd
          playoff.status = 'unlocked';
        }

        if (finalMatch) {
          finalMatch.teamA = standings[0].id; // 1st
          if (playoff && playoff.status === 'completed' && playoff.result) {
            finalMatch.teamB = playoff.result.winner;
            if (finalMatch.status === 'locked') {
              finalMatch.status = 'unlocked';
            }
          }
        }
        saveData();
      }
    }

    /**
     * 3. POINTS TABLE WITH DYNAMIC NRR
     */
    function calculatePointsTable() {
      const table = {};
      Object.keys(AppState.teams).forEach(id => {
        table[id] = {
          id: id,
          name: AppState.teams[id].name,
          shortName: AppState.teams[id].shortName,
          p: 0,
          w: 0,
          l: 0,
          t: 0,
          pts: 0,
          runsScored: 0,
          legalBallsFaced: 0,
          runsConceded: 0,
          legalBallsBowled: 0,
          nrr: 0.000
        };
      });

      // Compute from completed league fixtures
      AppState.fixtures.filter(f => f.type === 'LEAGUE' && f.status === 'completed' && f.result).forEach(match => {
        const tA = match.result.teamA;
        const tB = match.result.teamB;

        table[tA.id].p += 1;
        table[tB.id].p += 1;

        // Scores calculation for NRR
        // Innings 1
        const inn1Team = match.scorecard.inn1.battingTeam;
        const inn1BowlTeam = match.scorecard.inn1.bowlingTeam;
        const inn1Runs = match.scorecard.inn1.runs;
        const inn1Balls = match.scorecard.inn1.legalBalls;

        // Innings 2
        const inn2Team = match.scorecard.inn2.battingTeam;
        const inn2BowlTeam = match.scorecard.inn2.bowlingTeam;
        const inn2Runs = match.scorecard.inn2.runs;
        const inn2Balls = match.scorecard.inn2.legalBalls;

        table[inn1Team].runsScored += inn1Runs;
        // In 8 overs cricket: if team is all out, count full quota (48 balls)
        const inn1BallsCount = match.scorecard.inn1.isAllOut ? 48 : inn1Balls;
        table[inn1Team].legalBallsFaced += inn1BallsCount;

        table[inn1BowlTeam].runsConceded += inn1Runs;
        table[inn1BowlTeam].legalBallsBowled += inn1BallsCount;

        table[inn2Team].runsScored += inn2Runs;
        const inn2BallsCount = match.scorecard.inn2.isAllOut ? 48 : inn2Balls;
        table[inn2Team].legalBallsFaced += inn2BallsCount;

        table[inn2BowlTeam].runsConceded += inn2Runs;
        table[inn2BowlTeam].legalBallsBowled += inn2BallsCount;

        // Points
        if (match.result.isTie) {
          table[tA.id].t += 1;
          table[tB.id].t += 1;
          table[tA.id].pts += 1;
          table[tB.id].pts += 1;
        } else if (match.result.winner === tA.id) {
          table[tA.id].w += 1;
          table[tA.id].pts += 2;
          table[tB.id].l += 1;
        } else if (match.result.winner === tB.id) {
          table[tB.id].w += 1;
          table[tB.id].pts += 2;
          table[tA.id].l += 1;
        }
      });

      // Calculate NRR for each team
      const standings = Object.values(table).map(t => {
        let forRate = 0;
        let againstRate = 0;

        if (t.legalBallsFaced > 0) {
          const oversFaced = Math.floor(t.legalBallsFaced / 6) + (t.legalBallsFaced % 6) / 6;
          forRate = t.runsScored / (oversFaced || 1);
        }
        if (t.legalBallsBowled > 0) {
          const oversBowled = Math.floor(t.legalBallsBowled / 6) + (t.legalBallsBowled % 6) / 6;
          againstRate = t.runsConceded / (oversBowled || 1);
        }

        t.nrr = (forRate - againstRate);
        return t;
      });

      // Sort by Points descending, then NRR descending
      standings.sort((a, b) => {
        if (b.pts !== a.pts) return b.pts - a.pts;
        return b.nrr - a.nrr;
      });

      return standings;
    }

    /**
     * 6. AWARDS SECTION (Real-Time Dynamic Spotlight)
     */
    function getTopRunScorer() {
      const players = Object.values(AppState.playerStats).filter(p => p.runs > 0);
      if (players.length === 0) return null;
      players.sort((a, b) => b.runs - a.runs);
      return players[0];
    }

    function getTopWicketTaker() {
      const players = Object.values(AppState.playerStats).filter(p => p.wickets > 0);
      if (players.length === 0) return null;
      players.sort((a, b) => b.wickets - a.wickets);
      return players[0];
    }

    function getTopSixHitter() {
      const players = Object.values(AppState.playerStats).filter(p => p.sixes > 0);
      if (players.length === 0) return null;
      players.sort((a, b) => b.sixes - a.sixes);
      return players[0];
    }

    /**
     * PRE-MATCH SETUP WIZARD
     */
    let preMatchState = {
      matchId: null,
      teamA: null,
      teamB: null,
      playingSquadA: [],
      playingSquadB: [],
      tossWinner: null,
      tossDecision: null, // 'bat' or 'bowl'
      striker: null,
      nonStriker: null,
      openingBowler: null,
      step: 1 // 1: Squad selection, 2: Toss, 3: Openers
    };

    function startMatchSetup(matchId) {
      const match = AppState.fixtures.find(f => f.id === matchId);
      if (!match) return;

      // If already has live match in progress for this match, resume directly
      if (AppState.liveMatch && AppState.liveMatch.fixtureId === matchId) {
        navigateTo('scorecard');
        return;
      }

      preMatchState.matchId = matchId;
      preMatchState.teamA = match.teamA;
      preMatchState.teamB = match.teamB;

      // Pre-select default players (up to 11, or all 10 if team has 10)
      const squadA = AppState.teams[match.teamA].squad;
      const squadB = AppState.teams[match.teamB].squad;

      preMatchState.playingSquadA = squadA.slice(0, Math.min(11, squadA.length));
      preMatchState.playingSquadB = squadB.slice(0, Math.min(11, squadB.length));
      preMatchState.tossWinner = match.teamA;
      preMatchState.tossDecision = 'bat';
      preMatchState.striker = null;
      preMatchState.nonStriker = null;
      preMatchState.openingBowler = null;
      preMatchState.step = 1;

      navigateTo('preMatch', { matchId });
    }

    function renderPreMatchScreen(container, matchId) {
      const teamA = AppState.teams[preMatchState.teamA];
      const teamB = AppState.teams[preMatchState.teamB];

      container.innerHTML = `
        <div class="space-y-4">
          <!-- Step Indicator -->
          <div class="flex items-center justify-between pb-2 border-b border-slate-800">
            <button onclick="navigateTo('fixtures')" class="text-xs text-slate-400 hover:text-white flex items-center gap-1">

            </button>
            <span class="text-xs font-bold text-amber-400 uppercase tracking-wider">Pre-Match Setup (${preMatchState.step}/3)</span>
          </div>

          ${preMatchState.step === 1 ? renderPreMatchStep1(teamA, teamB) : ''}
          ${preMatchState.step === 2 ? renderPreMatchStep2(teamA, teamB) : ''}
          ${preMatchState.step === 3 ? renderPreMatchStep3() : ''}
        </div>
      `;
    }

    // Step 1: Select Playing Squad
    function renderPreMatchStep1(teamA, teamB) {
      return `
        <div class="space-y-4">
          <div>
            <h3 class="text-lg font-bold text-white">Select Playing Squad</h3>
            <p class="text-xs text-slate-400">Confirm the lineup for both teams (Khan Tigers has 12 players; other teams have 10 players).</p>
          </div>

          <!-- Team A Selection -->
          <div class="rounded-xl border border-slate-800 bg-[#0E1524] p-3.5 space-y-2">
            <div class="flex items-center justify-between">
              <div class="flex items-center space-x-2">
                ${renderTeamBadge(teamA.id, 'sm')}
                <span class="font-bold text-xs text-white">${teamA.name}</span>
              </div>
              <span class="text-[11px] font-bold text-amber-400" id="count-team-a">${preMatchState.playingSquadA.length} Selected</span>
            </div>
            <div class="grid grid-cols-2 gap-1.5 pt-2 max-h-48 overflow-y-auto">
              ${teamA.squad.map(player => `
                <label class="flex items-center space-x-2 text-xs p-2 rounded bg-slate-900/80 border border-slate-800 cursor-pointer">
                  <input type="checkbox" onchange="togglePlayerSelection('A', '${player.replace(/'/g, "\\'")}')" ${preMatchState.playingSquadA.includes(player) ? 'checked' : ''} class="rounded border-slate-700 text-amber-500 focus:ring-0">
                  <span class="truncate text-slate-200">${player}</span>
                </label>
              `).join('')}
            </div>
          </div>

          <!-- Team B Selection -->
          <div class="rounded-xl border border-slate-800 bg-[#0E1524] p-3.5 space-y-2">
            <div class="flex items-center justify-between">
              <div class="flex items-center space-x-2">
                ${renderTeamBadge(teamB.id, 'sm')}
                <span class="font-bold text-xs text-white">${teamB.name}</span>
              </div>
              <span class="text-[11px] font-bold text-amber-400" id="count-team-b">${preMatchState.playingSquadB.length} Selected</span>
            </div>
            <div class="grid grid-cols-2 gap-1.5 pt-2 max-h-48 overflow-y-auto">
              ${teamB.squad.map(player => `
                <label class="flex items-center space-x-2 text-xs p-2 rounded bg-slate-900/80 border border-slate-800 cursor-pointer">
                  <input type="checkbox" onchange="togglePlayerSelection('B', '${player.replace(/'/g, "\\'")}')" ${preMatchState.playingSquadB.includes(player) ? 'checked' : ''} class="rounded border-slate-700 text-amber-500 focus:ring-0">

          </button>

    function togglePlayerSelection(teamCode, player) {
      if (teamCode === 'A') {
        if (preMatchState.playingSquadA.includes(player)) {
          if (preMatchState.playingSquadA.length <= 8) {
            showToast("Minimum 8 players required in playing squad!");
            return;
          }
          preMatchState.playingSquadA = preMatchState.playingSquadA.filter(p => p !== player);
        } else {
          preMatchState.playingSquadA.push(player);
        }
        document.getElementById('count-team-a').innerText = `${preMatchState.playingSquadA.length} Selected`;
      } else {
        if (preMatchState.playingSquadB.includes(player)) {
          if (preMatchState.playingSquadB.length <= 8) {
            showToast("Minimum 8 players required in playing squad!");
            return;
          }
          preMatchState.playingSquadB = preMatchState.playingSquadB.filter(p => p !== player);
        } else {
          preMatchState.playingSquadB.push(player);
        }
        document.getElementById('count-team-b').innerText = `${preMatchState.playingSquadB.length} Selected`;
      }
    }

    // Step 2: Toss & Decision
    function renderPreMatchStep2(teamA, teamB) {
      return `
        <div class="space-y-4">
          <div>
            <h3 class="text-lg font-bold text-white">The Toss</h3>
            <p class="text-xs text-slate-400">Select which team won the toss and their elected decision.</p>
          </div>

          <!-- Toss Winner Selection -->
          <div class="rounded-xl border border-slate-800 bg-[#0E1524] p-4 space-y-3">
            <label class="text-xs font-bold text-slate-300 uppercase tracking-wider block">Toss Won By</label>
            <div class="grid grid-cols-2 gap-2">
              <button onclick="setTossWinner('${teamA.id}')" class="p-3 rounded-xl border flex flex-col items-center justify-center transition-all ${preMatchState.tossWinner === teamA.id ? 'bg-amber-500/20 border-amber-500 text-amber-400' : 'bg-slate-900 border-slate-800 text-slate-300'}">
                ${renderTeamBadge(teamA.id, 'sm')}
                <span class="text-xs font-bold mt-2">${teamA.name}</span>
              </button>

              <button onclick="setTossWinner('${teamB.id}')" class="p-3 rounded-xl border flex flex-col items-center justify-center transition-all ${preMatchState.tossWinner === teamB.id ? 'bg-amber-500/20 border-amber-500 text-amber-400' : 'bg-slate-900 border-slate-800 text-slate-300'}">
                ${renderTeamBadge(teamB.id, 'sm')}
                <span class="text-xs font-bold mt-2">${teamB.name}</span>
              </button>
            </div>
          </div>

          <!-- Elected Decision -->
          <div class="rounded-xl border border-slate-800 bg-[#0E1524] p-4 space-y-3">
            <label class="text-xs font-bold text-slate-300 uppercase tracking-wider block">Elected To</label>
            <div class="grid grid-cols-2 gap-2">
              <button onclick="setTossDecision('bat')" class="py-3 px-4 rounded-xl border flex items-center justify-center space-x-2 font-bold text-xs uppercase transition-all ${preMatchState.tossDecision === 'bat' ? 'bg-emerald-500/20 border-emerald-500 text-emerald-400' : 'bg-slate-900 border-slate-800 text-slate-400'}">
                <i data-lucide="crosshair" class="w-4 h-4"></i>
                <span>Bat First</span>
              </button>

              <button onclick="setTossDecision('bowl')" class="py-3 px-4 rounded-xl border flex items-center justify-center space-x-2 font-bold text-xs uppercase transition-all ${preMatchState.tossDecision === 'bowl' ? 'bg-purple-500/20 border-purple-500 text-purple-400' : 'bg-slate-900 border-slate-800 text-slate-400'}">
                <i data-lucide="circle-dot" class="w-4 h-4"></i>
                <span>Bowl First</span>
              </button>
            </div>
          </div>

          <div class="flex items-center space-x-2">
            <button onclick="goToPreMatchStep(1)" class="w-1/3 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs uppercase">
              Back
            </button>
            <button onclick="goToPreMatchStep(3)" class="w-2/3 py-3 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold text-sm uppercase tracking-wider shadow-lg flex items-center justify-center space-x-1.5 touch-target">
              <span>Next: Opening Lineup</span>
              <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      `;
    }

    function setTossWinner(teamId) {
      preMatchState.tossWinner = teamId;
      renderPreMatchScreen(document.getElementById('appContent'), preMatchState.matchId);
      lucide.createIcons();
    }
    function setTossDecision(decision) {
      preMatchState.tossDecision = decision;
      renderPreMatchScreen(document.getElementById('appContent'), preMatchState.matchId);
      lucide.createIcons();
    }

    // Step 3: Select Openers (Striker, Non-Striker, Opening Bowler)
    function renderPreMatchStep3() {
      // Determine batting & bowling team for 1st innings
      let battingTeamId, bowlingTeamId;
      if (preMatchState.tossDecision === 'bat') {
        battingTeamId = preMatchState.tossWinner;
        bowlingTeamId = preMatchState.tossWinner === preMatchState.teamA ? preMatchState.teamB : preMatchState.teamA;
      } else {
        bowlingTeamId = preMatchState.tossWinner;
        battingTeamId = preMatchState.tossWinner === preMatchState.teamA ? preMatchState.teamB : preMatchState.teamA;
      }

      const battingSquad = battingTeamId === preMatchState.teamA ? preMatchState.playingSquadA : preMatchState.playingSquadB;
      const bowlingSquad = bowlingTeamId === preMatchState.teamA ? preMatchState.playingSquadA : preMatchState.playingSquadB;

      if (!preMatchState.striker && battingSquad.length > 0) preMatchState.striker = battingSquad[0];
      if (!preMatchState.nonStriker && battingSquad.length > 1) preMatchState.nonStriker = battingSquad[1];
      if (!preMatchState.openingBowler && bowlingSquad.length > 0) preMatchState.openingBowler = bowlingSquad[0];

      return `
        <div class="space-y-4">
          <div>
            <h3 class="text-lg font-bold text-white">Opening Setup</h3>
            <p class="text-xs text-slate-400">Choose the opening pair and bowler for Innings 1.</p>
          </div>

          <!-- Batting Team Selection -->
          <div class="rounded-xl border border-slate-800 bg-[#0E1524] p-4 space-y-3">
            <div class="flex items-center space-x-2">
              <span class="text-xs font-bold text-emerald-400 uppercase tracking-wider">Batting:</span>
              <span class="font-bold text-sm text-white">${AppState.teams[battingTeamId].name}</span>
            </div>

            <div class="space-y-2">
              <div>
                <label class="text-[10px] text-slate-400 font-bold uppercase block mb-1">Striker</label>
                <select id="select-striker" onchange="preMatchState.striker = this.value" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white">
                  ${battingSquad.map(p => `
                    <option value="${p}" ${preMatchState.striker === p ? 'selected' : ''}>${p}</option>
                  `).join('')}
                </select>
              </div>

              <div>
                <label class="text-[10px] text-slate-400 font-bold uppercase block mb-1">Non-Striker</label>
                <select id="select-non-striker" onchange="preMatchState.nonStriker = this.value" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white">
                  ${battingSquad.map(p => `
                    <option value="${p}" ${preMatchState.nonStriker === p ? 'selected' : ''}>${p}</option>
                  `).join('')}
                </select>
              </div>
            </div>
          </div>

          <!-- Bowling Team Selection -->
          <div class="rounded-xl border border-slate-800 bg-[#0E1524] p-4 space-y-3">
            <div class="flex items-center space-x-2">
              <span class="text-xs font-bold text-purple-400 uppercase tracking-wider">Bowling:</span>
              <span class="font-bold text-sm text-white">${AppState.teams[bowlingTeamId].name}</span>
            </div>

            <div>
              <label class="text-[10px] text-slate-400 font-bold uppercase block mb-1">Opening Bowler</label>
              <select id="select-bowler" onchange="preMatchState.openingBowler = this.value" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white">
                ${bowlingSquad.map(p => `
                  <option value="${p}" ${preMatchState.openingBowler === p ? 'selected' : ''}>${p}</option>
                `).join('')}
              </select>
            </div>
          </div>

          <div class="flex items-center space-x-2">
            <button onclick="goToPreMatchStep(2)" class="w-1/3 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs uppercase">
              Back
            </button>
            <button onclick="launchLiveMatchEngine()" class="w-2/3 py-3.5 rounded-xl bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-600 hover:to-yellow-600 text-slate-950 font-black text-sm uppercase tracking-wider shadow-lg flex items-center justify-center space-x-2 touch-target">
              <i data-lucide="play" class="w-4 h-4 fill-slate-950"></i>
              <span>START SCORECARD</span>
            </button>
          </div>
        </div>
      `;
    }

    function goToPreMatchStep(step) {
      preMatchState.step = step;
      renderPreMatchScreen(document.getElementById('appContent'), preMatchState.matchId);
      lucide.createIcons();
    }

    /**
     * MATCH LAUNCH & SCORECARD ENGINE STATE
     */
    function launchLiveMatchEngine() {
      if (preMatchState.striker === preMatchState.nonStriker) {
        showToast("Striker and Non-Striker cannot be the same player!");
        return;
      }

      let battingTeamId, bowlingTeamId;
      if (preMatchState.tossDecision === 'bat') {
        battingTeamId = preMatchState.tossWinner;
        bowlingTeamId = preMatchState.tossWinner === preMatchState.teamA ? preMatchState.teamB : preMatchState.teamA;
      } else {
        bowlingTeamId = preMatchState.tossWinner;
        battingTeamId = preMatchState.tossWinner === preMatchState.teamA ? preMatchState.teamB : preMatchState.teamA;
      }

      const fixture = AppState.fixtures.find(f => f.id === preMatchState.matchId);
      fixture.status = 'in_progress';

      const battingSquad = battingTeamId === preMatchState.teamA ? [...preMatchState.playingSquadA] : [...preMatchState.playingSquadB];
      const bowlingSquad = bowlingTeamId === preMatchState.teamA ? [...preMatchState.playingSquadA] : [...preMatchState.playingSquadB];

      // Initialize Live Match Object
      AppState.liveMatch = {
        fixtureId: preMatchState.matchId,
        matchName: fixture.name,
        teamA: preMatchState.teamA,
        teamB: preMatchState.teamB,
        playingSquadA: preMatchState.playingSquadA,
        playingSquadB: preMatchState.playingSquadB,
        tossWinner: preMatchState.tossWinner,
        tossDecision: preMatchState.tossDecision,
        currentInnings: 1, // 1 or 2
        totalOversPerInnings: 8,
        freeHit: false, // active next delivery is free hit
        superBallActive: false, // active super ball on this delivery
        superBallUsedThisInnings: false, // max 1 per innings
        superBallCaller: null, // batter who called it
        target: null, // target for 2nd innings
        history: [], // undo stack

        // Innings 1
        inn1: {
          battingTeam: battingTeamId,
          bowlingTeam: bowlingTeamId,
          runs: 0,
          wickets: 0,
          legalBalls: 0,
          oversText: '0.0',
          currentOverBalls: [], // ['1', '0', 'Wd', '6']
          isAllOut: false,
          striker: preMatchState.striker,
          nonStriker: preMatchState.nonStriker,
          bowler: preMatchState.openingBowler,
          batters: battingSquad.map(name => ({
            name,
            team: battingTeamId,
            runs: 0,
            balls: 0,
            fours: 0,
            sixes: 0,
            isOut: false,
            dismissal: ''
          })),
          bowlers: bowlingSquad.map(name => ({
            name,
            team: bowlingTeamId,
            legalBalls: 0,
            oversText: '0.0',
            runsConceded: 0,
            wickets: 0
          }))
        },

        // Innings 2 template (populated at innings break)
        inn2: null
      };

      saveData();
      navigateTo('scorecard');
    }

    /**
     * 8. LIVE SCORECARD SCREEN (8 OVERS, SUPER BALL, FREE HIT, ZERO BYE/LB)
     */
    function renderScorecardScreen(container) {
      const match = AppState.liveMatch;
      if (!match) {
        navigateTo('fixtures');
        return;
      }

      const inn = match.currentInnings === 1 ? match.inn1 : match.inn2;
      const battingTeam = AppState.teams[inn.battingTeam];
      const bowlingTeam = AppState.teams[inn.bowlingTeam];

      const strikerObj = inn.batters.find(b => b.name === inn.striker) || { runs: 0, balls: 0, fours: 0, sixes: 0 };
      const nonStrikerObj = inn.batters.find(b => b.name === inn.nonStriker) || { runs: 0, balls: 0, fours: 0, sixes: 0 };
      const bowlerObj = inn.bowlers.find(b => b.name === inn.bowler) || { oversText: '0.0', runsConceded: 0, wickets: 0 };

      // Current over number (1-based: 1 to 8)
      const currentOverIndex = Math.floor(inn.legalBalls / 6) + 1;
      const isSuperBallEligible = currentOverIndex >= 2 && currentOverIndex <= 7 && !match.superBallUsedThisInnings;

      container.innerHTML = `
        <div class="space-y-3">
          <!-- Scorecard Header -->
          <div class="flex items-center justify-between pb-1 border-b border-slate-800">
            <div class="flex items-center space-x-2">
              <span class="text-xs font-bold text-amber-400 uppercase tracking-wider">${match.matchName}</span>
              <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-300">INN ${match.currentInnings} of 2</span>
            </div>
            <div class="flex items-center space-x-1.5">
              <button onclick="undoLastBall()" class="px-2 py-1 rounded bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] font-bold flex items-center gap-1 border border-slate-700">
                <i data-lucide="rotate-ccw" class="w-3 h-3"></i> Undo
              </button>
            </div>
          </div>

          <!-- Free Hit / Super Ball Live Active Banners -->
          ${match.freeHit ? `
            <div class="bg-red-500/20 border border-red-500 text-red-400 text-xs font-black py-1 px-3 rounded-lg flex items-center justify-between animate-pulse">
              <span class="flex items-center gap-1.5"><i data-lucide="alert-triangle" class="w-4 h-4"></i> FREE HIT ACTIVE!</span>
              <span class="text-[10px] font-bold">Only Run-Out applies</span>
            </div>
          ` : ''}

          ${match.superBallActive ? `
            <div class="bg-purple-600/30 border-2 border-purple-500 text-purple-200 text-xs font-black py-1.5 px-3 rounded-lg flex items-center justify-between animate-bounce">
              <span class="flex items-center gap-1.5"><i data-lucide="zap" class="w-4 h-4 text-purple-300"></i> SUPER BALL ACTIVE!</span>
              <span class="text-[10px] text-purple-300 font-bold">2X Runs • -5 Pts if Dismissed</span>
            </div>
          ` : ''}

          <!-- Live Score Header Board -->
          <div class="rounded-2xl bg-gradient-to-br from-[#131B2D] via-[#0E1524] to-[#080C14] border border-amber-500/30 p-4 shadow-xl">
            <div class="flex items-center justify-between">
              <div class="flex items-center space-x-2.5">
                ${renderTeamBadge(battingTeam.id, 'sm')}
                <div>
                  <h3 class="font-display text-xl font-bold text-white tracking-wide">${battingTeam.name}</h3>
                  <div class="text-[10px] text-slate-400">vs ${bowlingTeam.shortName}</div>
                </div>
              </div>

              <div class="text-right">
                <div class="font-display text-4xl font-bold text-amber-400 tracking-wider">
                  ${inn.runs}<span class="text-slate-400 text-2xl font-normal">/${inn.wickets}</span>
                </div>
                <div class="text-xs text-slate-300 font-medium">
                  Overs: <strong class="text-white">${Math.floor(inn.legalBalls / 6)}.${inn.legalBalls % 6}</strong> / 8.0
                </div>
              </div>
            </div>

            <!-- 2nd Innings Target Tracker -->
            ${match.currentInnings === 2 ? `
              <div class="mt-3 pt-2.5 border-t border-slate-800 flex items-center justify-between text-xs">
                <span class="text-slate-300">Target: <strong class="text-amber-400">${match.target}</strong></span>
                <span class="text-slate-300">Need: <strong class="text-emerald-400">${Math.max(0, match.target - inn.runs)}</strong> from <strong class="text-emerald-400">${48 - inn.legalBalls}</strong> balls</span>
              </div>
            ` : ''}

            <!-- Current Over Balls Timeline -->
            <div class="mt-3 pt-2 border-t border-slate-800/80">
              <div class="text-[10px] text-slate-400 uppercase font-bold tracking-wider mb-1.5">This Over:</div>
              <div class="flex items-center space-x-1.5 overflow-x-auto py-1">
                ${inn.currentOverBalls.length === 0 ? `
                  <span class="text-xs text-slate-400 italic">No balls yet in this over</span>
                ` : inn.currentOverBalls.map(ball => {
                  let badge = 'bg-slate-800 text-slate-200 border-slate-700';
                  if (ball.includes('W')) badge = 'bg-red-600 text-white font-bold border-red-500';
                  else if (ball.includes('4')) badge = 'bg-amber-500 text-slate-950 font-bold border-amber-400';
                  else if (ball.includes('6')) badge = 'bg-blue-600 text-white font-black border-blue-400';
                  else if (ball.includes('Wd') || ball.includes('NB')) badge = 'bg-purple-600/80 text-white font-bold border-purple-500';
                  else if (ball === '0') badge = 'bg-slate-800/60 text-slate-400 border-slate-700/60';

                  return `<span class="w-7 h-7 rounded-lg ${badge} border flex items-center justify-center text-xs font-mono shrink-0">${ball}</span>`;
                }).join('')}
              </div>
            </div>
          </div>

          <!-- Active Batsmen Card -->
          <div class="rounded-xl border border-slate-800 bg-[#0E1524] p-3 space-y-2">
            <div class="flex items-center justify-between text-[11px] font-bold text-slate-400 pb-1 border-b border-slate-800 uppercase">
              <span>Batter</span>
              <div class="flex items-center space-x-4">
                <span>R</span>
                <span>B</span>
                <span>4s</span>
                <span>6s</span>
                <span>SR</span>
              </div>
            </div>

            <!-- Striker -->
            <div class="flex items-center justify-between text-xs py-1 bg-amber-500/10 rounded px-2 border border-amber-500/20">
              <div class="flex items-center space-x-1.5 overflow-hidden">
                <span class="w-2 h-2 rounded-full bg-amber-400 shrink-0"></span>
                <span class="font-bold text-white truncate">${strikerObj.name} *</span>
              </div>
              <div class="flex items-center space-x-4 font-mono">
                <span class="font-bold text-amber-400 w-5 text-right">${strikerObj.runs}</span>
                <span class="text-slate-400 w-4 text-right">${strikerObj.balls}</span>
                <span class="text-slate-400 w-4 text-right">${strikerObj.fours}</span>
                <span class="text-blue-400 font-bold w-4 text-right">${strikerObj.sixes}</span>
                <span class="text-slate-300 w-9 text-right text-[11px]">${strikerObj.balls > 0 ? ((strikerObj.runs / strikerObj.balls) * 100).toFixed(0) : '0'}</span>
              </div>
            </div>

            <!-- Non-Striker -->
            <div class="flex items-center justify-between text-xs py-1 px-2">
              <div class="flex items-center space-x-1.5 overflow-hidden">
                <span class="w-2 h-2 rounded-full bg-transparent shrink-0"></span>
                <span class="text-slate-300 truncate">${nonStrikerObj.name}</span>
              </div>
              <div class="flex items-center space-x-4 font-mono">
                <span class="font-bold text-white w-5 text-right">${nonStrikerObj.runs}</span>
                <span class="text-slate-400 w-4 text-right">${nonStrikerObj.balls}</span>
                <span class="text-slate-400 w-4 text-right">${nonStrikerObj.fours}</span>
                <span class="text-blue-400 font-bold w-4 text-right">${nonStrikerObj.sixes}</span>
                <span class="text-slate-400 w-9 text-right text-[11px]">${nonStrikerObj.balls > 0 ? ((nonStrikerObj.runs / nonStrikerObj.balls) * 100).toFixed(0) : '0'}</span>
              </div>
            </div>
          </div>

          <!-- Active Bowler Card -->
          <div class="rounded-xl border border-slate-800 bg-[#0E1524] p-3">
            <div class="flex items-center justify-between text-xs">
              <div class="flex items-center space-x-2">
                <i data-lucide="circle-dot" class="w-4 h-4 text-purple-400"></i>
                <div>
                  <span class="text-[10px] text-slate-400 uppercase font-bold block">Bowler</span>
                  <span class="font-bold text-white">${bowlerObj.name}</span>
                </div>
              </div>
              <div class="flex items-center space-x-3 text-xs font-mono">
                <div class="text-center">
                  <div class="text-[9px] text-slate-400 uppercase">O</div>
                  <div class="font-bold text-white">${Math.floor(bowlerObj.legalBalls / 6)}.${bowlerObj.legalBalls % 6}</div>
                </div>
                <div class="text-center">
                  <div class="text-[9px] text-slate-400 uppercase">R</div>
                  <div class="font-bold text-amber-400">${bowlerObj.runsConceded}</div>
                </div>
                <div class="text-center">
                  <div class="text-[9px] text-slate-400 uppercase">W</div>
                  <div class="font-bold text-purple-400">${bowlerObj.wickets}</div>
                </div>
                <div class="text-center">
                  <div class="text-[9px] text-slate-400 uppercase">ECON</div>
                  <div class="text-slate-300">${bowlerObj.legalBalls > 0 ? ((bowlerObj.runsConceded / bowlerObj.legalBalls) * 6).toFixed(1) : '0.0'}</div>
                </div>
              </div>
            </div>
          </div>

          <!-- Quick Actions: Swap Strike, Change Bowler, Retire -->
          <div class="grid grid-cols-3 gap-2">
            <button onclick="swapStrikeManual()" class="py-2 px-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold flex items-center justify-center space-x-1 border border-slate-700 touch-target">
              <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
              <span>Swap Strike</span>
            </button>
            <button onclick="openChangeBowlerModal()" class="py-2 px-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold flex items-center justify-center space-x-1 border border-slate-700 touch-target">
              <i data-lucide="user-check" class="w-3.5 h-3.5"></i>
              <span>New Bowler</span>
            </button>
            <button onclick="openRetireModal()" class="py-2 px-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold flex items-center justify-center space-x-1 border border-slate-700 touch-target">
              <i data-lucide="user-x" class="w-3.5 h-3.5"></i>
              <span>Retire Bat</span>
            </button>
          </div>

          <!-- SUPER BALL ACTIVATION BUTTON -->
          <div class="pt-1">
            ${match.superBallUsedThisInnings ? `
              <div class="p-2 rounded-xl bg-purple-950/30 border border-purple-900/50 text-center text-xs text-purple-300 font-bold">
                ✓ Super Ball used for this Innings
              </div>
            ` : match.superBallActive ? `
              <div class="p-2 rounded-xl bg-purple-600/40 border border-purple-500 text-center text-xs text-purple-200 font-extrabold flex items-center justify-center gap-1.5 animate-pulse">
                <i data-lucide="zap" class="w-4 h-4"></i> SUPER BALL IN PLAY NOW
              </div>
            ` : isSuperBallEligible ? `
              <button onclick="activateSuperBall()" class="w-full py-3 rounded-xl bg-gradient-to-r from-purple-600 via-indigo-600 to-purple-700 hover:from-purple-500 hover:to-indigo-500 text-white font-display text-lg tracking-wider uppercase font-bold shadow-lg shadow-purple-600/30 flex items-center justify-center space-x-2 touch-target border border-purple-400/40">
                <i data-lucide="zap" class="w-5 h-5 text-yellow-300 fill-yellow-300"></i>
                <span>CALL SUPER BALL NOW (2X RUNS)</span>
              </button>
            ` : `
              <div class="p-2 rounded-xl bg-slate-900/50 border border-slate-800 text-center text-[11px] text-slate-400">
                Super Ball callable only in Overs 2, 3, 4, 5, 6, 7 (Locked in Over 1 & Over 8)
              </div>
            `}
          </div>

          <!-- BALL-BY-BALL SCORING KEYPAD -->
          <div class="space-y-2 pt-1">

    /**
     * SCORECARD SCORING ENGINE LOGIC
     */

    function saveStateForUndo() {
      const match = AppState.liveMatch;
      if (!match) return;
      // Deep snapshot
      match.history.push(JSON.parse(JSON.stringify({
        inn1: match.inn1,
        inn2: match.inn2,
        currentInnings: match.currentInnings,
        freeHit: match.freeHit,
        superBallActive: match.superBallActive,
        superBallUsedThisInnings: match.superBallUsedThisInnings,
        superBallCaller: match.superBallCaller
      })));
      // Keep max 20 snapshots
      if (match.history.length > 20) match.history.shift();
    }

    function undoLastBall() {
      const match = AppState.liveMatch;
      if (!match || match.history.length === 0) {
        showToast("No deliveries to undo!");
        return;
      }
      const previous = match.history.pop();
      match.inn1 = previous.inn1;
      match.inn2 = previous.inn2;
      match.currentInnings = previous.currentInnings;
      match.freeHit = previous.freeHit;
      match.superBallActive = previous.superBallActive;
      match.superBallUsedThisInnings = previous.superBallUsedThisInnings;
      match.superBallCaller = previous.superBallCaller;

      saveData();
      renderScorecardScreen(document.getElementById('appContent'));
      lucide.createIcons();
      showToast("Undid last event");
    }

    // Manual Strike Swap
    function swapStrikeManual() {
      const match = AppState.liveMatch;
      const inn = match.currentInnings === 1 ? match.inn1 : match.inn2;
      const temp = inn.striker;
      inn.striker = inn.nonStriker;
      inn.nonStriker = temp;
      saveData();
      renderScorecardScreen(document.getElementById('appContent'));
      lucide.createIcons();
    }

    // Super Ball Call
    function activateSuperBall() {
      const match = AppState.liveMatch;
      const inn = match.currentInnings === 1 ? match.inn1 : match.inn2;
      const currentOver = Math.floor(inn.legalBalls / 6) + 1;

      if (currentOver < 2 || currentOver > 7) {
        showToast("Super Ball only permitted in Overs 2 through 7!");
        return;
      }
      if (match.superBallUsedThisInnings) {
        showToast("Super Ball already used in this innings!");
        return;
      }

      saveStateForUndo();
      match.superBallActive = true;
      match.superBallUsedThisInnings = true;
      match.superBallCaller = inn.striker;
      saveData();
      renderScorecardScreen(document.getElementById('appContent'));
      lucide.createIcons();
      showToast("SUPER BALL ACTIVATED! 2X Runs on bat!");
    }

    // Record Legal Delivery (0, 1, 2, 3, 4, 6)
    function recordDelivery(runsOffBat) {
      saveStateForUndo();
      const match = AppState.liveMatch;
      const inn = match.currentInnings === 1 ? match.inn1 : match.inn2;

      let effectiveRuns = runsOffBat;
      let ballLabel = runsOffBat.toString();

      // Super ball 2X calculation
      if (match.superBallActive) {
        effectiveRuns = runsOffBat * 2;
        ballLabel = `SB(${effectiveRuns})`;
        match.superBallActive = false; // Resolved after legal ball
      }

      // Add runs to team and batter
      inn.runs += effectiveRuns;
      inn.legalBalls += 1;

      const striker = inn.batters.find(b => b.name === inn.striker);
      if (striker) {
        striker.runs += effectiveRuns;
        striker.balls += 1;
        if (runsOffBat === 4) striker.fours += 1;
        if (runsOffBat === 6) striker.sixes += 1;
      }

      // Bowler stats
      const bowler = inn.bowlers.find(b => b.name === inn.bowler);
      if (bowler) {
        bowler.legalBalls += 1;
        bowler.runsConceded += effectiveRuns;
      }

      // Reset Free Hit on legal delivery
      match.freeHit = false;

      inn.currentOverBalls.push(ballLabel);

      // Rotate strike on odd runs scored off the bat
      if (runsOffBat % 2 === 1) {
        const temp = inn.striker;
        inn.striker = inn.nonStriker;
        inn.nonStriker = temp;
      }

      postBallCheck();
    }

    // Record Wide
    function recordWide() {
      saveStateForUndo();
      const match = AppState.liveMatch;
      const inn = match.currentInnings === 1 ? match.inn1 : match.inn2;

      // 1 extra run to total
      inn.runs += 1;
      inn.currentOverBalls.push('Wd');

      const bowler = inn.bowlers.find(b => b.name === inn.bowler);
      if (bowler) {
        bowler.runsConceded += 1;
      }

      // If Super Ball was active, it carries over to next legal delivery
      if (match.superBallActive) {
        showToast("Wide on Super Ball: +1 extra, Super Ball carries over!");
      }

      postBallCheck(true); // isIllegal = true
    }

    function executeNoBall(runsOffBat) {
      closeModal();
      saveStateForUndo();
      const match = AppState.liveMatch;
      const inn = match.currentInnings === 1 ? match.inn1 : match.inn2;

      // 1 penalty run + runs off bat
      const totalRuns = 1 + runsOffBat;
      inn.runs += totalRuns;

      const striker = inn.batters.find(b => b.name === inn.striker);
      if (striker) {
        striker.runs += runsOffBat;
        striker.balls += 1;
        if (runsOffBat === 4) striker.fours += 1;
        if (runsOffBat === 6) striker.sixes += 1;
      }

      const bowler = inn.bowlers.find(b => b.name === inn.bowler);
      if (bowler) {
        bowler.runsConceded += totalRuns;
      }

      inn.currentOverBalls.push(`NB+${runsOffBat}`);

      // Next ball is Free Hit
      match.freeHit = true;

      // Strike rotation if odd runs scored off bat
      if (runsOffBat % 2 === 1) {
        const temp = inn.striker;
        inn.striker = inn.nonStriker;
        inn.nonStriker = temp;

        // If caller ended up at non-striker end, Super Ball carries over to the new striker
        if (match.superBallActive) {
          showToast("Odd runs on No Ball: Super Ball shifts to new striker!");
        }
      }

      postBallCheck(true);
    }

    function confirmWicket() {
      const method = document.getElementById('wicket-method').value;
      const dismissedName = document.getElementById('wicket-batsman').value;
      const nextBatsmanEl = document.getElementById('next-batsman');
      const nextBatsman = nextBatsmanEl ? nextBatsmanEl.value : null;

      closeModal();
      saveStateForUndo();

      const match = AppState.liveMatch;
      const inn = match.currentInnings === 1 ? match.inn1 : match.inn2;

      // Free Hit rule verification:
      // If delivery is Free Hit, player can only be dismissed via Run Out!
      if (match.freeHit && method !== 'Run Out') {
        showToast("Free Hit delivery: Player is NOT OUT! (Only Run Out applies)");

        // Special Super Ball rule: If someone is out by any method and it's Free Hit + Super Ball,
        // 5 runs will be deducted but player is not out!
        if (match.superBallActive) {
          inn.runs = Math.max(0, inn.runs - 5);
          match.superBallActive = false;
          showToast("Super Ball + Free Hit: Not Out, but -5 runs deducted from team!");
        }

        inn.legalBalls += 1;
        match.freeHit = false;
        inn.currentOverBalls.push('Dot(FH)');
        postBallCheck();
        return;
      }

      // Legal ball counts towards over
      inn.legalBalls += 1;

      // Super Ball dismissal penalty: -5 runs deduction
      if (match.superBallActive) {
        inn.runs = Math.max(0, inn.runs - 5);
        showToast("SUPER BALL WICKET! -5 runs deducted from team score!");
        match.superBallActive = false;
      }

      // Increment wickets
      inn.wickets += 1;
      inn.currentOverBalls.push('W');

      // Update Dismissed Batter
      const batter = inn.batters.find(b => b.name === dismissedName);
      if (batter) {
        batter.isOut = true;
        batter.dismissal = method;
        batter.balls += 1;
      }

      // Bowler credit (Run out is not credited to bowler)
      if (method !== 'Run Out') {
        const bowler = inn.bowlers.find(b => b.name === inn.bowler);
        if (bowler) {
          bowler.wickets += 1;
          bowler.legalBalls += 1;
        }
      } else {
        const bowler = inn.bowlers.find(b => b.name === inn.bowler);
        if (bowler) {
          bowler.legalBalls += 1;
        }
      }

      // Check if all out
      const totalTeamPlayers = inn.batters.length;
      if (inn.wickets >= (totalTeamPlayers - 1) || !nextBatsman) {
        inn.isAllOut = true;
        showToast("All Out!");
        postBallCheck();
        return;
      }

      // Replace dismissed batsman with next batsman
      if (dismissedName === inn.striker) {
        inn.striker = nextBatsman;
      } else {
        inn.nonStriker = nextBatsman;
      }

      match.freeHit = false;
      postBallCheck();
    }

    // Post Ball Verifications & Over End Handling
    function postBallCheck(isIllegalDelivery = false) {
      const match = AppState.liveMatch;
      const inn = match.currentInnings === 1 ? match.inn1 : match.inn2;

      // Check 2nd innings chase completion
      if (match.currentInnings === 2) {
        if (inn.runs >= match.target) {
          concludeMatch();
          return;
        }
      }

      // Check All Out or 8 Overs Limit Reached
      const totalBallsInInnings = 8 * 6; // 48 balls
      const isOversFinished = inn.legalBalls >= totalBallsInInnings;

      if (inn.isAllOut || isOversFinished) {
        if (match.currentInnings === 1) {
          handleInningsBreak();
        } else {
          concludeMatch();
        }
        return;
      }

      // Over completion check (6 legal balls in current over)
      if (!isIllegalDelivery && inn.legalBalls % 6 === 0) {
        // Swap strike at the end of the over
        const temp = inn.striker;
        inn.striker = inn.nonStriker;
        inn.nonStriker = temp;

        // Clear current over balls array for next over
        inn.currentOverBalls = [];

        saveData();
        renderScorecardScreen(document.getElementById('appContent'));
        lucide.createIcons();
        openChangeBowlerModal(true);
        return;
      }

      saveData();
      renderScorecardScreen(document.getElementById('appContent'));
      lucide.createIcons();
    }

    /**
     * MATCH CONCLUSION & STATS INTEGRATION ENGINE
     */
    function concludeMatch() {
      const match = AppState.liveMatch;
      const fixture = AppState.fixtures.find(f => f.id === match.fixtureId);

      const inn1 = match.inn1;
      const inn2 = match.inn2;

      let winnerId = null;
      let isTie = false;
      let summary = '';
      let winnerTitle = '';

      if (inn2.runs >= match.target) {
        winnerId = inn2.battingTeam;
        const wktsRemaining = (inn2.batters.length - 1) - inn2.wickets;
        summary = `${AppState.teams[winnerId].shortName} won by ${wktsRemaining} wickets`;
        winnerTitle = `${AppState.teams[winnerId].name} won by ${wktsRemaining} wickets`;
      } else if (inn1.runs > inn2.runs) {
        winnerId = inn1.battingTeam;
        const runsMargin = inn1.runs - inn2.runs;
        summary = `${AppState.teams[winnerId].shortName} won by ${runsMargin} runs`;
        winnerTitle = `${AppState.teams[winnerId].name} won by ${runsMargin} runs`;
      } else {
        isTie = true;
        summary = `Match Tied (${inn1.runs} - ${inn2.runs})`;
        winnerTitle = `Match Tied (1 Point Each awarded)`;
      }

      // Consolidate player statistics into AppState
      const allBatters = [...inn1.batters, ...inn2.batters];
      const allBowlers = [...inn1.bowlers, ...inn2.bowlers];

      // Update cumulative tournament stats
      allBatters.forEach(b => {
        if (!AppState.playerStats[b.name]) {
          AppState.playerStats[b.name] = {
            name: b.name, team: b.team, matches: 0, innings: 0, runs: 0, balls: 0,
            fours: 0, sixes: 0, highScore: 0, notOuts: 0, overs: 0, legalBallsBowled: 0,
            runsConceded: 0, wickets: 0, bestWickets: 0, bestRuns: 999
          };
        }
        const p = AppState.playerStats[b.name];
        p.matches += 1;
        if (b.balls > 0 || b.isOut) {
          p.innings += 1;
          p.runs += b.runs;
          p.balls += b.balls;
          p.fours += b.fours;
          p.sixes += b.sixes;
          if (b.runs > p.highScore) p.highScore = b.runs;
          if (!b.isOut) p.notOuts += 1;
        }
      });

      allBowlers.forEach(b => {
        if (!AppState.playerStats[b.name]) return;
        const p = AppState.playerStats[b.name];
        if (b.legalBalls > 0) {
          p.legalBallsBowled += b.legalBalls;
          p.runsConceded += b.runsConceded;
          p.wickets += b.wickets;

          // Best bowling figure
          if (b.wickets > p.bestWickets || (b.wickets === p.bestWickets && b.runsConceded < p.bestRuns)) {
            p.bestWickets = b.wickets;
            p.bestRuns = b.runsConceded;
          }
        }
      });

      // Find top performers for this match highlights
      let topBatter = { name: 'None', score: '0', runs: 0 };
      allBatters.forEach(b => {
        if (b.runs > topBatter.runs) {
          topBatter = { name: b.name, score: `${b.runs} (${b.balls})`, runs: b.runs };
        }
      });

      let topBowler = { name: 'None', figures: '0/0', wickets: -1 };
      allBowlers.forEach(b => {
        if (b.wickets > topBowler.wickets) {
          topBowler = { name: b.name, figures: `${b.wickets}/${b.runsConceded}`, wickets: b.wickets };
        }
      });

      let topSixer = { name: 'None', count: 0 };
      allBatters.forEach(b => {
        if (b.sixes > topSixer.count) {
          topSixer = { name: b.name, count: b.sixes };
        }
      });

      // Update Fixture record
      fixture.status = 'completed';
      fixture.result = {
        winner: winnerId,
        isTie,
        summary,
        teamA: { id: match.teamA },
        teamB: { id: match.teamB }
      };
      fixture.scorecard = {
        inn1: {
          battingTeam: inn1.battingTeam,
          bowlingTeam: inn1.bowlingTeam,
          runs: inn1.runs,
          wickets: inn1.wickets,
          legalBalls: inn1.legalBalls,
          overs: `${Math.floor(inn1.legalBalls / 6)}.${inn1.legalBalls % 6}`,
          isAllOut: inn1.isAllOut,
          batters: inn1.batters,
          bowlers: inn1.bowlers
        },
        inn2: {
          battingTeam: inn2.battingTeam,
          bowlingTeam: inn2.bowlingTeam,
          runs: inn2.runs,
          wickets: inn2.wickets,
          legalBalls: inn2.legalBalls,
          overs: `${Math.floor(inn2.legalBalls / 6)}.${inn2.legalBalls % 6}`,
          isAllOut: inn2.isAllOut,
          batters: inn2.batters,
          bowlers: inn2.bowlers
        }
      };

      // Add to Match Updates Feed
      const today = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      AppState.matchUpdates.push({
        id: Date.now(),
        matchId: fixture.id,
        matchName: fixture.name,
        teamA: AppState.teams[match.teamA].shortName,
        teamB: AppState.teams[match.teamB].shortName,
        winnerTitle,
        highlightSummary: `${topBatter.name} delivered the standout knock with ${topBatter.score}. Top bowling honors belonged to ${topBowler.name} with ${topBowler.figures}.`,
        topScorer: topBatter,
        topBowler: topBowler,
        topSixer: topSixer,
        date: today
      });

      // Unlock next match in sequence
      const currentIndex = AppState.fixtures.findIndex(f => f.id === fixture.id);
      if (currentIndex !== -1 && currentIndex < AppState.fixtures.length - 1) {
        const nextFixture = AppState.fixtures[currentIndex + 1];
        if (nextFixture.type === 'LEAGUE') {
          nextFixture.status = 'unlocked';
        }
      }

      // Check if playoff or final updates required
      updatePlayoffAndFinalParticipants();

      // Clear active match
      AppState.liveMatch = null;
      saveData();

      // Confetti burst
      try {
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      } catch (e) {}

      // Open Post-Match Summary Modal
      renderPostMatchCelebrationModal(fixture, winnerTitle, summary);
    }
