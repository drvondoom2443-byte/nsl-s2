    /**
     * WEB AUDIO SYNTHESIZER
     */
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    const SoundFX = {
      playSuperBallSiren() {
        try {
          const ctx = getAudioContext();
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          const gain = ctx.createGain();

          osc1.type = 'sawtooth';
          osc2.type = 'sine';

          const now = ctx.currentTime;
          osc1.frequency.setValueAtTime(320, now);
          osc1.frequency.linearRampToValueAtTime(840, now + 0.4);
          osc1.frequency.linearRampToValueAtTime(320, now + 0.8);
          osc1.frequency.linearRampToValueAtTime(950, now + 1.2);

          osc2.frequency.setValueAtTime(480, now);
          osc2.frequency.linearRampToValueAtTime(980, now + 0.4);
          osc2.frequency.linearRampToValueAtTime(480, now + 0.8);
          osc2.frequency.linearRampToValueAtTime(1100, now + 1.2);

          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 1.4);

          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(ctx.destination);

          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + 1.4);
          osc2.stop(now + 1.4);
        } catch (e) {}
      },

      playFourCheer() {
        try {
          const ctx = getAudioContext();
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.3);
          osc.frequency.setValueAtTime(660, now + 0.35);

          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.9);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(now);
          osc.stop(now + 0.9);
        } catch (e) {}
      },

      playSixRoar() {
        try {
          const ctx = getAudioContext();
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(40, now + 0.5);
          gain.gain.setValueAtTime(0.45, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.6);
        } catch (e) {}
      },

      playWicketSound() {
        try {
          const ctx = getAudioContext();
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(280, now);
          osc.frequency.exponentialRampToValueAtTime(85, now + 0.45);

          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(now);
          osc.stop(now + 0.5);
        } catch (e) {}
      }
    };

        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          AppState = Object.assign({}, AppState, parsed);

          }
          if (!AppState.teams || Object.keys(AppState.teams).length === 0) {

          }
          if (!Array.isArray(AppState.rules) || AppState.rules.length === 0) {
            AppState.rules = [...INITIAL_RULES];

        } else {
          populateInitialStats();
          saveLocalState();
        }
      } catch (e) {
        console.error("loadState error:", e);
        populateInitialStats();
      }
    }

    function saveLocalState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(AppState));
      } catch (e) {}
    }

    // Screen Wake Lock API (keeps mobile display awake during live scoring & spectating)
    let screenWakeLock = null;
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator && !screenWakeLock) {
          screenWakeLock = await navigator.wakeLock.request('screen');
          screenWakeLock.addEventListener('release', () => { screenWakeLock = null; });
        }
      } catch (e) {}
    }

    function releaseWakeLock() {
      if (screenWakeLock) {
        screenWakeLock.release().catch(() => {});
        screenWakeLock = null;
      }
    }

    // High-speed dual-channel synchronization engine
    let liveSyncInProgress = false;
    let pendingLiveSync = null;

    function getLiveMatchPayload() {
      const match = AppState.liveMatch;
      if (!match || match.status !== 'live') {
        return { isLive: false, updatedAt: Date.now() };
      }
      const inn = match.currentInnings === 1 ? match.innings1 : match.innings2;
      return {
        isLive: true,
        fixtureId: match.fixtureId,
        teamA: match.teamA,
        teamB: match.teamB,
        totalOvers: match.totalOvers,
        currentInnings: match.currentInnings,
        playingXI: match.playingXI || {},
        inn1Summary: match.innings1 ? {
          battingTeam: match.innings1.battingTeam,
          bowlingTeam: match.innings1.bowlingTeam,
          runs: match.innings1.runs,
          wickets: match.innings1.wickets,
          balls: match.innings1.balls
        } : null,
        inn: {
          battingTeam: inn.battingTeam,
          bowlingTeam: inn.bowlingTeam,
          runs: inn.runs,
          wickets: inn.wickets,
          balls: inn.balls,
          isFreeHit: !!inn.isFreeHit,
          isSuperBallActive: !!inn.isSuperBallActive,
          superBallUsed: !!inn.superBallUsed,
          striker: inn.striker,
          nonStriker: inn.nonStriker,
          currentBowler: inn.currentBowler,
          extras: inn.extras || { wides: 0, noBalls: 0 },
          batsmen: inn.batsmen || {},
          bowlers: inn.bowlers || {},
          timeline: (inn.timeline || []).slice(-8)
        },
        lastBroadcast: AppState.lastBroadcast || null,
        updatedAt: Date.now()
      };
    }

    // Instant Ball-by-Ball Live Sync (< 1.5 KB payload, ~100-200ms latency)
    function syncLiveScore() {
      AppState.updatedAt = Date.now();
      saveLocalState();
      updateGlobalTicker();

      if (!firestoreDB || !isAdmin) return;

      pendingLiveSync = getLiveMatchPayload();

      if (!liveSyncInProgress) {
        liveSyncInProgress = true;
        // Non-blocking async background push
        (async () => {
          while (pendingLiveSync) {
            const nextPayload = pendingLiveSync;
            pendingLiveSync = null;
            try {
              const liveDocRef = window.FirebaseSDK.doc(firestoreDB, "nsl_tournament", "live_score");
              await window.FirebaseSDK.setDoc(liveDocRef, nextPayload);
            } catch (err) {
              console.warn("Live score sync error:", err);
            }
          }
          liveSyncInProgress = false;
        })();
      }
    }

    // Full Tournament State Sync (Stripping heavy undo history)
    async function syncData(isLocalMutation = true) {
      AppState.updatedAt = Date.now();
      saveLocalState();
      updateGlobalTicker();

      // Keep live channel aligned with full state
      syncLiveScore();

      if (firestoreDB && isLocalMutation && isAdmin) {
        try {
          const docRef = window.FirebaseSDK.doc(firestoreDB, "nsl_tournament", "s2_state");
          // Clean payload: strip undo history snapshots
          const sanitizedState = JSON.parse(JSON.stringify(AppState));
          if (sanitizedState.liveMatch) {
            if (sanitizedState.liveMatch.innings1) sanitizedState.liveMatch.innings1.history = null;
            if (sanitizedState.liveMatch.innings2) sanitizedState.liveMatch.innings2.history = null;
          }
          await window.FirebaseSDK.setDoc(docRef, sanitizedState);
        } catch (err) {
          console.warn("Firestore full state sync error:", err);
        }
      }
    }

    let liveUnsubscribe = null;
    let fullStateUnsubscribe = null;

    function initFirebase() {
      if (!window.FirebaseSDK) return;
      try {
        const app = window.FirebaseSDK.initializeApp(FIREBASE_CONFIG);
        firestoreDB = window.FirebaseSDK.getFirestore(app);

        // CHANNEL 1: High-speed live delivery stream (< 1.5 KB)
        const liveDocRef = window.FirebaseSDK.doc(firestoreDB, "nsl_tournament", "live_score");
        if (liveUnsubscribe) liveUnsubscribe();

        liveUnsubscribe = window.FirebaseSDK.onSnapshot(liveDocRef, (snap) => {
          if (!snap.exists()) return;
          const liveData = snap.data();
          if (!liveData || !liveData.updatedAt) return;

          // Only process remote updates for spectators (scorer uses local state)
          if (!isAdmin) {
            const oldBroadcastTime = AppState.lastBroadcast ? AppState.lastBroadcast.time : 0;

            if (liveData.isLive) {
              if (!AppState.liveMatch) {
                AppState.liveMatch = {
                  fixtureId: liveData.fixtureId,
                  teamA: liveData.teamA,
                  teamB: liveData.teamB,
                  totalOvers: liveData.totalOvers,
                  status: 'live',
                  currentInnings: liveData.currentInnings,
                  playingXI: liveData.playingXI || {},
                  innings1: liveData.currentInnings === 1 ? liveData.inn : (liveData.inn1Summary || {}),
                  innings2: liveData.currentInnings === 2 ? liveData.inn : null
                };
              } else {
                AppState.liveMatch.status = 'live';
                AppState.liveMatch.fixtureId = liveData.fixtureId;
                AppState.liveMatch.currentInnings = liveData.currentInnings;
                if (liveData.currentInnings === 1) {
                  AppState.liveMatch.innings1 = {
                    ...AppState.liveMatch.innings1,
                    ...liveData.inn
                  };
                } else {
                  if (liveData.inn1Summary) {
                    AppState.liveMatch.innings1 = {
                      ...AppState.liveMatch.innings1,
                      ...liveData.inn1Summary
                    };
                  }
                  AppState.liveMatch.innings2 = {
                    ...AppState.liveMatch.innings2,
                    ...liveData.inn
                  };
                }
              }
            } else {
              AppState.liveMatch = null;
            }

            AppState.lastBroadcast = liveData.lastBroadcast || AppState.lastBroadcast;
            AppState.updatedAt = liveData.updatedAt;
            saveLocalState();
            updateGlobalTicker();

            // Real-time UI refresh for spectator
            if (AppState.currentView === 'live' || AppState.currentView === 'home') {
              refreshCurrentView();
            }

            if (liveData.lastBroadcast && liveData.lastBroadcast.time > oldBroadcastTime) {
              triggerBroadcastUI(liveData.lastBroadcast);
            }
          }
        }, (err) => {
          console.warn("Live stream offline fallback", err);
        });

        // CHANNEL 2: Full tournament state changes (fixtures, standings, squads)
        const fullDocRef = window.FirebaseSDK.doc(firestoreDB, "nsl_tournament", "s2_state");
        if (fullStateUnsubscribe) fullStateUnsubscribe();

        fullStateUnsubscribe = window.FirebaseSDK.onSnapshot(fullDocRef, (snap) => {
          if (!snap.exists()) return;
          const remote = snap.data();
          if (!remote.updatedAt || remote.updatedAt > (AppState.updatedAt || 0)) {
            const currentLive = AppState.liveMatch;
            AppState = Object.assign(AppState, remote);
            if (currentLive && !isAdmin) {
              AppState.liveMatch = currentLive;
            }
            saveLocalState();
            refreshCurrentView();
          }
        }, (err) => {
          console.warn("Firestore state sync fallback", err);
        });

      } catch (e) {
        console.warn("Firebase initialization skipped", e);
      }
    }

    window.addEventListener('firebase-sdk-ready', initFirebase);

    /**
     * CLEAN BROADCAST ANIMATION TRIGGER (NO EMOJIS)
     */
    function triggerBroadcast(type, title, sub) {
      const broadcastObj = { type, title, sub, time: Date.now() };

      else if (type === 'wicket') SoundFX.playWicketSound();

    /**
     * NAVIGATION ROUTER WITH UNIVERSAL BACK BUTTON
     */
    function navigateTo(view, params = {}, trackHistory = true) {
      if (trackHistory && view !== AppState.currentView) {
        navigationHistory.push(view);
      }
      AppState.currentView = view;
      if (trackHistory) {
        window.scrollTo(0, 0);
      }

      // Keep screen awake while on live scoring & spectating view
      if (view === 'live') {
        requestWakeLock();
      } else {
        releaseWakeLock();
      }

      // Bottom nav updates (4 primary tabs)
      document.querySelectorAll('nav button').forEach(b => {
        b.classList.remove('text-amber-400');
        b.classList.add('text-slate-400');
      });
      const activeBtn = document.getElementById(`nav-${view}`);
      if (activeBtn) {
        activeBtn.classList.remove('text-slate-400');
        activeBtn.classList.add('text-amber-400');
      }

      const container = document.getElementById('appContent');
      container.innerHTML = '';

      switch (view) {
        case 'home': renderHomeScreen(container); break;
        case 'live': renderLiveScorerScreen(container); break;
        case 'fixtures': renderFixturesScreen(container); break;
        case 'points': renderPointsScreen(container); break;
        case 'awards': renderAwardsScreen(container, params); break;
        case 'squads': renderSquadsScreen(container); break;
        case 'results': renderResultsScreen(container); break;
        case 'rules': renderRulesScreen(container); break;
        case 'admin': renderAdminScreen(container); break;
        default: renderHomeScreen(container);
      }

      updateGlobalTicker();
      renderIcons();
    }

    function navigateBack() {
      if (navigationHistory.length > 1) {
        navigationHistory.pop();
        const prev = navigationHistory[navigationHistory.length - 1];
        navigateTo(prev, {}, false);
      } else {
        navigateTo('home', {}, false);
      }
    }

    function openEditRulesModal() {

    function saveCustomRules() {
      const text = document.getElementById('rulesTextArea').value.trim();
      if (!text) return;
      AppState.rules = text.split('\n').filter(line => line.trim().length > 0);
      closeModal();
      showToast("Rules updated successfully!");
      syncData();
      refreshCurrentView();
    }

      if (!isAdmin) return;
      const modal = document.getElementById('modalContainer');
      modal.innerHTML = `

    function confirmQuickRegister() {
      const teamId = document.getElementById('quickRegTeamSelect').value;
      const name = document.getElementById('quickRegNameInput').value.trim();
      if (!name) return;

      if (!AppState.teams[teamId].squad.includes(name)) {
        AppState.teams[teamId].squad.push(name);
        AppState.playerStats[name] = {
          name, team: teamId, matches: 0, innings: 0, runs: 0, balls: 0, fours: 0, sixes: 0, highScore: 0, notOuts: 0, legalBallsBowled: 0, runsConceded: 0, wickets: 0, maidens: 0
        };
        closeModal();
        showToast(`${name} registered to ${teamId}!`);
        syncData();
        refreshCurrentView();
      } else {
        showToast("Player already in squad!");
      }
    }

    /**
     * DELETE PLAYER (ADMIN ONLY)
     */
    function deletePlayer(teamId, playerName) {
      if (!isAdmin) {
        showToast("Admin authorization required!");
        return;
      }

      if (confirm(`Are you sure you want to delete "${playerName}" from ${teamId}?`)) {
        const team = AppState.teams[teamId];
        if (team) {
          team.squad = team.squad.filter(p => p !== playerName);
          delete AppState.playerStats[playerName];
          showToast(`${playerName} removed from ${teamId}.`);
          syncData();
          refreshCurrentView();
        }
      }
    }

    /**

    /**
     * SCREEN 2: LIVE MATCH & SCORING CONSOLE (ZERO-SCROLL MOBILE DASHBOARD)
     */
    function renderLiveScorerScreen(container) {
      const match = AppState.liveMatch;

      if (!match || match.status !== 'live') {
        container.innerHTML = `
          ${renderScreenHeader('Live Match')}
          <div class="py-16 text-center space-y-4 max-w-md mx-auto">
            <div class="w-16 h-16 rounded-full bg-slate-800/80 border border-slate-700 flex items-center justify-center mx-auto text-slate-500">
              <i data-lucide="radio" class="w-8 h-8"></i>
            </div>
            <h2 class="text-base sm:text-lg font-bold text-white uppercase tracking-wider">No Active Match</h2>
            <p class="text-xs sm:text-sm text-slate-400">
              ${isAdmin ? 'Go to Fixtures to select Playing 11, complete the toss, and launch the match.' : 'No match is currently in progress. Scores will sync live here once commenced.'}
            </p>
            ${isAdmin ? `
              <button onclick="navigateTo('fixtures')" class="px-5 py-2.5 rounded-xl bg-amber-500 text-slate-950 font-black text-xs sm:text-sm uppercase tracking-wider shadow-lg touch-target">
                Fixtures & Start
              </button>
            ` : ''}
          </div>
        `;
        return;
      }

      const inn = match.currentInnings === 1 ? match.innings1 : match.innings2;
      const batTeam = AppState.teams[inn.battingTeam];
      const bowlTeam = AppState.teams[inn.bowlingTeam];

      const legalBalls = inn.balls;
      const currentOverNumber = Math.floor(legalBalls / 6) + 1;
      const ovFormatted = `${Math.floor(legalBalls / 6)}.${legalBalls % 6}`;

      const striker = inn.batsmen[inn.striker] || { name: inn.striker || "Striker", runs: 0, balls: 0, fours: 0, sixes: 0 };
      const nonStriker = inn.batsmen[inn.nonStriker] || { name: inn.nonStriker || "Non-Striker", runs: 0, balls: 0, fours: 0, sixes: 0 };
      const bowler = inn.bowlers[inn.currentBowler] || { name: inn.currentBowler || "Bowler", balls: 0, runs: 0, wickets: 0, maidens: 0 };

      const bowlerOv = `${Math.floor(bowler.balls / 6)}.${bowler.balls % 6}`;
      const crr = inn.balls > 0 ? ((inn.runs / inn.balls) * 6).toFixed(2) : "0.00";

      let target = 0;
      let needed = 0;
      let ballsRemaining = 0;
      let rrr = "0.00";
      let winProbA = 50;
      let winProbB = 50;

      if (match.currentInnings === 2) {
        target = match.innings1.runs + 1;
        needed = target - inn.runs;
        ballsRemaining = Math.max(0, (match.totalOvers * 6) - inn.balls);
        rrr = ballsRemaining > 0 ? ((needed / ballsRemaining) * 6).toFixed(2) : "0.00";

        const wicketsLost = inn.wickets;
        const rrrNum = parseFloat(rrr);
        if (needed <= 0) {
          winProbA = 100; winProbB = 0;
        } else if (ballsRemaining === 0) {
          winProbA = 0; winProbB = 100;
        } else {
          let baseProb = 50 + (10 - rrrNum) * 5 - (wicketsLost * 6);
          baseProb = Math.max(5, Math.min(95, Math.round(baseProb)));
          winProbA = baseProb;
          winProbB = 100 - baseProb;
        }
      }

      const superBallEligible = currentOverNumber >= 2 && currentOverNumber <= 7 && !inn.superBallUsed;

      container.innerHTML = `
        <div class="space-y-2 sm:space-y-3">
          
          <!-- Compact Header Bar -->
          <div class="flex items-center justify-between pb-1">
            <div class="flex items-center space-x-2">
              <button onclick="navigateBack()" class="px-2.5 py-1 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold transition-all border border-slate-700 touch-target flex items-center space-x-1">
                <i data-lucide="arrow-left" class="w-3.5 h-3.5 text-amber-400"></i>
                <span>Back</span>
              </button>
              <span class="font-display text-lg sm:text-xl font-black text-white uppercase tracking-wider leading-none">
                Match ${match.fixtureId} <span class="text-xs text-slate-400 font-sans font-bold">Inn ${match.currentInnings}</span>
              </span>
            </div>

            <button onclick="openFullScorecardModal()" class="px-3 py-1 rounded-xl bg-slate-800 hover:bg-slate-700 border border-amber-500/40 text-amber-300 font-bold text-xs uppercase tracking-wider flex items-center space-x-1.5 touch-target shadow">
              <i data-lucide="file-text" class="w-3.5 h-3.5 text-amber-400"></i>
              <span>Scorecard</span>
            </button>
          </div>

          <!-- Two-Column Layout on PC (lg:grid-cols-12), Zero-Scroll Single View on Mobile -->
          <div class="grid grid-cols-1 lg:grid-cols-12 gap-2.5 sm:gap-3 lg:gap-4">
            
            <!-- Left Console Column: Fits 100% on Mobile Viewport Without Scrolling (lg:col-span-6) -->
            <div class="lg:col-span-6 space-y-2 sm:space-y-2.5">
              
              <!-- 1. COMPACT LIVE SCORE HUD -->
              <div class="rounded-2xl bg-gradient-to-r from-[#111A2E] via-[#0E1528] to-[#0A101D] border border-slate-800 p-2.5 sm:p-3 shadow-lg">
                <div class="flex items-center justify-between">
                  <!-- Batting Team & Big Score -->
                  <div class="flex items-center space-x-2 sm:space-x-2.5">
                    ${renderTeamLogo(inn.battingTeam, "w-10 h-10 sm:w-11 sm:h-11")}
                    <div>
                      <div class="flex items-baseline space-x-1.5 leading-none">
                        <span class="font-display text-3xl sm:text-4xl font-black text-white leading-none">${inn.runs}/${inn.wickets}</span>
                        <span class="font-display text-lg sm:text-xl font-black text-amber-400 leading-none">${ovFormatted}<span class="text-[10px] text-slate-500 font-sans font-bold">/${match.totalOvers}.0</span></span>
                      </div>
                      <div class="text-[10px] font-bold text-slate-400 truncate max-w-[125px] sm:max-w-none mt-0.5">
                        ${batTeam?.name || inn.battingTeam}
                      </div>
                    </div>
                  </div>

                  <!-- Target / CRR / RRR & Status -->
                  <div class="text-right">
                    ${match.currentInnings === 2 ? `
                      <div class="text-xs font-black text-emerald-400 font-mono leading-tight">
                        Need ${needed > 0 ? needed : 0} in ${ballsRemaining}b
                      </div>
                      <div class="text-[10px] text-amber-300 font-mono font-bold leading-tight">
                        RRR: ${rrr} • CRR: ${crr}
                      </div>
                    ` : `
                      <div class="text-xs font-black text-emerald-400 font-mono leading-tight">
                        CRR: ${crr}
                      </div>
                      <div class="text-[10px] text-slate-400 font-bold leading-tight">
                        vs ${bowlTeam?.shortName || inn.bowlingTeam}
                      </div>
                    `}
                    <div class="flex items-center justify-end gap-1 mt-1">
                      ${inn.isFreeHit ? `
                        <span class="px-1.5 py-0.2 rounded bg-red-600 text-white text-[9px] font-black uppercase tracking-wider animate-pulse">
                          Free Hit
                        </span>
                      ` : ''}
                      ${inn.isSuperBallActive ? `
                        <span class="px-1.5 py-0.2 rounded bg-purple-600 text-white text-[9px] font-black uppercase tracking-wider animate-bounce">
                          Super Ball 2x
                        </span>
                      ` : ''}
                    </div>
                  </div>
                </div>

                ${match.currentInnings === 2 ? `
                  <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden flex mt-2">
                    <div class="h-full bg-gradient-to-r from-amber-500 to-yellow-400 transition-all duration-500" style="width: ${winProbA}%"></div>
                    <div class="h-full bg-slate-700 transition-all duration-500" style="width: ${winProbB}%"></div>
                  </div>
                ` : ''}
              </div>

              <!-- 2. HIGH-DENSITY CREASE HUD (Batters & Bowler) -->
              <div class="rounded-2xl bg-[#0D1424] border border-slate-800 p-2 sm:p-2.5 shadow-lg grid grid-cols-2 gap-2 text-xs">
                <!-- Batters -->
                <div class="space-y-1 border-r border-slate-800/80 pr-2">
                  <!-- Striker -->
                  <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-1.5 truncate">
                      <span class="w-2 h-2 rounded-full bg-amber-400 shrink-0 shadow-[0_0_8px_rgba(245,158,11,0.8)]"></span>
                      <span class="font-black text-amber-300 truncate text-[11px] sm:text-xs">${striker.name}*</span>
                    </div>
                    <div class="text-right shrink-0">
                      <span class="font-mono font-black text-white text-xs sm:text-sm">${striker.runs}</span>
                      <span class="text-[9px] text-slate-400 font-mono">(${striker.balls})</span>
                    </div>
                  </div>
                  <!-- Non-Striker -->
                  <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-1.5 truncate pl-3.5">
                      <span class="font-bold text-slate-300 truncate text-[11px] sm:text-xs">${nonStriker.name}</span>
                    </div>
                    <div class="text-right shrink-0">
                      <span class="font-mono font-bold text-slate-300 text-xs sm:text-sm">${nonStriker.runs}</span>
                      <span class="text-[9px] text-slate-500 font-mono">(${nonStriker.balls})</span>
                    </div>
                  </div>
                </div>

                <!-- Bowler & Extras -->
                <div class="space-y-1 pl-1 flex flex-col justify-between">
                  <!-- Bowler -->
                  <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-1.5 truncate">
                      <span class="w-2 h-2 rounded-full bg-emerald-400 shrink-0 shadow-[0_0_8px_rgba(52,211,153,0.8)]"></span>
                      <span class="font-black text-emerald-300 truncate text-[11px] sm:text-xs">${bowler.name}</span>

                    <div class="text-right shrink-0">
                      <span class="font-mono font-black text-emerald-400 text-xs sm:text-sm">${bowler.wickets}/${bowler.runs}</span>

                  </div>
                  <!-- Bowler Overs & Extras -->
                  <div class="flex items-center justify-between text-[10px] text-slate-400 font-mono">
                    <span>${bowlerOv}/2.0 ov</span>
                    <span class="text-slate-500 font-bold">WD:${inn.extras.wides} NB:${inn.extras.noBalls}</span>
                  </div>
                </div>
              </div>

              <!-- 3. CURRENT OVER TIMELINE STRIP -->
              <div class="flex items-center justify-between bg-slate-900/80 border border-slate-800 rounded-xl px-2.5 py-1">
                <span class="text-[10px] font-black text-slate-400 uppercase tracking-wider shrink-0 mr-2">Ov ${currentOverNumber}.x:</span>
                <div class="flex items-center space-x-1.5 overflow-x-auto py-0.5" id="currentOverBalls">
                  ${renderTimelineBalls(inn.timeline.slice(-8))}

              </div>

              <!-- 4. TOUCH-OPTIMIZED SCORER CONTROLS (ADMIN ONLY) -->
              ${isAdmin ? `
                <div class="bg-[#0E1528] border border-amber-500/40 rounded-2xl p-2 sm:p-2.5 space-y-1.5 shadow-2xl">
                  <!-- Utility Row: Super Ball, Swap Strike, Retire, Undo -->
                  <div class="grid grid-cols-4 gap-1.5 text-center">
                    <button 
                      onclick="triggerSuperBallCall()" 
                      ${!superBallEligible || inn.isSuperBallActive ? 'disabled' : ''}
                      class="py-2 px-1 rounded-xl font-black text-[10px] uppercase tracking-wider transition-all border touch-target ${
                        inn.isSuperBallActive 
                          ? 'bg-purple-600 border-purple-400 text-white animate-pulse' 
                          : superBallEligible 
                            ? 'bg-purple-950/90 border-purple-600 text-purple-200 hover:bg-purple-900' 
                            : 'bg-slate-900 border-slate-800 text-slate-600 cursor-not-allowed'
                      }">
                      ${inn.isSuperBallActive ? 'SB Active' : 'Super Ball'}
                    </button>

                    <button onclick="swapStrikeManual()" class="py-2 px-1 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-[10px] uppercase tracking-wider border border-slate-700 transition-all touch-target">

                    <button onclick="openRetireModal()" class="py-2 px-1 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-[10px] uppercase tracking-wider border border-slate-700 transition-all touch-target">

                      Undo (${inn.history ? inn.history.length : 0})

    function renderTimelineBalls(balls) {
      if (!balls || balls.length === 0) {
        return `<span class="text-xs text-slate-500 italic">No deliveries bowled yet.</span>`;

      return balls.map(b => {
        let bg = "bg-slate-800 text-slate-200 border-slate-700";

        else if (b.isWicket) bg = "bg-rose-600 text-white border-rose-500 font-black";
        else if (b.runs === 6) bg = "bg-amber-500 text-slate-950 border-amber-300 font-black";
        else if (b.runs === 4) bg = "bg-blue-600 text-white border-blue-400 font-black";
        else if (b.isWide) bg = "bg-yellow-600/30 text-yellow-300 border-yellow-500/50";
        else if (b.isNoBall) bg = "bg-orange-600/30 text-orange-300 border-orange-500/50";

        let cleanLabel = b.label || '';
        cleanLabel = cleanLabel.replace(/[^a-zA-Z0-9+()\-]/g, '');
        if (b.isSuperBall && !cleanLabel.startsWith('SB')) {
          cleanLabel = cleanLabel ? 'SB-' + cleanLabel : 'SB';
        }

        return `
          <span class="w-7 h-7 rounded-full flex items-center justify-center text-[10px] font-mono border shrink-0 ${bg}">
            ${cleanLabel}
          </span>
        `;
      }).join('');
    }

    function renderTimelineBalls(balls) {

    /**
     * SCORING ENGINE LOGIC (Strict Tape-Ball & Superball Rules, Zero Emojis)
     */
    function recordDelivery({ runs = 0, isWide = false, isNoBall = false, isBoundary = false, isWicket = false, dismissalType = null }) {
      if (!isAdmin) return;
      const match = AppState.liveMatch;
      if (!match || match.status !== 'live') return;

      const inn = match.currentInnings === 1 ? match.innings1 : match.innings2;

      if (!inn.history) inn.history = [];
      inn.history.push(JSON.parse(JSON.stringify({
        innings: { ...inn, history: null },
        currentInnings: match.currentInnings
      })));
      if (inn.history.length > 16) inn.history.shift();

      let isSuperBallDelivery = inn.isSuperBallActive;
      let label = "";

      let striker = inn.batsmen[inn.striker];
      let bowler = inn.bowlers[inn.currentBowler];

      if (!striker) {
        striker = inn.batsmen[inn.striker] = { name: inn.striker, runs: 0, balls: 0, fours: 0, sixes: 0, isOut: false };
      }
      if (!bowler) {
        bowler = inn.bowlers[inn.currentBowler] = { name: inn.currentBowler, balls: 0, runs: 0, wickets: 0, maidens: 0 };
      }

      // 1. WIDE
      if (isWide) {
        inn.runs += 1;
        bowler.runs += 1;
        inn.extras.wides += 1;
        label = "WD";

        if (isSuperBallDelivery) {
          label = "SB-WD";
          inn.isSuperBallActive = true;
        }
        triggerBroadcast("normal", "WIDE BALL", "+1 Run Extra");
      }
      // 2. NO BALL
      else if (isNoBall) {
        inn.runs += 1;
        bowler.runs += 1;
        inn.extras.noBalls += 1;
        inn.isFreeHit = true;

        let batRuns = runs;
        if (isSuperBallDelivery) {
          batRuns = runs * 2;
        }

        striker.runs += batRuns;
        striker.balls += 1;
        inn.runs += batRuns;
        bowler.runs += batRuns;

        if (runs === 4) { striker.fours += 1; triggerBroadcast("four", "FOUR RUNS", "+4 Off No Ball"); }
        else if (runs === 6) { striker.sixes += 1; triggerBroadcast("six", "SIX RUNS", "+6 Off No Ball"); }
        else { triggerBroadcast("normal", "NO BALL", "+1 & Free Hit Next"); }

        label = isSuperBallDelivery ? `SB-NB+${batRuns}` : `NB+${runs}`;

        if (runs % 2 !== 0) {
          const temp = inn.striker;
          inn.striker = inn.nonStriker;
          inn.nonStriker = temp;
          if (isSuperBallDelivery) {
            inn.isSuperBallActive = true;
          }
        }
      }
      // 3. WICKET
      else if (isWicket) {
        striker.balls += 1;
        inn.balls += 1;
        bowler.balls += 1;

        const isFreeHit = inn.isFreeHit;
        const isRunOut = dismissalType === 'Run Out';

        if (isFreeHit && !isRunOut) {
          showToast("Not Out! Free Hit Delivery.");
          label = "FH-0";

          if (isSuperBallDelivery) {
            inn.runs = Math.max(0, inn.runs - 5);
            label = "SB-FH(-5)";
            triggerBroadcast("superball", "SUPER BALL FREE HIT", "Not Out but -5 Runs Deducted");
            inn.isSuperBallActive = false;
            inn.superBallUsed = true;
          }
        } else {
          striker.isOut = true;
          striker.dismissal = dismissalType || "Bowled";
          inn.wickets += 1;
          bowler.wickets += 1;
          label = "W";

          if (isSuperBallDelivery) {
            inn.runs = Math.max(0, inn.runs - 5);
            label = "SB-W(-5)";
            triggerBroadcast("wicket", "SUPER BALL WICKET", "OUT and -5 Runs Deducted");
            inn.isSuperBallActive = false;
            inn.superBallUsed = true;
          } else {
            triggerBroadcast("wicket", "WICKET FALLS", `${striker.name} ${striker.dismissal}`);
          }
        }

        inn.isFreeHit = false;

        if (inn.wickets < (match.playingXI[inn.battingTeam].length - 1)) {
          openNextBatsmanModal();
        }
      }
      // 4. REGULAR DELIVERY
      else {
        striker.balls += 1;
        inn.balls += 1;
        bowler.balls += 1;

        let scored = runs;
        if (isSuperBallDelivery) {
          scored = runs * 2;
          label = `SB-${scored}`;
          inn.isSuperBallActive = false;
          inn.superBallUsed = true;

          if (scored > 0) {
            triggerBroadcast("superball", "SUPER BALL SCORED", `+${scored} Runs (Doubled)`);
          } else {
            triggerBroadcast("superball", "SUPER BALL DOT", "0 Runs");
          }
        } else {
          label = `${runs}`;
          if (runs === 4) {
            striker.fours += 1;
            triggerBroadcast("four", "FOUR RUNS", "Boundary to the Ropes");
          } else if (runs === 6) {
            striker.sixes += 1;
            triggerBroadcast("six", "MAXIMUM SIX", "Clean Tape-Ball Strike");
          }
        }

        striker.runs += scored;
        inn.runs += scored;
        bowler.runs += scored;

        inn.isFreeHit = false;

        if (runs % 2 !== 0) {
          const temp = inn.striker;
          inn.striker = inn.nonStriker;
          inn.nonStriker = temp;
        }
      }

      inn.timeline.push({
        label,
        runs,
        isSuperBall: isSuperBallDelivery,
        isWicket,
        isWide,
        isNoBall
      });

      checkOverAndMatchStatus();
      syncLiveScore();
      refreshCurrentView();
    }

    function triggerSuperBallCall() {
      if (!isAdmin) return;
      const match = AppState.liveMatch;
      if (!match) return;
      const inn = match.currentInnings === 1 ? match.innings1 : match.innings2;

      const currentOverNumber = Math.floor(inn.balls / 6) + 1;
      if (currentOverNumber < 2 || currentOverNumber > 7) {
        showToast("Super Ball is only allowed between Overs 2 and 7!");
        return;
      }
      if (inn.superBallUsed) {
        showToast("Super Ball already used in this innings!");
        return;
      }

      inn.isSuperBallActive = true;
      SoundFX.playSuperBallSiren();
      triggerBroadcast("superball", "SUPER BALL ACTIVATED", "2X Runs • Wicket = -5 Runs");
      syncLiveScore();
      refreshCurrentView();
    }

    function swapStrikeManual() {
      if (!isAdmin) return;
      const match = AppState.liveMatch;
      if (!match) return;
      const inn = match.currentInnings === 1 ? match.innings1 : match.innings2;

      const temp = inn.striker;
      inn.striker = inn.nonStriker;
      inn.nonStriker = temp;

      showToast(`Strike rotated: ${inn.striker} is now on strike`);
      syncLiveScore();
      refreshCurrentView();
    }

    function undoLastDelivery() {
      if (!isAdmin) return;
      const match = AppState.liveMatch;
      if (!match) return;
      const inn = match.currentInnings === 1 ? match.innings1 : match.innings2;

      if (!inn.history || inn.history.length === 0) {
        showToast("No more deliveries to undo!");
        return;
      }

      const lastState = inn.history.pop();
      if (match.currentInnings === 1) {
        match.innings1 = { ...lastState.innings, history: inn.history };
      } else {
        match.innings2 = { ...lastState.innings, history: inn.history };
      }

      showToast("Delivery undone!");
      syncLiveScore();
      refreshCurrentView();
    }

    function checkOverAndMatchStatus() {
      const match = AppState.liveMatch;
      if (!match) return;
      const inn = match.currentInnings === 1 ? match.innings1 : match.innings2;
      const maxBalls = match.totalOvers * 6;
      const totalWickets = match.playingXI[inn.battingTeam].length - 1;

      if (match.currentInnings === 2) {
        const target = match.innings1.runs + 1;
        if (inn.runs >= target) {
          finalizeMatch(match);
          return;
        }
      }

      if (inn.balls >= maxBalls || inn.wickets >= totalWickets) {
        if (match.currentInnings === 1) {
          startSecondInnings(match);
        } else {
          finalizeMatch(match);
        }
        return;
      }

      if (inn.balls > 0 && inn.balls % 6 === 0 && inn.timeline[inn.timeline.length - 1].isWide === false && inn.timeline[inn.timeline.length - 1].isNoBall === false) {
        const temp = inn.striker;
        inn.striker = inn.nonStriker;
        inn.nonStriker = temp;

        openNextBowlerModal();
      }
    }

    function openNextBowlerModal() {
      const match = AppState.liveMatch;
      const inn = match.currentInnings === 1 ? match.innings1 : match.innings2;
      const bowlingSquad = match.playingXI[inn.bowlingTeam];

      const eligibleBowlers = bowlingSquad.filter(p => {
        if (p === inn.currentBowler) return false;
        const bStats = inn.bowlers[p];
        if (bStats && bStats.balls >= 12) return false;
        return true;
      });

      const modal = document.getElementById('modalContainer');
      modal.innerHTML = `
        <div class="bg-[#0F172A] border border-amber-500/50 rounded-3xl p-5 max-w-sm w-full space-y-4 shadow-2xl">
          <div class="text-center">
            <h3 class="text-sm font-black text-white uppercase tracking-wider">Select Next Bowler</h3>
            <p class="text-xs text-slate-400 mt-0.5">Over complete. Max 2 overs per bowler, no consecutive overs.</p>
          </div>

          <div class="space-y-1.5 max-h-56 overflow-y-auto pr-1">
            ${eligibleBowlers.map(p => {
              const b = inn.bowlers[p] || { balls: 0, runs: 0, wickets: 0 };
              const ov = `${Math.floor(b.balls / 6)}.${b.balls % 6}`;
              return `
                <button onclick="selectNextBowler('${p}')" class="w-full p-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-700 flex items-center justify-between text-left text-xs font-bold text-white transition-all touch-target">
                  <span>${p}</span>
                  <span class="text-emerald-400 font-mono text-[11px]">${b.wickets}/${b.runs} (${ov}/2.0)</span>
                </button>
              `;
            }).join('')}
          </div>
        </div>
      `;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function selectNextBowler(bowlerName) {
      const match = AppState.liveMatch;
      const inn = match.currentInnings === 1 ? match.innings1 : match.innings2;

      inn.currentBowler = bowlerName;
      if (!inn.bowlers[bowlerName]) {
        inn.bowlers[bowlerName] = { name: bowlerName, balls: 0, runs: 0, wickets: 0, maidens: 0 };
      }

      closeModal();
      showToast(`${bowlerName} is the new bowler.`);
      syncLiveScore();
      refreshCurrentView();

    function openWicketModal() {
      const modal = document.getElementById('modalContainer');
      modal.innerHTML = `
        <div class="bg-[#0F172A] border border-rose-500/50 rounded-3xl p-5 max-w-sm w-full space-y-4 shadow-2xl">
          <div class="text-center">
            <h3 class="text-sm font-black text-white uppercase tracking-wider">Select Dismissal Method</h3>
            <p class="text-xs text-slate-400 mt-1">Tape-ball standard wicket types.</p>
          </div>

          <div class="grid grid-cols-2 gap-2 text-xs font-bold">

    function finalizeMatch(match) {
      match.status = 'completed';
      const inn1 = match.innings1;
      const inn2 = match.innings2;

      let winner = null;
      let summary = "";

      if (inn2.runs > inn1.runs) {
        winner = inn2.battingTeam;
        const wicketsRemaining = (match.playingXI[inn2.battingTeam].length - 1) - inn2.wickets;
        summary = `${AppState.teams[winner]?.name} won by ${wicketsRemaining} wickets`;
      } else if (inn1.runs > inn2.runs) {
        winner = inn1.battingTeam;
        const margin = inn1.runs - inn2.runs;
        summary = `${AppState.teams[winner]?.name} won by ${margin} runs`;
      } else {
        summary = "Match Tied";
      }

      match.result = { winner, summary };

      const fixture = AppState.fixtures.find(f => f.id === match.fixtureId);
      if (fixture) {
        fixture.status = 'completed';
        fixture.result = summary;
        fixture.scorecard = match;
      }

      if (match.fixtureId < 6) {
        const nextFix = AppState.fixtures.find(f => f.id === match.fixtureId + 1);
        if (nextFix) nextFix.status = 'unlocked';
      } else if (match.fixtureId === 6) {
        seedPlayoffs();
      } else if (match.fixtureId === 7) {
        seedGrandFinal(winner);
      }

      updatePlayerCareerStats(match);

      confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } });
      AppState.liveMatch = null;
      syncData();
      navigateTo('results');
    }

    function seedPlayoffs() {
      const standings = calculateStandings();
      if (standings.length >= 3) {
        const second = standings[1].teamId;
        const third = standings[2].teamId;
        const playoffFix = AppState.fixtures.find(f => f.id === 7);
        if (playoffFix) {
          playoffFix.teamA = second;
          playoffFix.teamB = third;
          playoffFix.status = 'unlocked';
          showToast(`Playoff Match: ${second} vs ${third}`);
        }
      }
    }

    function seedGrandFinal(playoffWinner) {
      const standings = calculateStandings();
      if (standings.length >= 1) {
        const first = standings[0].teamId;
        const finalFix = AppState.fixtures.find(f => f.id === 8);
        if (finalFix) {
          finalFix.teamA = first;
          finalFix.teamB = playoffWinner;
          finalFix.status = 'unlocked';
          showToast(`Grand Final: ${first} vs ${playoffWinner}`);
        }
      }
    }

    function updatePlayerCareerStats(match) {
      [match.innings1, match.innings2].forEach(inn => {
        if (!inn) return;
        Object.values(inn.batsmen).forEach(b => {
          let p = AppState.playerStats[b.name];
          if (!p) {
            p = AppState.playerStats[b.name] = {
              name: b.name, team: inn.battingTeam, matches: 0, innings: 0, runs: 0, balls: 0, fours: 0, sixes: 0, highScore: 0, notOuts: 0, legalBallsBowled: 0, runsConceded: 0, wickets: 0, maidens: 0
            };
          }
          p.matches += 1;
          p.innings += 1;
          p.runs += b.runs;
          p.balls += b.balls;
          p.fours += b.fours;
          p.sixes += b.sixes;
          if (b.runs > p.highScore) p.highScore = b.runs;
          if (!b.isOut) p.notOuts += 1;
        });

        Object.values(inn.bowlers).forEach(bw => {
          let p = AppState.playerStats[bw.name];
          if (!p) {
            p = AppState.playerStats[bw.name] = {
              name: bw.name, team: inn.bowlingTeam, matches: 0, innings: 0, runs: 0, balls: 0, fours: 0, sixes: 0, highScore: 0, notOuts: 0, legalBallsBowled: 0, runsConceded: 0, wickets: 0, maidens: 0
            };
          }
          p.legalBallsBowled += bw.balls;
          p.runsConceded += bw.runs;
          p.wickets += bw.wickets;
          p.maidens += (bw.maidens || 0);
        });
      });
    }

    function launchMatchSetup(fixId) {
      if (!isAdmin) return;
      if (AppState.liveMatch && AppState.liveMatch.fixtureId === fixId) {
        navigateTo('live');
        return;
      }

      const fix = AppState.fixtures.find(f => f.id === fixId);
      if (!fix || !fix.teamA || !fix.teamB) {
        showToast("Teams for this match are not seeded yet!");
        return;
      }

      matchSetupState = {
        fixtureId: fixId,
        teamA: fix.teamA,
        teamB: fix.teamB,
        playingXI: {
          [fix.teamA]: AppState.teams[fix.teamA].squad.slice(0, 11),
          [fix.teamB]: AppState.teams[fix.teamB].squad.slice(0, 11)

        tossWinner: null,
        tossDecision: null
      };

      openPlayingXIModal();
    }

    function togglePlayerSelection(teamId, player) {
      const currentList = matchSetupState.playingXI[teamId];

      if (index > -1) {

      } else {
        if (currentList.length >= 11) {

          openPlayingXIModal();
          return;

        currentList.push(player);

      const counter = document.getElementById(`counter-${teamId}`);
      if (counter) counter.innerText = `${currentList.length} / 11`;

      const teamA = matchSetupState.teamA;

    let isFlipping = false;
    function flipCoin(teamA, teamB) {
      if (isFlipping) return;
      isFlipping = true;

      const coin = document.getElementById('coin3D');
      const winner = Math.random() < 0.5 ? teamA : teamB;
      matchSetupState.tossWinner = winner;

      const rotations = 5 * 360 + (winner === teamB ? 180 : 0);
      coin.style.transform = `rotateY(${rotations}deg)`;

      setTimeout(() => {
        isFlipping = false;
        document.getElementById('tossResultText').innerText = `${AppState.teams[winner]?.name} Won The Toss`;
        document.getElementById('tossResultBanner').classList.remove('hidden');
      }, 3100);

      const bowlTeam = batTeam === matchSetupState.teamA ? matchSetupState.teamB : matchSetupState.teamA;

      const batSquad = matchSetupState.playingXI[batTeam];
      const bowlSquad = matchSetupState.playingXI[bowlTeam];

      modal.innerHTML = `

              </select>
            </div>
          </div>

          <button onclick="startMatchOfficially('${batTeam}', '${bowlTeam}')" class="w-full py-3 rounded-2xl bg-amber-500 text-slate-950 font-black text-xs uppercase tracking-wider shadow-lg touch-target">
            Start 8-Over Match
          </button>
        </div>
      `;
    }

    function startMatchOfficially(batTeam, bowlTeam) {
      const striker = document.getElementById('strikerSelect').value;
      const nonStriker = document.getElementById('nonStrikerSelect').value;
      const bowler = document.getElementById('bowlerSelect').value;

      if (striker === nonStriker) {
        showToast("Striker and Non-Striker must be different!");
        return;
      }

      AppState.liveMatch = {
        fixtureId: matchSetupState.fixtureId,
        teamA: matchSetupState.teamA,
        teamB: matchSetupState.teamB,
        totalOvers: 8,
        status: 'live',
        currentInnings: 1,
        playingXI: matchSetupState.playingXI,
        innings1: {
          battingTeam: batTeam,
          bowlingTeam: bowlTeam,
          runs: 0,
          wickets: 0,
          balls: 0,
          superBallUsed: false,
          isSuperBallActive: false,
          isFreeHit: false,
          striker,
          nonStriker,
          currentBowler: bowler,
          extras: { wides: 0, noBalls: 0 },
          batsmen: {
            [striker]: { name: striker, runs: 0, balls: 0, fours: 0, sixes: 0, isOut: false },
            [nonStriker]: { name: nonStriker, runs: 0, balls: 0, fours: 0, sixes: 0, isOut: false }
          },
          bowlers: {
            [bowler]: { name: bowler, balls: 0, runs: 0, wickets: 0, maidens: 0 }
          },
          timeline: [],
          history: []
        },
        innings2: null
      };

      closeModal();
      showToast("Match is officially LIVE!");
      triggerBroadcast("normal", "MATCH STARTED", `${batTeam} vs ${bowlTeam}`);
      syncData();
      navigateTo('live');
    }

    /**
     * SCREEN 5: LEADERBOARDS (WITH PER-MATCH LEADERBOARD)
     */
    function renderAwardsScreen(container, params = {}) {
      if (params.category) currentLeaderboardTab = params.category;
      if (params.team) currentLeaderboardTeam = params.team;
      if (params.matchId) currentLeaderboardMatchId = params.matchId;

      const players = Object.values(AppState.playerStats);

      // Batting calculations
      const topRunScorers = [...players]
        .map(p => ({
          ...p,
          sr: p.balls > 0 ? ((p.runs / p.balls) * 100).toFixed(1) : "0.0"
        }))
        .sort((a, b) => b.runs - a.runs || parseFloat(b.sr) - parseFloat(a.sr));

      // Sixes leaders
      const topSixHitters = [...players]
        .map(p => ({
          ...p,
          sr: p.balls > 0 ? ((p.runs / p.balls) * 100).toFixed(1) : "0.0"
        }))
        .sort((a, b) => b.sixes - a.sixes || b.runs - a.runs);

      // Bowling calculations
      const topWicketTakers = [...players]
        .map(p => ({
          ...p,
          overs: `${Math.floor((p.legalBallsBowled || 0) / 6)}.${(p.legalBallsBowled || 0) % 6}`,
          econ: p.legalBallsBowled > 0 ? ((p.runsConceded / p.legalBallsBowled) * 6).toFixed(1) : "0.0"
        }))
        .sort((a, b) => b.wickets - a.wickets || a.runsConceded - b.runsConceded);

      // Team leaders
      const teamPlayers = players.filter(p => p.team === currentLeaderboardTeam);
      const teamBatters = [...teamPlayers]
        .map(p => ({
          ...p,
          sr: p.balls > 0 ? ((p.runs / p.balls) * 100).toFixed(1) : "0.0"
        }))
        .sort((a, b) => b.runs - a.runs || b.sixes - a.sixes);

      const teamBowlers = [...teamPlayers]
        .map(p => ({
          ...p,
          overs: `${Math.floor((p.legalBallsBowled || 0) / 6)}.${(p.legalBallsBowled || 0) % 6}`,
          econ: p.legalBallsBowled > 0 ? ((p.runsConceded / p.legalBallsBowled) * 6).toFixed(1) : "0.0"
        }))
        .sort((a, b) => b.wickets - a.wickets || a.runsConceded - b.runsConceded);

      // Per-match calculation
      const matchesWithData = AppState.fixtures.filter(f => f.scorecard || (AppState.liveMatch && AppState.liveMatch.fixtureId === f.id));
      const selectedMatchFixture = AppState.fixtures.find(f => f.id === currentLeaderboardMatchId);
      const selectedScorecard = (AppState.liveMatch && AppState.liveMatch.fixtureId === currentLeaderboardMatchId)
        ? AppState.liveMatch
        : (selectedMatchFixture ? selectedMatchFixture.scorecard : null);

      let matchBatters = [];
      let matchBowlers = [];
      let matchMVP = null;

      if (selectedScorecard) {
        [selectedScorecard.innings1, selectedScorecard.innings2].forEach(inn => {
          if (!inn) return;
          if (inn.batsmen) {
            Object.values(inn.batsmen).forEach(b => {
              if (b.balls > 0 || b.runs > 0) {
                matchBatters.push({
                  name: b.name,
                  team: inn.battingTeam,
                  runs: b.runs,
                  balls: b.balls,
                  fours: b.fours || 0,
                  sixes: b.sixes || 0,
                  isOut: b.isOut,
                  sr: b.balls > 0 ? ((b.runs / b.balls) * 100).toFixed(1) : "0.0"
                });
              }
            });
          }
          if (inn.bowlers) {
            Object.values(inn.bowlers).forEach(bw => {
              if (bw.balls > 0) {
                matchBowlers.push({
                  name: bw.name,
                  team: inn.bowlingTeam,
                  balls: bw.balls,
                  overs: `${Math.floor(bw.balls / 6)}.${bw.balls % 6}`,
                  maidens: bw.maidens || 0,
                  runs: bw.runs,
                  wickets: bw.wickets,
                  econ: bw.balls > 0 ? ((bw.runs / bw.balls) * 6).toFixed(1) : "0.0"
                });
              }
            });
          }
        });

        matchBatters.sort((a, b) => b.runs - a.runs || b.sixes - a.sixes);
        matchBowlers.sort((a, b) => b.wickets - a.wickets || a.runs - b.runs);

        // Calculate MVP
        const mvpPointsMap = {};
        matchBatters.forEach(b => {
          mvpPointsMap[b.name] = (mvpPointsMap[b.name] || 0) + (b.runs * 1) + (b.fours * 1) + (b.sixes * 2);
        });
        matchBowlers.forEach(bw => {
          mvpPointsMap[bw.name] = (mvpPointsMap[bw.name] || 0) + (bw.wickets * 20) + (bw.maidens * 15);
        });

        let topPoints = -1;
        let mvpName = null;
        Object.keys(mvpPointsMap).forEach(name => {
          if (mvpPointsMap[name] > topPoints) {
            topPoints = mvpPointsMap[name];
            mvpName = name;
          }
        });

        if (mvpName) {
          const bStat = matchBatters.find(b => b.name === mvpName);
          const bwStat = matchBowlers.find(bw => bw.name === mvpName);
          matchMVP = {
            name: mvpName,
            points: topPoints,
            runs: bStat ? bStat.runs : 0,
            balls: bStat ? bStat.balls : 0,
            wickets: bwStat ? bwStat.wickets : 0,
            runsConceded: bwStat ? bwStat.runs : 0
          };
        }
      }

      // 5 Main Tabs
      const tabs = [
        { id: 'runs', label: 'Most Runs' },
        { id: 'wickets', label: 'Most Wickets' },
        { id: 'sixes', label: 'Most Sixes' },

              </div>
              <div class="overflow-x-auto rounded-3xl border border-slate-800 bg-[#0D1424] shadow-xl">
                <table class="w-full text-left text-xs sm:text-sm">

                    <tr>

                  <tbody class="divide-y divide-slate-800/60 font-semibold">
                    ${topRunScorers.slice(0, 15).map((p, idx) => `
                      <tr class="${idx === 0 ? 'bg-amber-500/10' : ''}">

            </div>

      if (!isAdmin) return;
      const modal = document.getElementById('modalContainer');
      modal.innerHTML = `

        </div>

      modal.classList.add('flex');

    function confirmRegisterPlayer(teamId) {
      const name = document.getElementById('newPlayerNameInput').value.trim();
      if (!name) return;

      if (!AppState.teams[teamId].squad.includes(name)) {
        AppState.teams[teamId].squad.push(name);
        AppState.playerStats[name] = {
          name, team: teamId, matches: 0, innings: 0, runs: 0, balls: 0, fours: 0, sixes: 0, highScore: 0, notOuts: 0, legalBallsBowled: 0, runsConceded: 0, wickets: 0, maidens: 0
        };
        closeModal();
        showToast(`${name} registered to ${teamId}!`);
        syncData();
        refreshCurrentView();
      } else {
        showToast("Player already in squad!");
      }
    }

              <h3 class="text-xs sm:text-sm font-black text-white uppercase tracking-wider">Database & Backups</h3>
              <p class="text-[11px] sm:text-xs text-slate-400 mt-0.5">Backup state or restore tournament progress.</p>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <button onclick="exportBackupJSON()" class="py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs uppercase border border-slate-700 touch-target">
                Export JSON
              </button>
              <label class="py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs uppercase border border-slate-700 text-center cursor-pointer touch-target">
                Import JSON
                <input type="file" id="importJsonInput" accept=".json" class="hidden" onchange="importBackupJSON(event)">
              </label>
            </div>

            <button onclick="resetTournamentPrompt()" class="w-full py-2.5 rounded-xl bg-rose-600/20 hover:bg-rose-600/30 text-rose-400 border border-rose-500/40 font-black text-xs uppercase tracking-wider touch-target">
              Reset Tournament Database
            </button>
          </div>
        </div>
      `;
    }

    function submitAdminScreenPin() {
      const pin = document.getElementById('adminScreenPinInput').value;
      if (pin === ADMIN_PIN) {
        isAdmin = true;
        localStorage.setItem(AUTH_STORAGE_KEY, "true");
        showToast("Scorer Mode Unlocked!");
        syncData();
        refreshCurrentView();
      } else {
        showToast("Incorrect PIN. Access Denied.");
      }
    }

    function logoutAdmin() {
      isAdmin = false;
      localStorage.setItem(AUTH_STORAGE_KEY, "false");
      showToast("Switched to Spectator Mode");
      refreshCurrentView();
    }

    function exportBackupJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(AppState, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `NSL_S2_BACKUP_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importBackupJSON(e) {
      if (!isAdmin) return;
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const imported = JSON.parse(evt.target.result);
          if (imported.teams && imported.fixtures) {
            AppState = imported;
            syncData();
            showToast("Database restored successfully!");
            refreshCurrentView();
          }
        } catch (err) {
          showToast("Invalid JSON file!");
        }
      };
      reader.readAsText(file);
    }

    function resetTournamentPrompt() {
      if (!isAdmin) return;
      if (confirm("Are you completely sure you want to reset all fixtures, live matches, and player stats?")) {
        AppState = {
          currentView: 'home',
          teams: JSON.parse(JSON.stringify(INITIAL_TEAMS)),
          fixtures: JSON.parse(JSON.stringify(INITIAL_FIXTURES)),
          playerStats: {},
          liveMatch: null,
          lastBroadcast: null,
          rules: [...INITIAL_RULES],
          updatedAt: Date.now()
        };
        populateInitialStats();
        syncData();
        showToast("Tournament reset successfully.");
        navigateTo('home');
      }
    }

    /**
     * STANDINGS & NRR CALCULATOR
     */
    function calculateStandings() {
      const stats = {};
      Object.keys(AppState.teams).forEach(code => {
        stats[code] = {
          teamId: code,
          played: 0,
          won: 0,
          lost: 0,
          pts: 0,
          runsFor: 0,
          oversFor: 0,
          runsAgainst: 0,
          oversAgainst: 0,
          nrr: 0
        };
      });

      AppState.fixtures.forEach(f => {
        if (f.status === 'completed' && f.scorecard && f.type === 'GROUP') {
          const inn1 = f.scorecard.innings1;
          const inn2 = f.scorecard.innings2;
          if (!inn1 || !inn2) return;

          const team1 = inn1.battingTeam;
          const team2 = inn2.battingTeam;
          if (!stats[team1] || !stats[team2]) return;

          stats[team1].played += 1;
          stats[team2].played += 1;

          if (f.scorecard.result && f.scorecard.result.winner) {
            if (f.scorecard.result.winner === team1) {
              stats[team1].won += 1;
              stats[team1].pts += 2;
              stats[team2].lost += 1;
            } else if (f.scorecard.result.winner === team2) {
              stats[team2].won += 1;
              stats[team2].pts += 2;
              stats[team1].lost += 1;
            }
          }

          stats[team1].runsFor += inn1.runs;
          stats[team1].oversFor += inn1.balls / 6;
          stats[team1].runsAgainst += inn2.runs;
          stats[team1].oversAgainst += inn2.balls / 6;

          stats[team2].runsFor += inn2.runs;
          stats[team2].oversFor += inn2.balls / 6;
          stats[team2].runsAgainst += inn1.runs;
          stats[team2].oversAgainst += inn1.balls / 6;
        }
      });

      return Object.values(stats).map(t => {
        const forRR = t.oversFor > 0 ? (t.runsFor / t.oversFor) : 0;
        const againstRR = t.oversAgainst > 0 ? (t.runsAgainst / t.oversAgainst) : 0;
        t.nrr = forRR - againstRR;
        return t;
      }).sort((a, b) => b.pts - a.pts || b.nrr - a.nrr);
    }

    /**
     * MODAL & UI UTILITIES
     */
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const text = document.getElementById('toastMsg');
      if (!toast || !text) return;
      text.innerText = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
        toast.classList.remove('opacity-100');
      }, 2500);
    }

    function closeModal() {
      const modal = document.getElementById('modalContainer');
      if (modal) {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        modal.innerHTML = '';
      }
    }

    function openPlayerCardModal(playerName) {
      const p = AppState.playerStats[playerName] || {
        name: playerName,
        team: 'NSL',
        matches: 0,
        runs: 0,
        balls: 0,
        fours: 0,
        sixes: 0,
        highScore: 0,
        legalBallsBowled: 0,
        runsConceded: 0,
        wickets: 0
      };

      const strikeRate = p.balls > 0 ? ((p.runs / p.balls) * 100).toFixed(1) : "0.0";
      const econ = p.legalBallsBowled > 0 ? ((p.runsConceded / p.legalBallsBowled) * 6).toFixed(1) : "0.0";
      const oversBowled = `${Math.floor((p.legalBallsBowled || 0) / 6)}.${(p.legalBallsBowled || 0) % 6}`;

      const modal = document.getElementById('modalContainer');
      modal.innerHTML = `
        <div class="bg-[#0F172A] border border-amber-500/50 rounded-3xl p-5 max-w-xs w-full space-y-4 shadow-2xl text-center">
          <div>
            ${renderTeamLogo(p.team, "w-12 h-12 mx-auto mb-2")}
            <h3 class="text-base font-black text-white uppercase">${p.name}</h3>
            <span class="text-xs text-amber-400 font-bold">${AppState.teams[p.team]?.name || p.team}</span>
          </div>

          <div class="grid grid-cols-2 gap-2 text-left text-xs bg-slate-900/80 p-3 rounded-2xl border border-slate-800">
            <div><span class="text-slate-400 text-[10px] block font-bold">Matches</span><span class="text-white font-mono font-bold">${p.matches}</span></div>
            <div><span class="text-slate-400 text-[10px] block font-bold">Runs</span><span class="text-amber-400 font-mono font-bold">${p.runs}</span></div>
            <div><span class="text-slate-400 text-[10px] block font-bold">Strike Rate</span><span class="text-slate-300 font-mono font-bold">${strikeRate}</span></div>
            <div><span class="text-slate-400 text-[10px] block font-bold">Boundaries</span><span class="text-slate-300 font-mono font-bold">${p.fours}x4 • ${p.sixes}x6</span></div>
            <div><span class="text-slate-400 text-[10px] block font-bold">Wickets</span><span class="text-emerald-400 font-mono font-bold">${p.wickets}</span></div>
            <div><span class="text-slate-400 text-[10px] block font-bold">Economy</span><span class="text-slate-300 font-mono font-bold">${econ} (${oversBowled} ov)</span></div>
          </div>

          <button onclick="closeModal()" class="w-full py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold hover:bg-slate-700 touch-target">
            Close
          </button>
        </div>
      `;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function shareScorecardWhatsApp(fixtureId) {
      const fix = AppState.fixtures.find(f => f.id === fixtureId);
      if (!fix || !fix.scorecard) return;
      const sc = fix.scorecard;
      const inn1 = sc.innings1;
      const inn2 = sc.innings2;

      let msg = `*NAWAB SUPER LEAGUE S2*\n`;
      msg += `*${fix.name} (${fix.type})*\n`;
      msg += `Result: ${fix.result}\n\n`;
      msg += `*1st Innings: ${inn1.battingTeam}* - ${inn1.runs}/${inn1.wickets} (${Math.floor(inn1.balls/6)}.${inn1.balls%6} ov)\n`;
      Object.values(inn1.batsmen).forEach(b => {
        if (b.balls > 0 || b.runs > 0) {
          msg += `• ${b.name}: ${b.runs} (${b.balls}b, ${b.fours}x4, ${b.sixes}x6)\n`;
        }
      });
      msg += `\n*2nd Innings: ${inn2.battingTeam}* - ${inn2.runs}/${inn2.wickets} (${Math.floor(inn2.balls/6)}.${inn2.balls%6} ov)\n`;
      Object.values(inn2.batsmen).forEach(b => {
        if (b.balls > 0 || b.runs > 0) {
          msg += `• ${b.name}: ${b.runs} (${b.balls}b, ${b.fours}x4, ${b.sixes}x6)\n`;
        }
      });
      msg += `\nFollow Live Scores on NSL S2 Web App!`;

      const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`;
      window.open(url, '_blank');
    }

    /**
     * INITIALIZATION
     */
    let isAppInitialized = false;
    function initApp() {
      if (isAppInitialized) return;
      isAppInitialized = true;
      try {
        loadState();
        const badge = document.getElementById('nav-league-badge');
        if (badge) badge.innerHTML = renderLeagueLogo("w-8 h-8 sm:w-10 sm:h-10");
        navigateTo('home');
      } catch (err) {
        console.error("Fatal initialization error:", err);
        const container = document.getElementById('appContent');
        if (container) {
          container.innerHTML = `
            <div class="p-6 text-center text-slate-300">
              <div class="text-rose-400 font-bold text-lg mb-2">Notice</div>
              <p class="text-xs text-slate-400 mb-4">Tap below to initialize tournament data.</p>
              <button onclick="localStorage.clear(); location.reload();" class="px-4 py-2 bg-amber-500 text-slate-950 font-bold rounded-lg text-sm">
                Refresh & Load NSL S2
              </button>
            </div>
          `;
        }
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
    window.addEventListener('load', initApp);
  </script>
</body>
</html>
