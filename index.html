    /* 3D Coin Toss Animation */
    .coin-perspective { perspective: 1000px; }
    .coin-3d {

    @keyframes bannerPop {

      20% { transform: scale(1.08) translateY(0); opacity: 1; }
      30% { transform: scale(1); }
      80% { transform: scale(1); opacity: 1; }

    /**
     * WEB AUDIO SYNTHESIZER (Crowds, Cheers, Sirens, Buzzers)
     */
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    const SoundFX = {
      // Dual-tone ascending alarm siren for Super Ball
      playSuperBallSiren() {
        try {
          const ctx = getAudioContext();
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          const gain = ctx.createGain();

          osc1.type = 'sawtooth';
          osc2.type = 'sine';

          const now = ctx.currentTime;
          osc1.frequency.setValueAtTime(320, now);
          osc1.frequency.linearRampToValueAtTime(840, now + 0.4);
          osc1.frequency.linearRampToValueAtTime(320, now + 0.8);
          osc1.frequency.linearRampToValueAtTime(950, now + 1.2);

          osc2.frequency.setValueAtTime(480, now);
          osc2.frequency.linearRampToValueAtTime(980, now + 0.4);
          osc2.frequency.linearRampToValueAtTime(480, now + 0.8);
          osc2.frequency.linearRampToValueAtTime(1100, now + 1.2);

          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 1.4);

          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(ctx.destination);

          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + 1.4);
          osc2.stop(now + 1.4);
        } catch (e) { console.warn('Audio unavailable', e); }
      },

      // Stadium Four (Cheer / Applause Resonance)
      playFourCheer() {
        try {
          const ctx = getAudioContext();
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.3);
          osc.frequency.setValueAtTime(660, now + 0.35);

          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.9);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(now);
          osc.stop(now + 0.9);

          // Simulated crowd roar noise
          const bufferSize = ctx.sampleRate * 0.8;
          const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const output = noiseBuffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            output[i] = Math.random() * 2 - 1;
          }
          const whiteNoise = ctx.createBufferSource();
          whiteNoise.buffer = noiseBuffer;

          const filter = ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(600, now);

          const noiseGain = ctx.createGain();
          noiseGain.gain.setValueAtTime(0.08, now);
          noiseGain.gain.linearRampToValueAtTime(0.18, now + 0.2);
          noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);

          whiteNoise.connect(filter);
          filter.connect(noiseGain);
          noiseGain.connect(ctx.destination);

          whiteNoise.start(now);
          whiteNoise.stop(now + 0.8);
        } catch (e) {}
      },

      // Stadium Six (Boom + Massive Roar)
      playSixRoar() {
        try {
          const ctx = getAudioContext();
          const now = ctx.currentTime;

          // Deep explosive bass drop
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(40, now + 0.5);
          gain.gain.setValueAtTime(0.45, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.6);

          // Massive crowd noise filter
          const bufferSize = ctx.sampleRate * 1.5;
          const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const output = noiseBuffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            output[i] = Math.random() * 2 - 1;
          }
          const whiteNoise = ctx.createBufferSource();
          whiteNoise.buffer = noiseBuffer;

          const filter = ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(800, now);
          filter.Q.setValueAtTime(1.5, now);

          const noiseGain = ctx.createGain();
          noiseGain.gain.setValueAtTime(0.05, now);
          noiseGain.gain.linearRampToValueAtTime(0.28, now + 0.3);
          noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 1.4);

          whiteNoise.connect(filter);
          filter.connect(noiseGain);
          noiseGain.connect(ctx.destination);

          whiteNoise.start(now);
          whiteNoise.stop(now + 1.4);
        } catch (e) {}
      },

      // Wicket Fall (Buzzer drop + Crowd gasp)
      playWicketSound() {
        try {
          const ctx = getAudioContext();
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(280, now);
          osc.frequency.exponentialRampToValueAtTime(85, now + 0.45);

          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(now);
          osc.stop(now + 0.5);
        } catch (e) {}
      }
    };

    /**
     * PERSISTENCE & CLOUD ENGINE
     */
    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          AppState = Object.assign(AppState, JSON.parse(raw));
        } else {
          populateInitialStats();
          saveLocalState();
        }
      } catch (e) {
        populateInitialStats();
      }
    }

    function saveLocalState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(AppState));
      } catch (e) {}
    }

    async function syncData(isLocalMutation = true) {
      AppState.updatedAt = Date.now();
      saveLocalState();
      updateGlobalTicker();

      if (firestoreDB && isLocalMutation && isAdmin) {
        try {
          const docRef = window.FirebaseSDK.doc(firestoreDB, "nsl_tournament", "s2_state");
          await window.FirebaseSDK.setDoc(docRef, JSON.parse(JSON.stringify(AppState)));
        } catch (err) {
          console.warn("Firestore sync error:", err);
        }
      }
    }

    function initFirebase() {
      if (!window.FirebaseSDK) return;
      try {
        const app = window.FirebaseSDK.initializeApp(FIREBASE_CONFIG);
        firestoreDB = window.FirebaseSDK.getFirestore(app);
        updateSyncBadgeUI(true);

        const docRef = window.FirebaseSDK.doc(firestoreDB, "nsl_tournament", "s2_state");
        if (firestoreUnsubscribe) firestoreUnsubscribe();

        firestoreUnsubscribe = window.FirebaseSDK.onSnapshot(docRef, (snap) => {
          if (snap.exists()) {
            const remote = snap.data();
            if (!remote.updatedAt || remote.updatedAt > (AppState.updatedAt || 0)) {
              const oldBroadcastTime = AppState.lastBroadcast ? AppState.lastBroadcast.time : 0;
              AppState = Object.assign(AppState, remote);
              saveLocalState();
              refreshCurrentView();

              // Trigger broadcast animation on spectators
              if (AppState.lastBroadcast && AppState.lastBroadcast.time > oldBroadcastTime) {
                triggerBroadcastUI(AppState.lastBroadcast);
              }
            }
          }
        }, (err) => {
          updateSyncBadgeUI(false);
        });
      } catch (e) {
        updateSyncBadgeUI(false);
      }
    }

    function updateSyncBadgeUI(isOnline) {
      const dot = document.getElementById('syncDot');
      const text = document.getElementById('syncText');
      if (dot && text) {
        if (isOnline) {
          dot.className = 'w-2 h-2 rounded-full bg-emerald-400 animate-pulse';
          text.innerText = 'Cloud Live';
        } else {
          dot.className = 'w-2 h-2 rounded-full bg-slate-500';
          text.innerText = 'Local Only';
        }
      }
    }

    window.addEventListener('firebase-sdk-ready', initFirebase);

    /**
     * BROADCAST ANIMATION TRIGGER
     */
    function triggerBroadcast(type, title, sub, icon = "⚡") {
      const broadcastObj = { type, title, sub, icon, time: Date.now() };
      AppState.lastBroadcast = broadcastObj;
      triggerBroadcastUI(broadcastObj);

      if (type === 'superball') SoundFX.playSuperBallSiren();
      else if (type === 'six') SoundFX.playSixRoar();
      else if (type === 'four') SoundFX.playFourCheer();
      else if (type === 'wicket') SoundFX.playWicketSound();
    }

    function triggerBroadcastUI(b) {
      const overlay = document.getElementById('broadcastOverlay');
      const card = document.getElementById('broadcastCard');
      const icon = document.getElementById('broadcastIcon');
      const title = document.getElementById('broadcastTitle');
      const sub = document.getElementById('broadcastSub');

      icon.innerText = b.icon || '🏏';
      title.innerText = b.title;
      sub.innerText = b.sub;

      if (b.type === 'superball') {
        card.className = "px-8 py-5 rounded-3xl border-2 border-purple-500 bg-purple-950/90 shadow-[0_0_50px_rgba(139,92,246,0.6)] text-center backdrop-blur-xl animate-broadcast";

      } else if (b.type === 'six') {
        card.className = "px-8 py-5 rounded-3xl border-2 border-amber-500 bg-amber-950/90 shadow-[0_0_50px_rgba(245,158,11,0.6)] text-center backdrop-blur-xl animate-broadcast";

      } else if (b.type === 'wicket') {

     */
    function navigateTo(view, params = {}) {
      AppState.currentView = view;
      window.scrollTo(0, 0);

      document.querySelectorAll('nav button').forEach(b => {
        b.classList.remove('text-amber-400');
        b.classList.add('text-slate-400');
      });
      const activeBtn = document.getElementById(`nav-${view}`);
      if (activeBtn) {
        activeBtn.classList.remove('text-slate-400');
        activeBtn.classList.add('text-amber-400');
      }

      const container = document.getElementById('appContent');
      container.innerHTML = '';

      switch (view) {
        case 'home': renderHomeScreen(container); break;
        case 'live': renderLiveScorerScreen(container); break;
        case 'fixtures': renderFixturesScreen(container); break;
        case 'points': renderPointsScreen(container); break;
        case 'awards': renderAwardsScreen(container, params); break;
        case 'squads': renderSquadsScreen(container); break;
        case 'results': renderResultsScreen(container); break;
        case 'admin': renderAdminScreen(container); break;
        default: renderHomeScreen(container);
      }

      updateGlobalTicker();
      lucide.createIcons();
    }

      const inn = match.currentInnings === 1 ? match.innings1 : match.innings2;
      const batTeam = AppState.teams[inn.battingTeam];

      const legalBalls = inn.balls;
      const currentOverNumber = Math.floor(legalBalls / 6) + 1;
      const ovFormatted = `${Math.floor(legalBalls / 6)}.${legalBalls % 6}`;

      // Batsmen & Bowler lookups
      const striker = inn.batsmen[inn.striker] || { name: inn.striker, runs: 0, balls: 0, fours: 0, sixes: 0 };

    function renderTimelineBalls(balls) {
      if (!balls || balls.length === 0) {
        return `<span class="text-xs text-slate-500 italic">No balls bowled yet in this over.</span>`;
      }
      return balls.map(b => {
        let bg = "bg-slate-800 text-slate-200 border-slate-700";
        if (b.isSuperBall) bg = "bg-purple-600 text-white border-purple-400 font-black animate-pulse";
        else if (b.isWicket) bg = "bg-rose-600 text-white border-rose-500 font-black";
        else if (b.runs === 6) bg = "bg-amber-500 text-slate-950 border-yellow-300 font-black";
        else if (b.runs === 4) bg = "bg-blue-600 text-white border-blue-400 font-black";
        else if (b.isWide) bg = "bg-yellow-600/40 text-yellow-300 border-yellow-500/50";
        else if (b.isNoBall) bg = "bg-orange-600/40 text-orange-300 border-orange-500/50";

        return `
          <span class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-mono border shrink-0 ${bg}">
            ${b.label}
          </span>
        `;
      }).join('');
    }

    /**
     * SCORING ENGINE LOGIC (Strict Tape-Ball & Superball Rules)
     */
    function recordDelivery({ runs = 0, isWide = false, isNoBall = false, isBoundary = false, isWicket = false, dismissalType = null }) {
      if (!isAdmin) return;
      const match = AppState.liveMatch;
      if (!match || match.status !== 'live') return;

      const inn = match.currentInnings === 1 ? match.innings1 : match.innings2;

      // Save deep snapshot into history (up to 16 balls for multi-ball undo)
      if (!inn.history) inn.history = [];
      inn.history.push(JSON.parse(JSON.stringify({
        innings: { ...inn, history: null },
        currentInnings: match.currentInnings
      })));
      if (inn.history.length > 16) inn.history.shift();

      let isSuperBallDelivery = inn.isSuperBallActive;
      let runsScoredOnBall = 0;
      let label = "";

      // Striker & Bowler references
      let striker = inn.batsmen[inn.striker];
      let bowler = inn.bowlers[inn.currentBowler];

      if (!striker) {
        striker = inn.batsmen[inn.striker] = { name: inn.striker, runs: 0, balls: 0, fours: 0, sixes: 0, isOut: false };
      }
      if (!bowler) {
        bowler = inn.bowlers[inn.currentBowler] = { name: inn.currentBowler, balls: 0, runs: 0, wickets: 0, maidens: 0 };
      }

      // 1. WIDE BALL
      if (isWide) {
        inn.runs += 1;
        bowler.runs += 1;
        inn.extras.wides += 1;
        label = "WD";

        // Super ball on Wide: Carries over to next legal delivery
        if (isSuperBallDelivery) {
          label = "⚡WD";
          inn.isSuperBallActive = true; // persists
        }
        triggerBroadcast("normal", "WIDE BALL", "+1 Extra", "⚠️");
      }
      // 2. NO BALL
      else if (isNoBall) {
        inn.runs += 1;
        bowler.runs += 1;
        inn.extras.noBalls += 1;
        inn.isFreeHit = true; // Next ball is Free Hit

        let batRuns = runs;
        if (isSuperBallDelivery) {
          batRuns = runs * 2;
        }

        striker.runs += batRuns;
        striker.balls += 1;
        inn.runs += batRuns;
        bowler.runs += batRuns;

        if (runs === 4) { striker.fours += 1; triggerBroadcast("four", "FOUR RUNS!", "+4 off No Ball", "💥"); }
        else if (runs === 6) { striker.sixes += 1; triggerBroadcast("six", "SIX RUNS!", "+6 off No Ball", "🚀"); }
        else { triggerBroadcast("normal", "NO BALL", "+1 & Free Hit", "⚠️"); }

        label = isSuperBallDelivery ? `⚡NB+${batRuns}` : `NB+${runs}`;

        // Strike rotation on odd runs off No Ball
        if (runs % 2 !== 0) {
          const temp = inn.striker;
          inn.striker = inn.nonStriker;
          inn.nonStriker = temp;
          // Superball automatically passed to new striker
          if (isSuperBallDelivery) {
            inn.isSuperBallActive = true;
          }
        }
      }
      // 3. WICKET DISMISSAL
      else if (isWicket) {
        striker.balls += 1;
        inn.balls += 1;
        bowler.balls += 1;

        // Check Free Hit rules: Run out only!
        const isFreeHit = inn.isFreeHit;
        const isRunOut = dismissalType === 'Run Out';

        if (isFreeHit && !isRunOut) {
          // Not out on free hit!
          showToast("Not Out! Free Hit Delivery.");
          label = "FH-0";

          // If super ball on Free Hit and bowled/caught, 5 runs STILL deducted
          if (isSuperBallDelivery) {
            inn.runs = Math.max(0, inn.runs - 5);
            label = "⚡FH(-5)";
            triggerBroadcast("superball", "SUPER BALL FREE HIT", "Not Out but -5 Runs Deducted!", "⚡");
            inn.isSuperBallActive = false;
            inn.superBallUsed = true;
          }
        } else {
          // Regular Legal Wicket OR Run Out on Free Hit
          striker.isOut = true;
          striker.dismissal = dismissalType || "Bowled";
          inn.wickets += 1;
          bowler.wickets += 1;
          label = "W";

          // Super Ball Wicket: 5 RUNS DEDUCTION
          if (isSuperBallDelivery) {
            inn.runs = Math.max(0, inn.runs - 5);
            label = "⚡W(-5)";
            triggerBroadcast("wicket", "SUPER BALL WICKET!", "OUT & -5 Runs Deducted", "☝️");
            inn.isSuperBallActive = false;
            inn.superBallUsed = true;
          } else {
            triggerBroadcast("wicket", "WICKET FALLS!", `${striker.name} ${striker.dismissal}`, "☝️");
          }
        }

        inn.isFreeHit = false; // Free hit consumed

        // Prompt for next batter if not all-out
        if (inn.wickets < (match.playingXI[inn.battingTeam].length - 1)) {
          openNextBatsmanModal();
        }
      }
      // 4. REGULAR LEGAL DELIVERY
      else {
        striker.balls += 1;
        inn.balls += 1;
        bowler.balls += 1;

        let scored = runs;
        // Super Ball: Doubles runs off bat
        if (isSuperBallDelivery) {
          scored = runs * 2;
          label = `⚡${scored}`;
          inn.isSuperBallActive = false;
          inn.superBallUsed = true;

          if (scored > 0) {
            triggerBroadcast("superball", "SUPER BALL SCORED!", `+${scored} Runs (Doubled Bat Runs)`, "⚡");
          } else {
            triggerBroadcast("superball", "SUPER BALL DOT", "0 Runs", "⚡");
          }
        } else {
          label = `${runs}`;
          if (runs === 4) {
            striker.fours += 1;
            triggerBroadcast("four", "FOUR RUNS!", "Boundary to the ropes", "💥");
          } else if (runs === 6) {
            striker.sixes += 1;
            triggerBroadcast("six", "MAXIMUM SIX!", "Massive Tape-Ball Hit", "🚀");
          }
        }

        striker.runs += scored;
        inn.runs += scored;
        bowler.runs += scored;

        inn.isFreeHit = false; // Consumed

        // Strike rotation on odd runs
        if (runs % 2 !== 0) {
          const temp = inn.striker;
          inn.striker = inn.nonStriker;
          inn.nonStriker = temp;
        }
      }

      // Add to timeline
      inn.timeline.push({
        label,
        runs,
        isSuperBall: isSuperBallDelivery,
        isWicket,
        isWide,
        isNoBall
      });

      // Check End of Over or End of Match
      checkOverAndMatchStatus();
      syncData();
      refreshCurrentView();
    }

    /**
     * SUPER BALL TRIGGER (Overs 2 to 7)
     */
    function triggerSuperBallCall() {
      if (!isAdmin) return;
      const match = AppState.liveMatch;
      if (!match) return;
      const inn = match.currentInnings === 1 ? match.innings1 : match.innings2;

      const currentOverNumber = Math.floor(inn.balls / 6) + 1;
      if (currentOverNumber < 2 || currentOverNumber > 7) {
        showToast("Super Ball is only allowed between Overs 2 and 7!");
        return;
      }
      if (inn.superBallUsed) {
        showToast("Super Ball already used in this innings!");
        return;
      }

      inn.isSuperBallActive = true;
      SoundFX.playSuperBallSiren();
      triggerBroadcast("superball", "SUPER BALL ACTIVATED!", "2X Runs • Wicket = -5 Runs Penalty", "⚡");
      syncData();
      refreshCurrentView();
    }

    /**
     * SWAP STRIKE MANUALLY
     */
    function swapStrikeManual() {
      if (!isAdmin) return;
      const match = AppState.liveMatch;
      if (!match) return;
      const inn = match.currentInnings === 1 ? match.innings1 : match.innings2;

      const temp = inn.striker;
      inn.striker = inn.nonStriker;
      inn.nonStriker = temp;

      showToast(`Strike swapped: ${inn.striker} is now on strike`);
      syncData();
      refreshCurrentView();
    }

    /**
     * MULTI-BALL UNDO (16 Balls History)
     */
    function undoLastDelivery() {
      if (!isAdmin) return;
      const match = AppState.liveMatch;
      if (!match) return;
      const inn = match.currentInnings === 1 ? match.innings1 : match.innings2;

      if (!inn.history || inn.history.length === 0) {
        showToast("No more balls to undo!");
        return;
      }

      const lastState = inn.history.pop();
      if (match.currentInnings === 1) {
        match.innings1 = { ...lastState.innings, history: inn.history };
      } else {
        match.innings2 = { ...lastState.innings, history: inn.history };
      }

      showToast("Delivery successfully undone!");
      syncData();
      refreshCurrentView();
    }

    /**
     * OVER & MATCH STATUS EVALUATOR
     */
    function checkOverAndMatchStatus() {
      const match = AppState.liveMatch;
      if (!match) return;
      const inn = match.currentInnings === 1 ? match.innings1 : match.innings2;
      const maxBalls = match.totalOvers * 6;
      const totalWickets = match.playingXI[inn.battingTeam].length - 1;

      // 1. Check if 2nd Innings Target has been passed
      if (match.currentInnings === 2) {
        const target = match.innings1.runs + 1;
        if (inn.runs >= target) {
          finalizeMatch(match);
          return;
        }
      }

      // 2. Check Innings Complete (All out or max overs reached)
      if (inn.balls >= maxBalls || inn.wickets >= totalWickets) {
        if (match.currentInnings === 1) {
          startSecondInnings(match);
        } else {
          finalizeMatch(match);
        }
        return;
      }

      // 3. Check End of Over (Legal balls divisible by 6)
      if (inn.balls > 0 && inn.balls % 6 === 0 && inn.timeline[inn.timeline.length - 1].isWide === false && inn.timeline[inn.timeline.length - 1].isNoBall === false) {
        // Automatic strike rotation at end of over
        const temp = inn.striker;
        inn.striker = inn.nonStriker;
        inn.nonStriker = temp;

        // Prompt for Next Bowler (Strict 2 Overs Max + No Consecutive Overs)
        openNextBowlerModal();
      }
    }

      showToast(`Innings 1 Complete! Target: ${match.innings1.runs + 1}`);

    function finalizeMatch(match) {
      match.status = 'completed';
      const inn1 = match.innings1;
      const inn2 = match.innings2;

      let winner = null;
      let summary = "";

      if (inn2.runs > inn1.runs) {
        winner = inn2.battingTeam;
        const wicketsRemaining = (match.playingXI[inn2.battingTeam].length - 1) - inn2.wickets;
        summary = `${AppState.teams[winner]?.name} won by ${wicketsRemaining} wickets`;
      } else if (inn1.runs > inn2.runs) {
        winner = inn1.battingTeam;
        const margin = inn1.runs - inn2.runs;
        summary = `${AppState.teams[winner]?.name} won by ${margin} runs`;
      } else {
        summary = "Match Tied";
      }

      match.result = { winner, summary };

      // Update tournament fixture record
      const fixture = AppState.fixtures.find(f => f.id === match.fixtureId);
      if (fixture) {
        fixture.status = 'completed';
        fixture.result = summary;
        fixture.scorecard = match;
      }

      // Unlock next fixture sequentially
      if (match.fixtureId < 6) {
        const nextFix = AppState.fixtures.find(f => f.id === match.fixtureId + 1);
        if (nextFix) nextFix.status = 'unlocked';
      } else if (match.fixtureId === 6) {
        // Group stage finished! Dynamically seed Playoff (2nd vs 3rd)
        seedPlayoffs();
      } else if (match.fixtureId === 7) {
        // Playoff finished! Seed Grand Final (1st vs Winner of Playoff)
        seedGrandFinal(winner);
      }

      // Accumulate career player statistics
      updatePlayerCareerStats(match);

      confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      AppState.liveMatch = null;
      syncData();
      navigateTo('results');
    }

    function updatePlayerCareerStats(match) {
      [match.innings1, match.innings2].forEach(inn => {
        if (!inn) return;
        // Batters
        Object.values(inn.batsmen).forEach(b => {
          let p = AppState.playerStats[b.name];
          if (!p) {
            p = AppState.playerStats[b.name] = {
              name: b.name, team: inn.battingTeam, matches: 0, innings: 0, runs: 0, balls: 0, fours: 0, sixes: 0, highScore: 0, notOuts: 0, legalBallsBowled: 0, runsConceded: 0, wickets: 0, maidens: 0
            };
          }
          p.matches += 1;
          p.innings += 1;
          p.runs += b.runs;
          p.balls += b.balls;
          p.fours += b.fours;
          p.sixes += b.sixes;
          if (b.runs > p.highScore) p.highScore = b.runs;
          if (!b.isOut) p.notOuts += 1;
        });

        // Bowlers
        Object.values(inn.bowlers).forEach(bw => {
          let p = AppState.playerStats[bw.name];
          if (!p) {
            p = AppState.playerStats[bw.name] = {
              name: bw.name, team: inn.bowlingTeam, matches: 0, innings: 0, runs: 0, balls: 0, fours: 0, sixes: 0, highScore: 0, notOuts: 0, legalBallsBowled: 0, runsConceded: 0, wickets: 0, maidens: 0
            };
          }
          p.legalBallsBowled += bw.balls;
          p.runsConceded += bw.runs;
          p.wickets += bw.wickets;
          p.maidens += (bw.maidens || 0);
        });
      });
    }

      const rotations = 5 * 360 + (winner === teamB ? 180 : 0);

        document.getElementById('tossResultText').innerText = `🪙 ${AppState.teams[winner]?.name} Won The Toss!`;

    function calculateStandings() {
      const stats = {};
      Object.keys(AppState.teams).forEach(t => {
        stats[t] = { teamId: t, played: 0, won: 0, lost: 0, pts: 0, runsScored: 0, ballsFaced: 0, runsConceded: 0, ballsBowled: 0, nrr: 0.0 };
      });

      AppState.fixtures.filter(f => f.status === 'completed' && f.type === 'GROUP' && f.scorecard).forEach(f => {
        const sc = f.scorecard;
        const inn1 = sc.innings1;
        const inn2 = sc.innings2;

        stats[inn1.battingTeam].played += 1;
        stats[inn2.battingTeam].played += 1;

        if (sc.result.winner === inn1.battingTeam) {
          stats[inn1.battingTeam].won += 1;
          stats[inn1.battingTeam].pts += 2;
          stats[inn2.battingTeam].lost += 1;
        } else if (sc.result.winner === inn2.battingTeam) {
          stats[inn2.battingTeam].won += 1;
          stats[inn2.battingTeam].pts += 2;
          stats[inn1.battingTeam].lost += 1;
        }

        // Innings 1 NRR components (all-out counts as full 8 overs)
        const inn1BallsFaced = inn1.wickets >= (sc.playingXI[inn1.battingTeam].length - 1) ? 48 : inn1.balls;
        stats[inn1.battingTeam].runsScored += inn1.runs;
        stats[inn1.battingTeam].ballsFaced += inn1BallsFaced;
        stats[inn1.bowlingTeam].runsConceded += inn1.runs;
        stats[inn1.bowlingTeam].ballsBowled += inn1BallsFaced;

        // Innings 2 NRR components
        const inn2BallsFaced = inn2.wickets >= (sc.playingXI[inn2.battingTeam].length - 1) ? 48 : inn2.balls;
        stats[inn2.battingTeam].runsScored += inn2.runs;
        stats[inn2.battingTeam].ballsFaced += inn2BallsFaced;
        stats[inn2.bowlingTeam].runsConceded += inn2.runs;
        stats[inn2.bowlingTeam].ballsBowled += inn2BallsFaced;
      });

      return Object.values(stats).map(s => {
        const forRate = s.ballsFaced > 0 ? (s.runsScored / (s.ballsFaced / 6)) : 0;
        const againstRate = s.ballsBowled > 0 ? (s.runsConceded / (s.ballsBowled / 6)) : 0;
        s.nrr = forRate - againstRate;
        return s;
      }).sort((a, b) => b.pts - a.pts || b.nrr - a.nrr);
    }

    function seedPlayoffs() {
      const standings = calculateStandings();
      if (standings.length < 3) return;

      const playoff = AppState.fixtures.find(f => f.id === 7);
      if (playoff) {

      const standings = calculateStandings();

                      <span class="text-[10px] px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 font-bold">Final</span>
                    </div>

                    <div class="space-y-2 py-1">
                      <div class="flex items-center justify-between text-xs font-bold">
                        <div class="flex items-center space-x-2">
                          ${renderTeamLogo(inn1.battingTeam, "w-6 h-6")}
                          <span class="text-white">${inn1.battingTeam}</span>
                        </div>
                        <span class="font-mono text-slate-200">${inn1.runs}/${inn1.wickets} (${Math.floor(inn1.balls/6)}.${inn1.balls%6} ov)</span>
                      </div>

                      <div class="flex items-center justify-between text-xs font-bold">
                        <div class="flex items-center space-x-2">
                          ${renderTeamLogo(inn2.battingTeam, "w-6 h-6")}
                          <span class="text-white">${inn2.battingTeam}</span>
                        </div>
                        <span class="font-mono text-slate-200">${inn2.runs}/${inn2.wickets} (${Math.floor(inn2.balls/6)}.${inn2.balls%6} ov)</span>
                      </div>
                    </div>

                    <div class="text-center py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-xs font-bold text-emerald-400">
                      🏆 ${f.result}
                    </div>

                    <!-- WhatsApp Pro Share Button -->
                    <button onclick="shareScorecardWhatsApp(${f.id})" class="w-full py-2.5 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xs uppercase tracking-wider shadow-lg shadow-emerald-600/20 flex items-center justify-center gap-2">
                      <i data-lucide="share-2" class="w-4 h-4"></i> Share Full Scorecard on WhatsApp
                    </button>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>
      `;
    }

    /**
     * WHATSAPP PRO SCORECARD GENERATOR
     */
    function shareScorecardWhatsApp(fixId) {
      const f = AppState.fixtures.find(x => x.id === fixId);
      if (!f || !f.scorecard) return;

      const sc = f.scorecard;
      const inn1 = sc.innings1;
      const inn2 = sc.innings2;

      let msg = `🏆 *NSL S2 - ${f.name.toUpperCase()} SCORECARD*\n`;
      msg += `━━━━━━━━━━━━━━━━━━━━\n`;
      msg += `📍 *Result:* ${f.result}\n\n`;

      // Innings 1
      msg += `🏏 *${inn1.battingTeam} Innings:* ${inn1.runs}/${inn1.wickets} (${Math.floor(inn1.balls/6)}.${inn1.balls%6} ov)\n`;
      Object.values(inn1.batsmen).forEach(b => {
        if (b.balls > 0 || b.isOut) {
          msg += `• ${b.name}: ${b.runs} (${b.balls}b, ${b.fours}x4, ${b.sixes}x6)\n`;
        }
      });
      msg += `*Bowling (${inn1.bowlingTeam}):*\n`;
      Object.values(inn1.bowlers).forEach(bw => {
        if (bw.balls > 0) {
          msg += `• ${bw.name}: ${bw.wickets}/${bw.runs} (${Math.floor(bw.balls/6)}.${bw.balls%6} ov)\n`;
        }
      });

      msg += `\n━━━━━━━━━━━━━━━━━━━━\n`;

      // Innings 2
      msg += `🏏 *${inn2.battingTeam} Innings:* ${inn2.runs}/${inn2.wickets} (${Math.floor(inn2.balls/6)}.${inn2.balls%6} ov)\n`;
      Object.values(inn2.batsmen).forEach(b => {
        if (b.balls > 0 || b.isOut) {
          msg += `• ${b.name}: ${b.runs} (${b.balls}b, ${b.fours}x4, ${b.sixes}x6)\n`;
        }
      });
      msg += `*Bowling (${inn2.bowlingTeam}):*\n`;
      Object.values(inn2.bowlers).forEach(bw => {
        if (bw.balls > 0) {
          msg += `• ${bw.name}: ${bw.wickets}/${bw.runs} (${Math.floor(bw.balls/6)}.${bw.balls%6} ov)\n`;
        }
      });

      msg += `\n⚡ *NSL Season 2 Official Portal*\n`;
      msg += `Follow live at: ${window.location.origin}`;

      const encoded = encodeURI(msg);
      window.open(`https://api.whatsapp.com/send?text=${encoded}`, '_blank');
    }

    /**
     * SCREEN 8: ADMIN & SETTINGS
     */
    function renderAdminScreen(container) {
      container.innerHTML = `
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h2 class="font-display text-3xl font-black text-white uppercase tracking-wider">Admin & Cloud Engine</h2>
            <span class="text-[10px] px-2.5 py-1 rounded-full font-bold ${isAdmin ? 'bg-amber-500/20 text-amber-400' : 'bg-slate-800 text-slate-400'}">
              ${isAdmin ? 'Authorized' : 'Spectator'}
            </span>
          </div>

          <div class="rounded-3xl bg-[#0D1424] border border-slate-800 p-5 shadow-xl space-y-4">
            <div>
              <h3 class="text-sm font-black text-white uppercase tracking-wider">Access Authorization</h3>
              <p class="text-xs text-slate-400 mt-0.5">Toggle between official match scoring and read-only spectator mode.</p>
            </div>

            ${isAdmin ? `
              <button onclick="handleAdminToggleClick()" class="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs uppercase border border-slate-700">
                Log Out to Spectator Mode
              </button>
            ` : `
              <button onclick="openAdminPinModal()" class="w-full py-3 rounded-2xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs uppercase tracking-wider shadow-lg shadow-amber-500/20">
                Enter Admin PIN
              </button>
            `}
          </div>

          <!-- Backup & Restore -->
          <div class="rounded-3xl bg-[#0D1424] border border-slate-800 p-5 shadow-xl space-y-3">
            <div>
              <h3 class="text-sm font-black text-white uppercase tracking-wider">Data Safeguards</h3>
              <p class="text-xs text-slate-400 mt-0.5">Export tournament database as JSON or import backup.</p>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <button onclick="exportBackupJSON()" class="py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs uppercase border border-slate-700">
                Export JSON
              </button>
              <label class="py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs uppercase border border-slate-700 text-center cursor-pointer">
                Import JSON
                <input type="file" id="importJsonInput" accept=".json" class="hidden" onchange="importBackupJSON(event)">
              </label>
            </div>

            ${isAdmin ? `
              <button onclick="resetTournamentPrompt()" class="w-full py-2.5 mt-2 rounded-xl bg-rose-600/20 hover:bg-rose-600/30 text-rose-400 border border-rose-500/40 font-black text-xs uppercase tracking-wider">
                Reset Tournament Database
              </button>
            ` : ''}
          </div>
        </div>
      `;
    }

    function exportBackupJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(AppState, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `NSL_S2_BACKUP_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importBackupJSON(e) {
      if (!isAdmin) {
        showToast("Admin authorization required to import backups!");
        return;
      }
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const imported = JSON.parse(evt.target.result);
          if (imported.teams && imported.fixtures) {
            AppState = imported;
            syncData();
            showToast("Database restored successfully!");
            refreshCurrentView();
          }
        } catch (err) {
          showToast("Invalid JSON file!");
        }
      };
      reader.readAsText(file);
    }

    function resetTournamentPrompt() {
      if (!isAdmin) return;
      if (confirm("Are you completely sure you want to reset all tournament fixtures, live matches, and scores?")) {
        AppState = {
          currentView: 'home',
          teams: JSON.parse(JSON.stringify(INITIAL_TEAMS)),
          fixtures: JSON.parse(JSON.stringify(INITIAL_FIXTURES)),
          playerStats: {},
          liveMatch: null,
          lastBroadcast: null,
          updatedAt: Date.now()
        };
        populateInitialStats();
        syncData();
        showToast("Tournament reset to original schedule.");
        navigateTo('home');
      }
    }

    /**
     * INITIALIZATION
     */
    window.onload = function() {
      loadState();
      document.getElementById('nav-league-badge').innerHTML = renderLeagueLogo("w-9 h-9");
      updateAdminModeUI();
      navigateTo('home');
    };
  </script>
</body>
</html>
