    /**
     * WEB AUDIO SYNTHESIZER
     */
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    const SoundFX = {
      playSuperBallSiren() {
        try {
          const ctx = getAudioContext();
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          const gain = ctx.createGain();

          osc1.type = 'sawtooth';
          osc2.type = 'sine';

          const now = ctx.currentTime;
          osc1.frequency.setValueAtTime(320, now);
          osc1.frequency.linearRampToValueAtTime(840, now + 0.4);
          osc1.frequency.linearRampToValueAtTime(320, now + 0.8);
          osc1.frequency.linearRampToValueAtTime(950, now + 1.2);

          osc2.frequency.setValueAtTime(480, now);
          osc2.frequency.linearRampToValueAtTime(980, now + 0.4);
          osc2.frequency.linearRampToValueAtTime(480, now + 0.8);
          osc2.frequency.linearRampToValueAtTime(1100, now + 1.2);

          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 1.4);

          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(ctx.destination);

          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + 1.4);
          osc2.stop(now + 1.4);
        } catch (e) {}
      },

      playFourCheer() {
        try {
          const ctx = getAudioContext();
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.3);
          osc.frequency.setValueAtTime(660, now + 0.35);

          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.9);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(now);
          osc.stop(now + 0.9);
        } catch (e) {}
      },

      playSixRoar() {
        try {
          const ctx = getAudioContext();
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(40, now + 0.5);
          gain.gain.setValueAtTime(0.45, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.6);
        } catch (e) {}
      },

      playWicketSound() {
        try {
          const ctx = getAudioContext();
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(280, now);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(now);
          osc.stop(now + 0.5);
        } catch (e) {}
      }
    };

    /**
     * PERSISTENCE & CLOUD ENGINE
     */
    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          AppState = Object.assign({}, AppState, parsed);
          if (!Array.isArray(AppState.fixtures) || AppState.fixtures.length === 0) {
            AppState.fixtures = JSON.parse(JSON.stringify(INITIAL_FIXTURES));
          }
          if (!AppState.teams || Object.keys(AppState.teams).length === 0) {
            AppState.teams = JSON.parse(JSON.stringify(INITIAL_TEAMS));
          }
          if (!Array.isArray(AppState.rules) || AppState.rules.length === 0) {
            AppState.rules = [...INITIAL_RULES];
          }
        } else {
          populateInitialStats();
          saveLocalState();
        }
      } catch (e) {
        console.error("loadState error:", e);
        populateInitialStats();
      }
    }

    function saveLocalState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(AppState));
      } catch (e) {}
    }

    async function syncData(isLocalMutation = true) {
      AppState.updatedAt = Date.now();
      saveLocalState();
      updateGlobalTicker();

      if (firestoreDB && isLocalMutation && isAdmin) {
        try {
          const docRef = window.FirebaseSDK.doc(firestoreDB, "nsl_tournament", "s2_state");
          await window.FirebaseSDK.setDoc(docRef, JSON.parse(JSON.stringify(AppState)));
        } catch (err) {
          console.warn("Firestore sync error:", err);
        }
      }
    }

    function initFirebase() {
      if (!window.FirebaseSDK) return;
      try {
        const app = window.FirebaseSDK.initializeApp(FIREBASE_CONFIG);
        firestoreDB = window.FirebaseSDK.getFirestore(app);

        const docRef = window.FirebaseSDK.doc(firestoreDB, "nsl_tournament", "s2_state");
        if (firestoreUnsubscribe) firestoreUnsubscribe();

        firestoreUnsubscribe = window.FirebaseSDK.onSnapshot(docRef, (snap) => {
          if (snap.exists()) {
            const remote = snap.data();
            if (!remote.updatedAt || remote.updatedAt > (AppState.updatedAt || 0)) {
              const oldBroadcastTime = AppState.lastBroadcast ? AppState.lastBroadcast.time : 0;
              AppState = Object.assign(AppState, remote);
              saveLocalState();
              refreshCurrentView();

              if (AppState.lastBroadcast && AppState.lastBroadcast.time > oldBroadcastTime) {
                triggerBroadcastUI(AppState.lastBroadcast);
              }
            }
          }
        }, (err) => {
          console.warn("Firestore sync offline fallback", err);
        });
      } catch (e) {
        console.warn("Firebase initialization skipped", e);
      }
    }

    window.addEventListener('firebase-sdk-ready', initFirebase);

    /**
     * CLEAN BROADCAST ANIMATION TRIGGER (NO EMOJIS)
     */
    function triggerBroadcast(type, title, sub) {
      const broadcastObj = { type, title, sub, time: Date.now() };
      AppState.lastBroadcast = broadcastObj;
      triggerBroadcastUI(broadcastObj);

      if (type === 'superball') SoundFX.playSuperBallSiren();
      else if (type === 'six') SoundFX.playSixRoar();
      else if (type === 'four') SoundFX.playFourCheer();
      else if (type === 'wicket') SoundFX.playWicketSound();
    }

    function triggerBroadcastUI(b) {
      const overlay = document.getElementById('broadcastOverlay');
      const card = document.getElementById('broadcastCard');
      const title = document.getElementById('broadcastTitle');
      const sub = document.getElementById('broadcastSub');

      title.innerText = b.title;
      sub.innerText = b.sub;

      if (b.type === 'superball') {
        card.className = "px-8 py-5 rounded-3xl border-2 border-purple-500 bg-purple-950/90 shadow-[0_0_40px_rgba(139,92,246,0.6)] text-center backdrop-blur-xl animate-broadcast max-w-xs w-full";

        card.className = "px-8 py-5 rounded-3xl border-2 border-amber-500 bg-amber-950/90 shadow-[0_0_40px_rgba(245,158,11,0.6)] text-center backdrop-blur-xl animate-broadcast max-w-xs w-full";

    /**
     * NAVIGATION ROUTER WITH UNIVERSAL BACK BUTTON
     */
    function navigateTo(view, params = {}, trackHistory = true) {
      if (trackHistory && view !== AppState.currentView) {
        navigationHistory.push(view);
      }
      AppState.currentView = view;
      window.scrollTo(0, 0);

      // Bottom nav updates (only 4 primary tabs)
      document.querySelectorAll('nav button').forEach(b => {
        b.classList.remove('text-amber-400');
        b.classList.add('text-slate-400');
      });
      const activeBtn = document.getElementById(`nav-${view}`);
      if (activeBtn) {
        activeBtn.classList.remove('text-slate-400');
        activeBtn.classList.add('text-amber-400');
      }

      const container = document.getElementById('appContent');
      container.innerHTML = '';

      switch (view) {
        case 'home': renderHomeScreen(container); break;
        case 'live': renderLiveScorerScreen(container); break;
        case 'fixtures': renderFixturesScreen(container); break;
        case 'points': renderPointsScreen(container); break;
        case 'awards': renderAwardsScreen(container, params); break;
        case 'squads': renderSquadsScreen(container); break;
        case 'results': renderResultsScreen(container); break;
        case 'rules': renderRulesScreen(container); break;
        case 'admin': renderAdminScreen(container); break;
        default: renderHomeScreen(container);
      }

      updateGlobalTicker();
      renderIcons();
    }

    function navigateBack() {
      if (navigationHistory.length > 1) {
        navigationHistory.pop();
        const prev = navigationHistory[navigationHistory.length - 1];
        navigateTo(prev, {}, false);

      }

          <!-- IN-GAME SCORECARD TABLES (SYMMETRICAL, MOBILE READABLE) -->

              <span class="text-[11px] font-mono text-amber-400 font-bold">${batTeam?.shortName}</span>
            </h3>

            <!-- Batting Table -->
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs">

                  <tr class="text-[10px] text-slate-400 border-b border-slate-800 uppercase font-black">
                    <th class="pb-2">Batter</th>
                    <th class="pb-2 text-right">R</th>

    function renderTimelineBalls(balls) {
      if (!balls || balls.length === 0) {
        return `<span class="text-xs text-slate-500 italic">No deliveries bowled yet.</span>`;
      }
      return balls.map(b => {
        let bg = "bg-slate-800 text-slate-200 border-slate-700";
        if (b.isSuperBall) bg = "bg-purple-600 text-white border-purple-400 font-black";
        else if (b.isWicket) bg = "bg-rose-600 text-white border-rose-500 font-black";
        else if (b.runs === 6) bg = "bg-amber-500 text-slate-950 border-amber-300 font-black";
        else if (b.runs === 4) bg = "bg-blue-600 text-white border-blue-400 font-black";
        else if (b.isWide) bg = "bg-yellow-600/30 text-yellow-300 border-yellow-500/50";
        else if (b.isNoBall) bg = "bg-orange-600/30 text-orange-300 border-orange-500/50";

        let cleanLabel = b.label || '';
        cleanLabel = cleanLabel.replace(/[^a-zA-Z0-9+()\-]/g, '');
        if (b.isSuperBall && !cleanLabel.startsWith('SB')) {
          cleanLabel = cleanLabel ? 'SB-' + cleanLabel : 'SB';
        }

        return `
          <span class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-mono border shrink-0 ${bg}">
            ${cleanLabel}
          </span>
        `;
      }).join('');
    }

    /**
     * SCORING ENGINE LOGIC (Strict Tape-Ball & Superball Rules, Zero Emojis)
     */
    function recordDelivery({ runs = 0, isWide = false, isNoBall = false, isBoundary = false, isWicket = false, dismissalType = null }) {
      if (!isAdmin) return;
      const match = AppState.liveMatch;
      if (!match || match.status !== 'live') return;

      const inn = match.currentInnings === 1 ? match.innings1 : match.innings2;

      if (!inn.history) inn.history = [];
      inn.history.push(JSON.parse(JSON.stringify({
        innings: { ...inn, history: null },
        currentInnings: match.currentInnings
      })));
      if (inn.history.length > 16) inn.history.shift();

      let isSuperBallDelivery = inn.isSuperBallActive;
      let label = "";

      let striker = inn.batsmen[inn.striker];
      let bowler = inn.bowlers[inn.currentBowler];

      if (!striker) {
        striker = inn.batsmen[inn.striker] = { name: inn.striker, runs: 0, balls: 0, fours: 0, sixes: 0, isOut: false };
      }
      if (!bowler) {
        bowler = inn.bowlers[inn.currentBowler] = { name: inn.currentBowler, balls: 0, runs: 0, wickets: 0, maidens: 0 };
      }

      // 1. WIDE
      if (isWide) {
        inn.runs += 1;
        bowler.runs += 1;
        inn.extras.wides += 1;
        label = "WD";

        if (isSuperBallDelivery) {
          label = "SB-WD";
          inn.isSuperBallActive = true;
        }
        triggerBroadcast("normal", "WIDE BALL", "+1 Run Extra");
      }
      // 2. NO BALL
      else if (isNoBall) {
        inn.runs += 1;
        bowler.runs += 1;
        inn.extras.noBalls += 1;
        inn.isFreeHit = true;

        let batRuns = runs;
        if (isSuperBallDelivery) {
          batRuns = runs * 2;
        }

        striker.runs += batRuns;
        striker.balls += 1;
        inn.runs += batRuns;
        bowler.runs += batRuns;

        if (runs === 4) { striker.fours += 1; triggerBroadcast("four", "FOUR RUNS", "+4 Off No Ball"); }
        else if (runs === 6) { striker.sixes += 1; triggerBroadcast("six", "SIX RUNS", "+6 Off No Ball"); }
        else { triggerBroadcast("normal", "NO BALL", "+1 & Free Hit Next"); }

        label = isSuperBallDelivery ? `SB-NB+${batRuns}` : `NB+${runs}`;

        if (runs % 2 !== 0) {
          const temp = inn.striker;
          inn.striker = inn.nonStriker;
          inn.nonStriker = temp;
          if (isSuperBallDelivery) {
            inn.isSuperBallActive = true;
          }
        }
      }
      // 3. WICKET
      else if (isWicket) {
        striker.balls += 1;
        inn.balls += 1;
        bowler.balls += 1;

        const isFreeHit = inn.isFreeHit;
        const isRunOut = dismissalType === 'Run Out';

        if (isFreeHit && !isRunOut) {
          showToast("Not Out! Free Hit Delivery.");
          label = "FH-0";

          if (isSuperBallDelivery) {
            inn.runs = Math.max(0, inn.runs - 5);
            label = "SB-FH(-5)";
            triggerBroadcast("superball", "SUPER BALL FREE HIT", "Not Out but -5 Runs Deducted");
            inn.isSuperBallActive = false;
            inn.superBallUsed = true;
          }
        } else {
          striker.isOut = true;
          striker.dismissal = dismissalType || "Bowled";
          inn.wickets += 1;
          bowler.wickets += 1;
          label = "W";

          if (isSuperBallDelivery) {
            inn.runs = Math.max(0, inn.runs - 5);
            label = "SB-W(-5)";
            triggerBroadcast("wicket", "SUPER BALL WICKET", "OUT and -5 Runs Deducted");
            inn.isSuperBallActive = false;
            inn.superBallUsed = true;
          } else {
            triggerBroadcast("wicket", "WICKET FALLS", `${striker.name} ${striker.dismissal}`);
          }
        }

        inn.isFreeHit = false;

        if (inn.wickets < (match.playingXI[inn.battingTeam].length - 1)) {
          openNextBatsmanModal();
        }
      }
      // 4. REGULAR DELIVERY
      else {
        striker.balls += 1;
        inn.balls += 1;
        bowler.balls += 1;

        let scored = runs;
        if (isSuperBallDelivery) {
          scored = runs * 2;
          label = `SB-${scored}`;
          inn.isSuperBallActive = false;
          inn.superBallUsed = true;

          if (scored > 0) {
            triggerBroadcast("superball", "SUPER BALL SCORED", `+${scored} Runs (Doubled)`);
          } else {
            triggerBroadcast("superball", "SUPER BALL DOT", "0 Runs");
          }
        } else {
          label = `${runs}`;
          if (runs === 4) {
            striker.fours += 1;
            triggerBroadcast("four", "FOUR RUNS", "Boundary to the Ropes");
          } else if (runs === 6) {
            striker.sixes += 1;
            triggerBroadcast("six", "MAXIMUM SIX", "Clean Tape-Ball Strike");
          }
        }

        striker.runs += scored;
        inn.runs += scored;
        bowler.runs += scored;

        inn.isFreeHit = false;

        if (runs % 2 !== 0) {
          const temp = inn.striker;
          inn.striker = inn.nonStriker;
          inn.nonStriker = temp;
        }
      }

      inn.timeline.push({
        label,
        runs,
        isSuperBall: isSuperBallDelivery,
        isWicket,
        isWide,
        isNoBall
      });

      checkOverAndMatchStatus();
      syncData();
      refreshCurrentView();
    }

    function triggerSuperBallCall() {
      if (!isAdmin) return;
      const match = AppState.liveMatch;
      if (!match) return;
      const inn = match.currentInnings === 1 ? match.innings1 : match.innings2;

      const currentOverNumber = Math.floor(inn.balls / 6) + 1;
      if (currentOverNumber < 2 || currentOverNumber > 7) {
        showToast("Super Ball is only allowed between Overs 2 and 7!");
        return;
      }
      if (inn.superBallUsed) {
        showToast("Super Ball already used in this innings!");
        return;
      }

      inn.isSuperBallActive = true;
      SoundFX.playSuperBallSiren();
      triggerBroadcast("superball", "SUPER BALL ACTIVATED", "2X Runs • Wicket = -5 Runs");
      syncData();
      refreshCurrentView();
    }

    function swapStrikeManual() {
      if (!isAdmin) return;
      const match = AppState.liveMatch;
      if (!match) return;
      const inn = match.currentInnings === 1 ? match.innings1 : match.innings2;

      const temp = inn.striker;
      inn.striker = inn.nonStriker;
      inn.nonStriker = temp;

      showToast(`Strike rotated: ${inn.striker} is now on strike`);
      syncData();
      refreshCurrentView();
    }

    function undoLastDelivery() {
      if (!isAdmin) return;
      const match = AppState.liveMatch;
      if (!match) return;
      const inn = match.currentInnings === 1 ? match.innings1 : match.innings2;

      if (!inn.history || inn.history.length === 0) {
        showToast("No more deliveries to undo!");
        return;
      }

      const lastState = inn.history.pop();
      if (match.currentInnings === 1) {
        match.innings1 = { ...lastState.innings, history: inn.history };
      } else {
        match.innings2 = { ...lastState.innings, history: inn.history };
      }

      showToast("Delivery undone!");
      syncData();
      refreshCurrentView();
    }

    function checkOverAndMatchStatus() {
      const match = AppState.liveMatch;
      if (!match) return;
      const inn = match.currentInnings === 1 ? match.innings1 : match.innings2;
      const maxBalls = match.totalOvers * 6;
      const totalWickets = match.playingXI[inn.battingTeam].length - 1;

      if (match.currentInnings === 2) {
        const target = match.innings1.runs + 1;
        if (inn.runs >= target) {
          finalizeMatch(match);
          return;
        }
      }

      if (inn.balls >= maxBalls || inn.wickets >= totalWickets) {
        if (match.currentInnings === 1) {
          startSecondInnings(match);
        } else {
          finalizeMatch(match);
        }
        return;
      }

      if (inn.balls > 0 && inn.balls % 6 === 0 && inn.timeline[inn.timeline.length - 1].isWide === false && inn.timeline[inn.timeline.length - 1].isNoBall === false) {
        const temp = inn.striker;
        inn.striker = inn.nonStriker;
        inn.nonStriker = temp;

        openNextBowlerModal();
      }
    }

      const modal = document.getElementById('modalContainer');

        batsmen: {
          [striker]: { name: striker, runs: 0, balls: 0, fours: 0, sixes: 0, isOut: false },
          [nonStriker]: { name: nonStriker, runs: 0, balls: 0, fours: 0, sixes: 0, isOut: false }
        },

    function finalizeMatch(match) {
      match.status = 'completed';
      const inn1 = match.innings1;
      const inn2 = match.innings2;

      let winner = null;
      let summary = "";

      if (inn2.runs > inn1.runs) {
        winner = inn2.battingTeam;
        const wicketsRemaining = (match.playingXI[inn2.battingTeam].length - 1) - inn2.wickets;
        summary = `${AppState.teams[winner]?.name} won by ${wicketsRemaining} wickets`;
      } else if (inn1.runs > inn2.runs) {
        winner = inn1.battingTeam;
        const margin = inn1.runs - inn2.runs;
        summary = `${AppState.teams[winner]?.name} won by ${margin} runs`;
      } else {
        summary = "Match Tied";
      }

      match.result = { winner, summary };

      const fixture = AppState.fixtures.find(f => f.id === match.fixtureId);
      if (fixture) {
        fixture.status = 'completed';
        fixture.result = summary;
        fixture.scorecard = match;
      }

      if (match.fixtureId < 6) {
        const nextFix = AppState.fixtures.find(f => f.id === match.fixtureId + 1);
        if (nextFix) nextFix.status = 'unlocked';
      } else if (match.fixtureId === 6) {
        seedPlayoffs();
      } else if (match.fixtureId === 7) {
        seedGrandFinal(winner);
      }

      updatePlayerCareerStats(match);

      confetti({ particleCount: 80, spread: 60, origin: { y: 0.6 } });
      AppState.liveMatch = null;
      syncData();
      navigateTo('results');
    }

    function seedPlayoffs() {
      const standings = calculateStandings();
      if (standings.length >= 3) {
        const second = standings[1].teamId;
        const third = standings[2].teamId;
        const playoffFix = AppState.fixtures.find(f => f.id === 7);
        if (playoffFix) {
          playoffFix.teamA = second;
          playoffFix.teamB = third;
          playoffFix.status = 'unlocked';
          showToast(`Playoff Match: ${second} vs ${third}`);
        }
      }
    }

    function seedGrandFinal(playoffWinner) {
      const standings = calculateStandings();
      if (standings.length >= 1) {
        const first = standings[0].teamId;
        const finalFix = AppState.fixtures.find(f => f.id === 8);
        if (finalFix) {
          finalFix.teamA = first;
          finalFix.teamB = playoffWinner;
          finalFix.status = 'unlocked';
          showToast(`Grand Final: ${first} vs ${playoffWinner}`);
        }
      }
    }

    function updatePlayerCareerStats(match) {
      [match.innings1, match.innings2].forEach(inn => {
        if (!inn) return;
        Object.values(inn.batsmen).forEach(b => {
          let p = AppState.playerStats[b.name];
          if (!p) {
            p = AppState.playerStats[b.name] = {
              name: b.name, team: inn.battingTeam, matches: 0, innings: 0, runs: 0, balls: 0, fours: 0, sixes: 0, highScore: 0, notOuts: 0, legalBallsBowled: 0, runsConceded: 0, wickets: 0, maidens: 0
            };
          }
          p.matches += 1;
          p.innings += 1;
          p.runs += b.runs;
          p.balls += b.balls;
          p.fours += b.fours;
          p.sixes += b.sixes;
          if (b.runs > p.highScore) p.highScore = b.runs;
          if (!b.isOut) p.notOuts += 1;
        });

        Object.values(inn.bowlers).forEach(bw => {
          let p = AppState.playerStats[bw.name];
          if (!p) {
            p = AppState.playerStats[bw.name] = {
              name: bw.name, team: inn.bowlingTeam, matches: 0, innings: 0, runs: 0, balls: 0, fours: 0, sixes: 0, highScore: 0, notOuts: 0, legalBallsBowled: 0, runsConceded: 0, wickets: 0, maidens: 0
            };
          }
          p.legalBallsBowled += bw.balls;
          p.runsConceded += bw.runs;
          p.wickets += bw.wickets;
          p.maidens += (bw.maidens || 0);
        });
      });
    }

    /**
     * IN-GAME MODALS: STRICT PLAYING 11 & 3D TOSS
     */
    let matchSetupState = { fixtureId: null, teamA: null, teamB: null, playingXI: {}, tossWinner: null, tossDecision: null };

    function launchMatchSetup(fixId) {
      if (!isAdmin) return;
      if (AppState.liveMatch && AppState.liveMatch.fixtureId === fixId) {
        navigateTo('live');
        return;
      }

      const fix = AppState.fixtures.find(f => f.id === fixId);
      if (!fix || !fix.teamA || !fix.teamB) {
        showToast("Teams for this match are not seeded yet!");
        return;
      }

      matchSetupState = {
        fixtureId: fixId,
        teamA: fix.teamA,
        teamB: fix.teamB,
        playingXI: {
          [fix.teamA]: AppState.teams[fix.teamA].squad.slice(0, 11),
          [fix.teamB]: AppState.teams[fix.teamB].squad.slice(0, 11)
        },
        tossWinner: null,
        tossDecision: null
      };

      openPlayingXIModal();
    }

    function togglePlayerSelection(teamId, player) {
      const currentList = matchSetupState.playingXI[teamId];
      const index = currentList.indexOf(player);

      if (index > -1) {
        currentList.splice(index, 1);
      } else {
        if (currentList.length >= 11) {
          showToast(`Limit reached: 11 players maximum!`);
          openPlayingXIModal();
          return;
        }
        currentList.push(player);
      }

      const counter = document.getElementById(`counter-${teamId}`);
      if (counter) counter.innerText = `${currentList.length} / 11`;
    }

    function confirmPlaying11AndProceed() {
      const teamA = matchSetupState.teamA;
      const teamB = matchSetupState.teamB;

      if (matchSetupState.playingXI[teamA].length !== 11) {
        showToast(`Select exactly 11 players for ${teamA}! (Currently ${matchSetupState.playingXI[teamA].length})`);
        return;
      }
      if (matchSetupState.playingXI[teamB].length !== 11) {
        showToast(`Select exactly 11 players for ${teamB}! (Currently ${matchSetupState.playingXI[teamB].length})`);
        return;
      }

      open3DTossModal();
    }

      const teamB = matchSetupState.teamB;

      modal.innerHTML = `

          </div>
        </div>
      `;

    let isFlipping = false;
    function flipCoin(teamA, teamB) {
      if (isFlipping) return;
      isFlipping = true;

      const coin = document.getElementById('coin3D');
      const winner = Math.random() < 0.5 ? teamA : teamB;
      matchSetupState.tossWinner = winner;

      const rotations = 5 * 360 + (winner === teamB ? 180 : 0);
      coin.style.transform = `rotateY(${rotations}deg)`;

      setTimeout(() => {
        isFlipping = false;
        document.getElementById('tossResultText').innerText = `${AppState.teams[winner]?.name} Won The Toss`;
        document.getElementById('tossResultBanner').classList.remove('hidden');
      }, 3100);
    }

    function setTossDecision(decision) {
      matchSetupState.tossDecision = decision;
      openOpenersPickerModal();
    }

    function openOpenersPickerModal() {
      const modal = document.getElementById('modalContainer');
      const tossWinner = matchSetupState.tossWinner;
      const otherTeam = tossWinner === matchSetupState.teamA ? matchSetupState.teamB : matchSetupState.teamA;

      const batTeam = matchSetupState.tossDecision === 'BAT' ? tossWinner : otherTeam;
      const bowlTeam = batTeam === matchSetupState.teamA ? matchSetupState.teamB : matchSetupState.teamA;

      const batSquad = matchSetupState.playingXI[batTeam];
      const bowlSquad = matchSetupState.playingXI[bowlTeam];

      modal.innerHTML = `

            Start 8-Over Match &rarr;

    function startMatchOfficially(batTeam, bowlTeam) {
      const striker = document.getElementById('strikerSelect').value;
      const nonStriker = document.getElementById('nonStrikerSelect').value;

      AppState.liveMatch = {
        fixtureId: matchSetupState.fixtureId,
        teamA: matchSetupState.teamA,

        totalOvers: 8,
        status: 'live',

          timeline: [],

        innings2: null

      closeModal();
      showToast("Match is officially LIVE!");
      triggerBroadcast("normal", "MATCH STARTED", `${batTeam} vs ${bowlTeam}`);

        .map(p => ({
          ...p,
          sr: p.balls > 0 ? ((p.runs / p.balls) * 100).toFixed(1) : "0.0"

        AppState.playerStats[name] = {
          name, team: teamId, matches: 0, innings: 0, runs: 0, balls: 0, fours: 0, sixes: 0, highScore: 0, notOuts: 0, legalBallsBowled: 0, runsConceded: 0, wickets: 0, maidens: 0

      isAdmin = false;

      refreshCurrentView();

    function exportBackupJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(AppState, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `NSL_S2_BACKUP_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importBackupJSON(e) {
      if (!isAdmin) return;
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const imported = JSON.parse(evt.target.result);
          if (imported.teams && imported.fixtures) {
            AppState = imported;
            syncData();
            showToast("Database restored successfully!");
            refreshCurrentView();
          }
        } catch (err) {
          showToast("Invalid JSON file!");
        }
      };
      reader.readAsText(file);
    }

    /**

     */
    function calculateStandings() {
      const stats = {};
      Object.keys(AppState.teams).forEach(code => {
        stats[code] = {
          teamId: code,
          played: 0,
          won: 0,
          lost: 0,
          pts: 0,
          runsFor: 0,
          oversFor: 0,
          runsAgainst: 0,
          oversAgainst: 0,
          nrr: 0
        };
      });

      AppState.fixtures.forEach(f => {
        if (f.status === 'completed' && f.scorecard && f.type === 'GROUP') {
          const inn1 = f.scorecard.innings1;
          const inn2 = f.scorecard.innings2;
          if (!inn1 || !inn2) return;

          const team1 = inn1.battingTeam;
          const team2 = inn2.battingTeam;
          if (!stats[team1] || !stats[team2]) return;

          stats[team1].played += 1;
          stats[team2].played += 1;

          if (f.scorecard.result && f.scorecard.result.winner) {
            if (f.scorecard.result.winner === team1) {
              stats[team1].won += 1;
              stats[team1].pts += 2;
              stats[team2].lost += 1;
            } else if (f.scorecard.result.winner === team2) {
              stats[team2].won += 1;
              stats[team2].pts += 2;
              stats[team1].lost += 1;
            }
          }

          stats[team1].runsFor += inn1.runs;
          stats[team1].oversFor += inn1.balls / 6;
          stats[team1].runsAgainst += inn2.runs;
          stats[team1].oversAgainst += inn2.balls / 6;

          stats[team2].runsFor += inn2.runs;
          stats[team2].oversFor += inn2.balls / 6;
          stats[team2].runsAgainst += inn1.runs;
          stats[team2].oversAgainst += inn1.balls / 6;
        }
      });

      return Object.values(stats).map(t => {
        const forRR = t.oversFor > 0 ? (t.runsFor / t.oversFor) : 0;
        const againstRR = t.oversAgainst > 0 ? (t.runsAgainst / t.oversAgainst) : 0;
        t.nrr = forRR - againstRR;
        return t;
      }).sort((a, b) => b.pts - a.pts || b.nrr - a.nrr);
    }

    /**
     * MODAL & UI UTILITIES
     */
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const text = document.getElementById('toastMsg');
      if (!toast || !text) return;
      text.innerText = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
        toast.classList.remove('opacity-100');
      }, 2500);
    }

    function closeModal() {
      const modal = document.getElementById('modalContainer');
      if (modal) {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        modal.innerHTML = '';
      }
    }

    function openPlayerCardModal(playerName) {
      const p = AppState.playerStats[playerName] || {
        name: playerName,
        team: 'NSL',
        matches: 0,
        runs: 0,
        balls: 0,
        fours: 0,
        sixes: 0,
        highScore: 0,
        legalBallsBowled: 0,
        runsConceded: 0,
        wickets: 0
      };

      const strikeRate = p.balls > 0 ? ((p.runs / p.balls) * 100).toFixed(1) : "0.0";
      const econ = p.legalBallsBowled > 0 ? ((p.runsConceded / p.legalBallsBowled) * 6).toFixed(1) : "0.0";
      const oversBowled = `${Math.floor((p.legalBallsBowled || 0) / 6)}.${(p.legalBallsBowled || 0) % 6}`;

      const modal = document.getElementById('modalContainer');
      modal.innerHTML = `
        <div class="bg-[#0F172A] border border-amber-500/50 rounded-3xl p-5 max-w-xs w-full space-y-4 shadow-2xl text-center">
          <div>
            ${renderTeamLogo(p.team, "w-12 h-12 mx-auto mb-2")}
            <h3 class="text-base font-black text-white uppercase">${p.name}</h3>
            <span class="text-xs text-amber-400 font-bold">${AppState.teams[p.team]?.name || p.team}</span>
          </div>

          <div class="grid grid-cols-2 gap-2 text-left text-xs bg-slate-900/80 p-3 rounded-2xl border border-slate-800">
            <div><span class="text-slate-400 text-[10px] block font-bold">Matches</span><span class="text-white font-mono font-bold">${p.matches}</span></div>
            <div><span class="text-slate-400 text-[10px] block font-bold">Runs</span><span class="text-amber-400 font-mono font-bold">${p.runs}</span></div>
            <div><span class="text-slate-400 text-[10px] block font-bold">Strike Rate</span><span class="text-slate-300 font-mono font-bold">${strikeRate}</span></div>
            <div><span class="text-slate-400 text-[10px] block font-bold">Boundaries</span><span class="text-slate-300 font-mono font-bold">${p.fours}x4 • ${p.sixes}x6</span></div>
            <div><span class="text-slate-400 text-[10px] block font-bold">Wickets</span><span class="text-emerald-400 font-mono font-bold">${p.wickets}</span></div>
            <div><span class="text-slate-400 text-[10px] block font-bold">Economy</span><span class="text-slate-300 font-mono font-bold">${econ} (${oversBowled} ov)</span></div>
          </div>

          <button onclick="closeModal()" class="w-full py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold hover:bg-slate-700 touch-target">
            Close
          </button>
        </div>
      `;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function shareScorecardWhatsApp(fixtureId) {
      const fix = AppState.fixtures.find(f => f.id === fixtureId);
      if (!fix || !fix.scorecard) return;
      const sc = fix.scorecard;
      const inn1 = sc.innings1;
      const inn2 = sc.innings2;

      let msg = `*NAWAB SUPER LEAGUE S2*\n`;
      msg += `*${fix.name} (${fix.type})*\n`;
      msg += `Result: ${fix.result}\n\n`;
      msg += `*1st Innings: ${inn1.battingTeam}* - ${inn1.runs}/${inn1.wickets} (${Math.floor(inn1.balls/6)}.${inn1.balls%6} ov)\n`;
      Object.values(inn1.batsmen).forEach(b => {
        if (b.balls > 0 || b.runs > 0) {
          msg += `• ${b.name}: ${b.runs} (${b.balls}b, ${b.fours}x4, ${b.sixes}x6)\n`;
        }
      });
      msg += `\n*2nd Innings: ${inn2.battingTeam}* - ${inn2.runs}/${inn2.wickets} (${Math.floor(inn2.balls/6)}.${inn2.balls%6} ov)\n`;
      Object.values(inn2.batsmen).forEach(b => {
        if (b.balls > 0 || b.runs > 0) {
          msg += `• ${b.name}: ${b.runs} (${b.balls}b, ${b.fours}x4, ${b.sixes}x6)\n`;
        }
      });
      msg += `\nFollow Live Scores on NSL S2 Web App!`;

      const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`;
      window.open(url, '_blank');
    }

    /**
     * INITIALIZATION
     */
    let isAppInitialized = false;
    function initApp() {
      if (isAppInitialized) return;
      isAppInitialized = true;
      try {
        loadState();
        const badge = document.getElementById('nav-league-badge');
        if (badge) badge.innerHTML = renderLeagueLogo("w-8 h-8");
        navigateTo('home');
      } catch (err) {
        console.error("Fatal initialization error:", err);
        const container = document.getElementById('appContent');
        if (container) {
          container.innerHTML = `
            <div class="p-6 text-center text-slate-300">
              <div class="text-rose-400 font-bold text-lg mb-2">Notice</div>
              <p class="text-xs text-slate-400 mb-4">Tap below to initialize tournament data.</p>
              <button onclick="localStorage.clear(); location.reload();" class="px-4 py-2 bg-amber-500 text-slate-950 font-bold rounded-lg text-sm">
                Refresh & Load NSL S2
              </button>
            </div>
          `;
        }
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initApp);
    } else {
      initApp();
    }
    window.addEventListener('load', initApp);
  </script>
</body>
</html>
