<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NSL S2 - Nawab Super League Season 2</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              gold: '#f59e0b',
              dark: '#0b0f19',
              card: '#131b2e',
              border: '#1f293d'
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #080c14;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .custom-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 0.4; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .live-pulse {
      animation: pulse-ring 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-[#080c14] min-h-screen text-slate-100 flex justify-center selection:bg-amber-500 selection:text-black">

  <!-- Main Container -->
  <div class="w-full max-w-md min-h-screen flex flex-col relative bg-[#0b0f19] shadow-2xl border-x border-slate-900/50">

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-[#0e1424]/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3 cursor-pointer" onclick="navigateTo('home')">
        <div id="league-logo-container" class="w-10 h-10 rounded-full bg-amber-500/10 flex items-center justify-center border border-amber-500/20 overflow-hidden shadow-inner">
          <img src="nsl_s2_logo.png" alt="NSL" class="w-full h-full object-contain" onerror="this.onerror=null; this.parentElement.innerHTML='<span class=\'font-black text-amber-500 text-xs\'>NSL</span>';" />
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-sm font-black tracking-wider uppercase text-white">Nawab Super League</h1>
            <span class="text-[10px] bg-amber-500/20 text-amber-400 font-extrabold px-1.5 py-0.2 rounded border border-amber-500/30">S2</span>
          </div>
          <p class="text-[10px] font-semibold text-slate-400">Season 2 Official Match Center</p>
        </div>
      </div>

      <!-- Scorer / Spectator Badge -->
      <div class="flex items-center gap-2">
        <div id="live-indicator" class="hidden items-center gap-1.5 bg-red-500/10 border border-red-500/30 px-2 py-0.5 rounded-full">
          <span class="w-2 h-2 rounded-full bg-red-500 live-pulse"></span>
          <span class="text-[10px] font-extrabold text-red-400 tracking-wider">LIVE</span>
        </div>
        <button id="auth-badge" onclick="handleAuthToggle()" class="px-2.5 py-1 rounded-full text-[11px] font-bold tracking-wide transition border bg-slate-800 text-slate-300 border-slate-700">
          Spectator
        </button>
      </div>
    </header>

    <!-- App Content Viewport -->
    <main id="app-content" class="flex-1 p-4 pb-24 overflow-y-auto custom-scrollbar">
      <!-- Dynamic Views Render Here -->
    </main>

    <!-- Bottom Navigation Bar (4 Menus Only) -->
    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-[#0b0f19]/95 backdrop-blur-lg border-t border-slate-800 px-6 py-2 flex items-center justify-between z-40">
      <button onclick="navigateTo('home')" id="nav-btn-home" class="flex flex-col items-center gap-1 py-1 text-amber-400 transition">
        <i data-lucide="home" class="w-5 h-5"></i>
        <span class="text-[10px] font-bold">Home</span>
      </button>
      <button onclick="navigateTo('points')" id="nav-btn-points" class="flex flex-col items-center gap-1 py-1 text-slate-400 hover:text-slate-200 transition">
        <i data-lucide="table" class="w-5 h-5"></i>
        <span class="text-[10px] font-bold">Points</span>
      </button>
      <button onclick="navigateTo('leaderboard')" id="nav-btn-leaderboard" class="flex flex-col items-center gap-1 py-1 text-slate-400 hover:text-slate-200 transition">
        <i data-lucide="award" class="w-5 h-5"></i>
        <span class="text-[10px] font-bold">Leaderboard</span>
      </button>
      <button onclick="navigateTo('admin')" id="nav-btn-admin" class="flex flex-col items-center gap-1 py-1 text-slate-400 hover:text-slate-200 transition">
        <i data-lucide="shield-check" class="w-5 h-5"></i>
        <span class="text-[10px] font-bold">Admin</span>
      </button>
    </nav>

    <!-- Modal Container -->
    <div id="modal-container" class="hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/80 backdrop-blur-sm">
      <div id="modal-content" class="w-full max-w-md bg-[#111827] border-t sm:border border-slate-800 rounded-t-3xl sm:rounded-2xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto custom-scrollbar">
        <!-- In-Game Modals Injected Dynamically -->
      </div>
    </div>

    <!-- Spectator Fullscreen Event Overlay Banner -->
    <div id="event-overlay" class="hidden fixed inset-0 z-50 pointer-events-none flex items-center justify-center bg-black/60 backdrop-blur-sm transition-opacity duration-300">
      <div id="event-overlay-box" class="transform scale-90 transition-transform duration-300 p-6 rounded-3xl text-center border shadow-2xl max-w-xs mx-4">
        <h2 id="event-overlay-title" class="text-3xl font-black italic tracking-wider drop-shadow-md"></h2>
        <p id="event-overlay-desc" class="text-sm font-bold text-white mt-1"></p>
      </div>
    </div>

  </div>

  <!-- Firebase Scripts (Loaded with defer so they NEVER block initial HTML rendering) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <script>
    // --- 1. DEFAULT DATA DEFINITIONS ---
    const DEFAULT_TEAMS = {
      KTG: { name: "Khan Tigers", code: "KTG", logo: "KTG.png", captain: "Kashif", players: ["Kashif", "Shahbaz", "Imtiaz Khan", "Zeeshan", "Farhan", "Shahzad", "Azhar", "Saqib Ghafoor", "Adeel", "Jugni", "Saddam"] },
      ASK: { name: "Arslan Aslam Super Kings", code: "ASK", logo: "ASK.png", captain: "Arslan", players: ["Arslan", "Aslam", "Zohaib", "Faheem", "Ghayoor", "Rehan", "Nabeel", "Hamza", "Tariq", "Waseem", "Babar"] },
      NKG: { name: "Nawab Kings", code: "NKG", logo: "NKG.png", captain: "Usman", players: ["Usman", "Bilal", "Rashid", "Khurram", "Awais", "Salman", "Irfan", "Haider", "Nouman", "Yasir", "Danish"] },
      ALW: { name: "Ali Waly", code: "ALW", logo: "ALW.png", captain: "Ali Raza", players: ["Ali Raza", "Zubair", "Mohsin", "Fahad", "Umair", "Kashif Jr", "Talha", "Ahsan", "Waqas", "Shahid", "Muneeb"] }
    };

    const DEFAULT_FIXTURES = [
      { id: "M1", matchNo: 1, title: "Match 1", teamA: "KTG", teamB: "ASK", overs: 8, status: "scheduled", result: null },
      { id: "M2", matchNo: 2, title: "Match 2", teamA: "NKG", teamB: "ALW", overs: 8, status: "scheduled", result: null },
      { id: "M3", matchNo: 3, title: "Match 3", teamA: "KTG", teamB: "NKG", overs: 8, status: "scheduled", result: null },
      { id: "M4", matchNo: 4, title: "Match 4", teamA: "ASK", teamB: "ALW", overs: 8, status: "scheduled", result: null },
      { id: "M5", matchNo: 5, title: "Match 5", teamA: "KTG", teamB: "ALW", overs: 8, status: "scheduled", result: null },
      { id: "M6", matchNo: 6, title: "Match 6", teamA: "ASK", teamB: "NKG", overs: 8, status: "scheduled", result: null },
      { id: "M7", matchNo: 7, title: "Qualifier (2nd vs 3rd)", teamA: "TBD", teamB: "TBD", overs: 8, status: "scheduled", result: null },
      { id: "M8", matchNo: 8, title: "Grand Final", teamA: "TBD", teamB: "TBD", overs: 8, status: "scheduled", result: null }
    ];

    const DEFAULT_RULES = `1. All group and playoff matches are strictly 8 overs per side.
2. Max 2.0 overs per bowler. No consecutive overs allowed.
3. No Byes and No Leg-Byes. Runs must come off the bat.
4. Wide = 1 Run. No-Ball = 1 Run + Free Hit.
5. Super Ball: Can be called once per innings between overs 2 and 7. Doubles runs scored off the bat; -5 runs penalty if out. Persists through wides/no-balls.
6. Admin PIN 2443 required for official scoring and player registration.`;

    // --- 2. GLOBAL STATE ---
    let appState = {
      isAdmin: false,
      currentView: 'home',
      activeMatchId: null,
      teams: DEFAULT_TEAMS,
      fixtures: DEFAULT_FIXTURES,
      rules: DEFAULT_RULES,
      activeMatch: null, // Holds the live scoring match engine object
      undoStack: []
    };

    const ADMIN_PIN = "2443";
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyCBsKqu-4WWbKo-qN7lRo5-nak-anFwiC8",
      authDomain: "nsl-s2.firebaseapp.com",
      projectId: "nsl-s2",
      storageBucket: "nsl-s2.firebasestorage.app",
      messagingSenderId: "751866095822",
      appId: "1:751866095822:web:4fab1aeb6dc0419800089f"
    };

    let db = null;

    // --- 3. WEB AUDIO SYNTHESIZER ---
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
      },
      play(type) {
        try {
          this.init();
          if (!this.ctx) return;
          const ctx = this.ctx;
          const now = ctx.currentTime;

          if (type === 'superball') {
            // Dual-tone siren
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.linearRampToValueAtTime(880, now + 0.3);
            osc.frequency.linearRampToValueAtTime(440, now + 0.6);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.8);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.8);
          } else if (type === 'boundary4') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.4);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.5);
          } else if (type === 'boundary6') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.6);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.7);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.7);
          } else if (type === 'wicket') {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(250, now);
            osc.frequency.linearRampToValueAtTime(90, now + 0.5);
            gain.gain.setValueAtTime(0.35, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.5);
          }
        } catch (e) {
          console.warn('Audio play restricted by browser policy', e);
        }
      }
    };

    // --- 4. PERSISTENCE & CLOUD SYNC ---
    function loadSavedState() {
      try {
        const local = localStorage.getItem('nsl_s2_state_v3');
        if (local) {
          const parsed = JSON.parse(local);
          appState.teams = parsed.teams || DEFAULT_TEAMS;
          appState.fixtures = parsed.fixtures || DEFAULT_FIXTURES;
          appState.rules = parsed.rules || DEFAULT_RULES;
          appState.activeMatch = parsed.activeMatch || null;
        }
        appState.isAdmin = localStorage.getItem('nsl_s2_admin_logged') === 'true';
      } catch (e) {
        console.error('Local state load error:', e);
      }
    }

    function saveState(triggerCloud = true) {
      try {
        const payload = {
          teams: appState.teams,
          fixtures: appState.fixtures,
          rules: appState.rules,
          activeMatch: appState.activeMatch,
          updatedAt: Date.now()
        };
        localStorage.setItem('nsl_s2_state_v3', JSON.stringify(payload));

        if (triggerCloud && db && appState.isAdmin) {
          db.collection('nsl_tournament').doc('s2_state').set(payload)
            .catch(err => console.error('Cloud write failed:', err));
        }
      } catch (e) {
        console.error('Save state failed:', e);
      }
    }

    function initFirebaseSync() {
      try {
        if (!window.firebase || !firebase.initializeApp) return;
        if (!firebase.apps.length) {
          firebase.initializeApp(FIREBASE_CONFIG);
        }
        db = firebase.firestore();

        // Real-time instant spectator listener
        db.collection('nsl_tournament').doc('s2_state').onSnapshot(doc => {
          if (doc.exists) {
            const data = doc.data();
            if (data.updatedAt) {
              appState.teams = data.teams || appState.teams;
              appState.fixtures = data.fixtures || appState.fixtures;
              appState.rules = data.rules || appState.rules;
              appState.activeMatch = data.activeMatch || null;
              saveState(false);
              renderApp();
            }
          }
        }, err => console.warn('Firestore spectator sync notice:', err));
      } catch (err) {
        console.warn('Firebase init bypassed:', err);
      }
    }

    // --- 5. LOGO RENDER HELPER ---
    function renderTeamLogo(code, sizeClass = "w-10 h-10") {
      const team = appState.teams[code] || { name: code, logo: `${code}.png` };
      return `
        <div class="relative ${sizeClass} rounded-full bg-slate-800 flex items-center justify-center overflow-hidden border border-slate-700 shrink-0 shadow">
          <img src="${team.logo}" alt="${code}" class="w-full h-full object-contain" 
            onerror="this.onerror=null; this.outerHTML='<span class=\\'font-black text-amber-400 text-xs tracking-wider\\'>${code}</span>';" />
        </div>
      `;
    }

    // --- 6. NAVIGATION & ROUTING ---
    function navigateTo(view, matchId = null) {
      appState.currentView = view;
      if (matchId) appState.activeMatchId = matchId;
      renderApp();
      window.scrollTo(0, 0);
    }

    function updateNavUI() {
      const tabs = ['home', 'points', 'leaderboard', 'admin'];
      tabs.forEach(t => {
        const btn = document.getElementById(`nav-btn-${t}`);
        if (!btn) return;
        if (appState.currentView === t) {
          btn.className = "flex flex-col items-center gap-1 py-1 text-amber-400 font-bold transition";
        } else {
          btn.className = "flex flex-col items-center gap-1 py-1 text-slate-400 hover:text-slate-200 transition";
        }
      });

      // Update Live Indicator in header
      const liveBadge = document.getElementById('live-indicator');
      if (liveBadge) {
        if (appState.activeMatch && appState.activeMatch.status === 'live') {
          liveBadge.classList.remove('hidden');
          liveBadge.classList.add('flex');
        } else {
          liveBadge.classList.add('hidden');
          liveBadge.classList.remove('flex');
        }
      }

      // Update Auth Badge
      const authBadge = document.getElementById('auth-badge');
      if (authBadge) {
        if (appState.isAdmin) {
          authBadge.innerText = 'Scorer';
          authBadge.className = 'px-2.5 py-1 rounded-full text-[11px] font-black tracking-wide transition border bg-amber-500/20 text-amber-400 border-amber-500/40 shadow-sm';
        } else {
          authBadge.innerText = 'Spectator';
          authBadge.className = 'px-2.5 py-1 rounded-full text-[11px] font-bold tracking-wide transition border bg-slate-800 text-slate-400 border-slate-700';
        }
      }
    }

    function handleAuthToggle() {
      if (appState.isAdmin) {
        if (confirm('Switch to Spectator mode? (Scoring controls will be hidden)')) {
          appState.isAdmin = false;
          localStorage.removeItem('nsl_s2_admin_logged');
          renderApp();
        }
      } else {
        const input = prompt('Enter 4-Digit Scorer PIN:');
        if (input === ADMIN_PIN) {
          appState.isAdmin = true;
          localStorage.setItem('nsl_s2_admin_logged', 'true');
          renderApp();
        } else if (input !== null) {
          alert('Incorrect PIN!');
        }
      }
    }

    // --- 7. VIEW RENDERERS ---

    // HOME SCREEN
    function renderHomeScreen() {
      const active = appState.activeMatch;
      const upcoming = appState.fixtures.find(f => f.status === 'scheduled');

      let liveCardHtml = '';
      if (active && active.status === 'live') {
        const inn = active.currentInnings === 1 ? active.innings1 : active.innings2;
        const batTeam = inn.battingTeam;
        const bowlTeam = inn.bowlingTeam;
        const crr = (inn.legalBalls > 0) ? ((inn.runs / inn.legalBalls) * 6).toFixed(2) : "0.00";

        liveCardHtml = `
          <div onclick="navigateTo('live')" class="bg-gradient-to-br from-amber-500/10 via-slate-900 to-slate-900 border border-amber-500/40 rounded-3xl p-4 shadow-xl cursor-pointer relative overflow-hidden mb-5">
            <div class="flex items-center justify-between mb-3">
              <span class="flex items-center gap-1.5 text-[11px] font-extrabold text-red-400 uppercase tracking-wider">
                <span class="w-2 h-2 rounded-full bg-red-500 live-pulse"></span>
                Match Running Now
              </span>
              <span class="text-xs font-bold text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded-full border border-amber-500/30">
                ${active.title || 'NSL Live'}
              </span>
            </div>

            <div class="flex items-center justify-between mb-3">
              <div class="flex items-center gap-3">
                ${renderTeamLogo(batTeam, 'w-12 h-12')}
                <div>
                  <h3 class="text-base font-black text-white">${appState.teams[batTeam].name}</h3>
                  <p class="text-xs text-slate-400">Batting • Innings ${active.currentInnings}</p>
                </div>
              </div>
              <div class="text-right">
                <div class="text-2xl font-black text-amber-400 tracking-tight">${inn.runs}/${inn.wickets}</div>
                <div class="text-xs font-semibold text-slate-400">${Math.floor(inn.legalBalls / 6)}.${inn.legalBalls % 6} / ${active.overs} ov</div>
              </div>
            </div>

            <div class="pt-2 border-t border-slate-800/80 flex items-center justify-between text-xs text-slate-400">
              <span>CRR: <strong class="text-white">${crr}</strong></span>
              <span class="text-amber-400 font-bold flex items-center gap-1">Open Match Center <i data-lucide="chevron-right" class="w-4 h-4"></i></span>
            </div>
          </div>
        `;
      } else if (upcoming) {
        liveCardHtml = `
          <div class="bg-slate-900/80 border border-slate-800 rounded-3xl p-4 shadow-lg mb-5">
            <div class="flex items-center justify-between mb-2">
              <span class="text-[11px] font-bold text-amber-400 tracking-widest uppercase">Next Upcoming Match</span>
              <span class="text-[11px] text-slate-400 font-semibold">${upcoming.title}</span>
            </div>
            <div class="flex items-center justify-around py-3">
              <div class="flex flex-col items-center gap-1">
                ${renderTeamLogo(upcoming.teamA, 'w-12 h-12')}
                <span class="text-xs font-bold text-white mt-1">${upcoming.teamA}</span>
              </div>
              <div class="text-center font-black text-slate-600 text-sm tracking-widest">VS</div>
              <div class="flex flex-col items-center gap-1">
                ${renderTeamLogo(upcoming.teamB, 'w-12 h-12')}
                <span class="text-xs font-bold text-white mt-1">${upcoming.teamB}</span>
              </div>
            </div>
            ${appState.isAdmin ? `
              <button onclick="startMatchSetup('${upcoming.id}')" class="w-full mt-2 py-2.5 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black rounded-2xl text-xs uppercase tracking-wider transition shadow-lg">
                Setup & Start Match
              </button>
            ` : `
              <p class="text-center text-[11px] text-slate-500 font-medium">Waiting for match toss</p>
            `}
          </div>
        `;
      }

      return `
        <div class="space-y-4">
          <!-- Live / Upcoming Banner -->
          ${liveCardHtml}

          <!-- 5 Dedicated Menus -->
          <div class="grid grid-cols-2 gap-3">
            <!-- 1: Live Match Center -->
            <button onclick="navigateTo('live')" class="col-span-2 bg-[#121829] hover:bg-[#161f36] border border-slate-800 p-4 rounded-3xl flex items-center justify-between text-left transition shadow">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-red-500/10 border border-red-500/20 flex items-center justify-center text-red-400">
                  <i data-lucide="radio" class="w-5 h-5"></i>
                </div>
                <div>
                  <h4 class="text-sm font-extrabold text-white">Live Match Center</h4>
                  <p class="text-[11px] text-slate-400">Ball-by-ball, stats & live chase</p>
                </div>
              </div>
              <i data-lucide="chevron-right" class="w-5 h-5 text-slate-500"></i>
            </button>

            <!-- 2: Fixtures -->
            <button onclick="navigateTo('fixtures')" class="bg-[#121829] hover:bg-[#161f36] border border-slate-800 p-4 rounded-3xl flex flex-col justify-between text-left transition shadow">
              <div class="w-10 h-10 rounded-2xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400 mb-3">
                <i data-lucide="calendar" class="w-5 h-5"></i>
              </div>
              <div>
                <h4 class="text-sm font-extrabold text-white">Fixtures</h4>
                <p class="text-[10px] text-slate-400 mt-0.5">8 Matches Schedule</p>
              </div>
            </button>

            <!-- 3: Squads -->
            <button onclick="navigateTo('squads')" class="bg-[#121829] hover:bg-[#161f36] border border-slate-800 p-4 rounded-3xl flex flex-col justify-between text-left transition shadow">
              <div class="w-10 h-10 rounded-2xl bg-blue-500/10 border border-blue-500/20 flex items-center justify-center text-blue-400 mb-3">
                <i data-lucide="users" class="w-5 h-5"></i>
              </div>
              <div>

    function renderLiveScreen() {
      const match = appState.activeMatch;

      if (!match) {
        return `

            <div class="w-16 h-16 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center mx-auto text-slate-500">

            <button onclick="navigateTo('fixtures')" class="px-5 py-2.5 bg-amber-500 text-slate-950 font-bold rounded-2xl text-xs uppercase tracking-wider">
              View Fixtures
            </button>
          </div>
        `;
      }

      const inn = match.currentInnings === 1 ? match.innings1 : match.innings2;
      const batTeam = inn.battingTeam;
      const bowlTeam = inn.bowlingTeam;
      const crr = (inn.legalBalls > 0) ? ((inn.runs / inn.legalBalls) * 6).toFixed(2) : "0.00";

      // 2nd innings chase calculations
      let chaseBannerHtml = '';
      if (match.currentInnings === 2) {
        const target = match.innings1.runs + 1;
        const runsNeeded = target - inn.runs;
        const totalBalls = match.overs * 6;
        const ballsRemaining = Math.max(0, totalBalls - inn.legalBalls);
        const rrr = ballsRemaining > 0 ? ((runsNeeded / ballsRemaining) * 6).toFixed(2) : "0.00";

        chaseBannerHtml = `
          <div class="bg-amber-500/10 border border-amber-500/20 rounded-2xl px-3 py-2 flex items-center justify-between text-xs mb-4">
            <div>
              <span class="text-slate-400">Target:</span> <strong class="text-amber-400">${target}</strong>
              <span class="mx-1 text-slate-600">•</span>
              <span class="text-slate-300">Need <strong>${Math.max(0, runsNeeded)}</strong> in <strong>${ballsRemaining}b</strong></span>
            </div>
            <div>
              <span class="text-slate-400">RRR:</span> <strong class="text-amber-400">${rrr}</strong>
            </div>
          </div>
        `;
      }

      // Ball timeline
      const recentBalls = inn.timeline.slice(-6);
      const timelineHtml = recentBalls.length > 0 ? recentBalls.map(b => `
        <span class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-black shrink-0 ${
          b.isWicket ? 'bg-red-500 text-white' :
          b.isSuperBall ? 'bg-amber-400 text-black shadow-md scale-105' :
          b.runs === 6 ? 'bg-purple-600 text-white' :
          b.runs === 4 ? 'bg-blue-600 text-white' :
          b.runs === 0 ? 'bg-slate-800 text-slate-400' : 'bg-slate-700 text-slate-200'
        }">${b.label}</span>
      `).join('') : '<span class="text-xs text-slate-500">First over beginning...</span>';

      return `
        <div class="space-y-4">
          <!-- Back button -->
          <div class="flex items-center justify-between">
            <button onclick="navigateTo('home')" class="flex items-center gap-1.5 text-xs font-bold text-slate-400 hover:text-white">
              <i data-lucide="arrow-left" class="w-4 h-4"></i> Back
            </button>
            <span class="text-xs font-bold text-amber-400 uppercase tracking-widest">${match.title}</span>
          </div>

          <!-- Hero Score Banner -->
          <div class="bg-[#121829] border border-slate-800 rounded-3xl p-5 shadow-2xl relative overflow-hidden">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-3">
                ${renderTeamLogo(batTeam, 'w-14 h-14')}
                <div>
                  <h2 class="text-lg font-black text-white">${appState.teams[batTeam].name}</h2>
                  <p class="text-xs text-slate-400">vs ${appState.teams[bowlTeam].name}</p>
                </div>
              </div>
              <div class="text-right">
                <div class="text-3xl font-black text-amber-400 tracking-tight">${inn.runs}/${inn.wickets}</div>
                <div class="text-xs font-bold text-slate-400">${Math.floor(inn.legalBalls / 6)}.${inn.legalBalls % 6} / ${match.overs} ov</div>
              </div>
            </div>

            <!-- Chase Ticker -->
            ${chaseBannerHtml}

            <!-- Crease Summary -->
            <div class="mt-4 pt-3 border-t border-slate-800/80 space-y-2 text-xs">
              <div class="flex justify-between items-center text-slate-300">
                <span class="flex items-center gap-1">
                  <span class="text-amber-400 font-black">🏏</span>
                  <strong>${inn.striker.name}</strong>*
                </span>
                <span class="font-bold">${inn.striker.runs} <span class="text-slate-500 text-[10px]">(${inn.striker.balls}b, 4s:${inn.striker.fours}, 6s:${inn.striker.sixes})</span></span>
              </div>
              <div class="flex justify-between items-center text-slate-400">
                <span>${inn.nonStriker.name}</span>
                <span>${inn.nonStriker.runs} <span class="text-slate-500 text-[10px]">(${inn.nonStriker.balls}b)</span></span>
              </div>
              <div class="flex justify-between items-center text-slate-400 pt-1 border-t border-slate-800/40">
                <span>Bowler: <strong class="text-slate-200">${inn.bowler.name}</strong></span>
                <span>${inn.bowler.wickets}-${inn.bowler.runs} <span class="text-slate-500 text-[10px]">(${Math.floor(inn.bowler.legalBalls / 6)}.${inn.bowler.legalBalls % 6} ov)</span></span>
              </div>
            </div>

            <!-- Over Timeline -->
            <div class="mt-4 pt-3 border-t border-slate-800/80 flex items-center justify-between">
              <span class="text-[11px] font-bold text-slate-400">This Over:</span>
              <div class="flex items-center gap-1.5 overflow-x-auto custom-scrollbar">
                ${timelineHtml}
              </div>
            </div>
          </div>

          <!-- ADMIN SCORING KEYPAD -->
          ${appState.isAdmin ? `
            <div class="bg-[#121829] border border-amber-500/20 rounded-3xl p-4 shadow-xl space-y-3">
              <div class="flex items-center justify-between text-xs pb-1 border-b border-slate-800">
                <span class="font-extrabold text-amber-400 uppercase tracking-wider flex items-center gap-1">

                </span>
                <button onclick="handleSwapStrike()" class="text-slate-400 hover:text-white font-bold flex items-center gap-1">
                  <i data-lucide="repeat" class="w-3.5 h-3.5"></i> Swap Strike
                </button>
              </div>

              <!-- Primary Runs Keypad -->
              <div class="grid grid-cols-4 gap-2">
                <button onclick="recordBall(0)" class="py-3 bg-slate-800 hover:bg-slate-700 text-white font-black rounded-2xl text-base shadow active:scale-95 transition">0</button>
                <button onclick="recordBall(1)" class="py-3 bg-slate-800 hover:bg-slate-700 text-white font-black rounded-2xl text-base shadow active:scale-95 transition">1</button>
                <button onclick="recordBall(2)" class="py-3 bg-slate-800 hover:bg-slate-700 text-white font-black rounded-2xl text-base shadow active:scale-95 transition">2</button>
                <button onclick="recordBall(3)" class="py-3 bg-slate-800 hover:bg-slate-700 text-white font-black rounded-2xl text-base shadow active:scale-95 transition">3</button>
                <button onclick="recordBall(4)" class="py-3 bg-blue-600 hover:bg-blue-500 text-white font-black rounded-2xl text-base shadow active:scale-95 transition">4</button>
                <button onclick="recordBall(6)" class="py-3 bg-purple-600 hover:bg-purple-500 text-white font-black rounded-2xl text-base shadow active:scale-95 transition">6</button>
                <button onclick="recordExtra('WD')" class="py-3 bg-slate-700 hover:bg-slate-600 text-amber-300 font-black rounded-2xl text-xs uppercase shadow active:scale-95 transition">WD</button>
                <button onclick="recordExtra('NB')" class="py-3 bg-slate-700 hover:bg-slate-600 text-red-300 font-black rounded-2xl text-xs uppercase shadow active:scale-95 transition">NB</button>

              <!-- Special Action Buttons -->
              <div class="grid grid-cols-3 gap-2 pt-1">
                <button onclick="triggerSuperBall()" class="py-3 ${inn.superBallUsed ? 'opacity-40 pointer-events-none bg-slate-800 text-slate-500' : 'bg-gradient-to-r from-amber-500 to-yellow-500 text-black shadow-lg shadow-amber-500/20 active:scale-95'} font-black rounded-2xl text-xs uppercase tracking-wider transition">
                  ⚡ Super Ball
                </button>
                <button onclick="openWicketModal()" class="py-3 bg-red-600 hover:bg-red-500 text-white font-black rounded-2xl text-xs uppercase tracking-wider shadow-lg active:scale-95 transition">

                  <i data-lucide="undo" class="w-3.5 h-3.5"></i> Undo
                </button>
              </div>
            </div>
          ` : `
            <div class="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-4 text-center">
              <span class="text-xs text-slate-500 font-medium">Spectator mode active. Scores sync automatically in real time.</span>
            </div>

    function renderApp() {

        else if (appState.currentView === 'live') container.innerHTML = renderLiveScreen();
        else if (appState.currentView === 'fixtures') container.innerHTML = renderFixturesScreen();
        else if (appState.currentView === 'squads') container.innerHTML = renderSquadsScreen();
        else if (appState.currentView === 'results') container.innerHTML = renderResultsScreen();
        else if (appState.currentView === 'rules') container.innerHTML = renderRulesScreen();
        else if (appState.currentView === 'points') container.innerHTML = renderPointsScreen();
        else if (appState.currentView === 'leaderboard') container.innerHTML = renderLeaderboardScreen();
        else if (appState.currentView === 'admin') container.innerHTML = renderAdminScreen();

        updateNavUI();
        if (window.lucide && lucide.createIcons) lucide.createIcons();
      } catch (e) {
        console.error('Render crash trapped:', e);
        container.innerHTML = `<div class="p-6 text-center text-red-400 text-xs font-bold">App render trapped: ${e.message}</div>`;
      }
    }

    // --- 9. MATCH SCORING ACTIONS ---
    function startMatchSetup(fixtureId) {
      const fixture = appState.fixtures.find(f => f.id === fixtureId);
      if (!fixture) return;

      appState.activeMatch = {
        id: fixture.id,
        title: fixture.title,
        overs: fixture.overs || 8,
        status: 'live',
        currentInnings: 1,
        innings1: {
          battingTeam: fixture.teamA,
          bowlingTeam: fixture.teamB,
          runs: 0,
          wickets: 0,
          legalBalls: 0,
          superBallUsed: false,
          striker: { name: appState.teams[fixture.teamA].players[0] || 'Batter 1', runs: 0, balls: 0, fours: 0, sixes: 0 },
          nonStriker: { name: appState.teams[fixture.teamA].players[1] || 'Batter 2', runs: 0, balls: 0, fours: 0, sixes: 0 },
          bowler: { name: appState.teams[fixture.teamB].players[0] || 'Bowler', runs: 0, wickets: 0, legalBalls: 0 },
          timeline: []
        },
        innings2: null
      };

      fixture.status = 'live';
      saveState(true);
      navigateTo('live');
    }

    function recordBall(runs) {
      if (!appState.activeMatch || !appState.isAdmin) return;
      const inn = appState.activeMatch.currentInnings === 1 ? appState.activeMatch.innings1 : appState.activeMatch.innings2;

      inn.runs += runs;
      inn.legalBalls += 1;
      inn.striker.runs += runs;
      inn.striker.balls += 1;
      if (runs === 4) { inn.striker.fours += 1; AudioEngine.play('boundary4'); showEventOverlay('FOUR!', '+4 Runs off the bat'); }
      if (runs === 6) { inn.striker.sixes += 1; AudioEngine.play('boundary6'); showEventOverlay('SIX!', 'MAXIMUM HIT!'); }

      inn.bowler.runs += runs;
      inn.bowler.legalBalls += 1;
      inn.timeline.push({ label: runs.toString(), runs, isWicket: false });

      if (runs % 2 !== 0) handleSwapStrike();

      // Check Over Complete (6 legal balls per over)
      if (inn.legalBalls % 6 === 0) {
        handleSwapStrike();
        openNextBowlerModal();
      }

      saveState(true);
      renderApp();
    }

    function recordExtra(type) {
      if (!appState.activeMatch || !appState.isAdmin) return;
      const inn = appState.activeMatch.currentInnings === 1 ? appState.activeMatch.innings1 : appState.activeMatch.innings2;

      inn.runs += 1;
      inn.bowler.runs += 1;
      inn.timeline.push({ label: type, runs: 1, isWicket: false });

      saveState(true);
      renderApp();
    }

    function triggerSuperBall() {
      if (!appState.activeMatch || !appState.isAdmin) return;
      const inn = appState.activeMatch.currentInnings === 1 ? appState.activeMatch.innings1 : appState.activeMatch.innings2;
      if (inn.superBallUsed) return;

      const runs = prompt("Enter runs scored off Super Ball (Runs will be doubled, or type 'W' for wicket):");
      if (runs === null) return;

      inn.superBallUsed = true;
      AudioEngine.play('superball');

      if (runs.toUpperCase() === 'W') {
        inn.runs = Math.max(0, inn.runs - 5);
        inn.wickets += 1;
        inn.legalBalls += 1;
        inn.bowler.legalBalls += 1;
        inn.timeline.push({ label: '⚡OUT', runs: -5, isWicket: true, isSuperBall: true });
        showEventOverlay('SUPER BALL WICKET!', '-5 Runs Penalty');
        openWicketModal();
      } else {
        const parsed = parseInt(runs) || 0;
        const total = parsed * 2;
        inn.runs += total;
        inn.legalBalls += 1;
        inn.striker.runs += total;
        inn.striker.balls += 1;
        inn.bowler.runs += total;
        inn.bowler.legalBalls += 1;
        inn.timeline.push({ label: `⚡${total}`, runs: total, isWicket: false, isSuperBall: true });
        showEventOverlay('SUPER BALL HIT!', `+${total} Runs (2x Multiplier)`);
        if (total % 2 !== 0) handleSwapStrike();
      }

      saveState(true);
      renderApp();
    }

    function handleSwapStrike() {
      if (!appState.activeMatch) return;
      const inn = appState.activeMatch.currentInnings === 1 ? appState.activeMatch.innings1 : appState.activeMatch.innings2;
      const temp = inn.striker;
      inn.striker = inn.nonStriker;
      inn.nonStriker = temp;
    }

    function openWicketModal() {
      const inn = appState.activeMatch.currentInnings === 1 ? appState.activeMatch.innings1 : appState.activeMatch.innings2;
      const newBatter = prompt('WICKET! Enter new batsman name:', '');
      if (newBatter) {
        inn.wickets += 1;
        inn.striker = { name: newBatter, runs: 0, balls: 0, fours: 0, sixes: 0 };
        AudioEngine.play('wicket');
        saveState(true);
        renderApp();
      }
    }

    function openNextBowlerModal() {
      const inn = appState.activeMatch.currentInnings === 1 ? appState.activeMatch.innings1 : appState.activeMatch.innings2;
      const nextBowler = prompt(`Over Finished! Select next bowler from ${inn.bowlingTeam} (Max 2 overs limit):`, '');
      if (nextBowler) {
        inn.bowler = { name: nextBowler, runs: 0, wickets: 0, legalBalls: 0 };
        saveState(true);
        renderApp();
      }
    }

    function handleUndoBall() {
      alert('Undo registered.');
    }

    function showEventOverlay(title, desc) {
      const overlay = document.getElementById('event-overlay');
      const box = document.getElementById('event-overlay-box');
      const t = document.getElementById('event-overlay-title');
      const d = document.getElementById('event-overlay-desc');
      if (!overlay) return;

      t.innerText = title;
      d.innerText = desc;
      overlay.classList.remove('hidden');
      setTimeout(() => overlay.classList.add('hidden'), 2200);
    }

    function openRegisterPlayerModal(teamCode) {
      const name = prompt(`Register new player for ${teamCode}:`);
      if (name && name.trim()) {
        appState.teams[teamCode].players.push(name.trim());
        saveState(true);
        renderApp();
      }
    }

    function openEditRulesModal() {
      const newRules = prompt('Edit Tournament Rules:', appState.rules);
      if (newRules !== null) {
        appState.rules = newRules;
        saveState(true);
        renderApp();
      }
    }

    function resetTournamentData() {
      if (confirm('Are you sure you want to completely reset the tournament data?')) {
        localStorage.removeItem('nsl_s2_state_v3');
        appState.teams = DEFAULT_TEAMS;
        appState.fixtures = DEFAULT_FIXTURES;
        appState.rules = DEFAULT_RULES;
        appState.activeMatch = null;
        saveState(true);
        renderApp();
      }
    }

    // --- 10. BOOTSTRAP INITIALIZATION ---
    window.addEventListener('DOMContentLoaded', () => {
      loadSavedState();
      renderApp(); // Render immediately with zero delay
      setTimeout(initFirebaseSync, 100); // Connect cloud in background
    });
  </script>
</body>
</html>
