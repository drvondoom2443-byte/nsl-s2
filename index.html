    /* 3D Coin Toss Animation */
    .coin-perspective { perspective: 1000px; }
    .coin-3d {
      width: 120px;
      height: 120px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 3s cubic-bezier(0.15, 0.85, 0.35, 1.2);

      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;

      align-items: center;
      justify-content: center;

    .coin-front { transform: rotateY(0deg); }
    .coin-back { transform: rotateY(180deg); }

    /* Animated Spectator Broadcast Overlay */
    @keyframes bannerPop {
      0% { transform: scale(0.6) translateY(30px); opacity: 0; }
      18% { transform: scale(1.05) translateY(0); opacity: 1; }
      28% { transform: scale(1); }
      82% { transform: scale(1); opacity: 1; }
      100% { transform: scale(0.92) translateY(-25px); opacity: 0; }
    }

    /**
     * WEB AUDIO SYNTHESIZER (Crowds, Cheers, Sirens, Buzzers)
     */
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    const SoundFX = {
      // Dual-tone ascending alarm siren for Super Ball
      playSuperBallSiren() {
        try {
          const ctx = getAudioContext();
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          const gain = ctx.createGain();

          osc1.type = 'sawtooth';
          osc2.type = 'sine';

          const now = ctx.currentTime;
          osc1.frequency.setValueAtTime(320, now);
          osc1.frequency.linearRampToValueAtTime(840, now + 0.4);
          osc1.frequency.linearRampToValueAtTime(320, now + 0.8);
          osc1.frequency.linearRampToValueAtTime(950, now + 1.2);

          osc2.frequency.setValueAtTime(480, now);
          osc2.frequency.linearRampToValueAtTime(980, now + 0.4);
          osc2.frequency.linearRampToValueAtTime(480, now + 0.8);
          osc2.frequency.linearRampToValueAtTime(1100, now + 1.2);

          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 1.4);

          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(ctx.destination);

          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + 1.4);
          osc2.stop(now + 1.4);
        } catch (e) { console.warn('Audio unavailable', e); }
      },

      // Stadium Four (Cheer / Applause Resonance)
      playFourCheer() {
        try {
          const ctx = getAudioContext();
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.3);
          osc.frequency.setValueAtTime(660, now + 0.35);

          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.9);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(now);
          osc.stop(now + 0.9);

          // Simulated crowd roar noise
          const bufferSize = ctx.sampleRate * 0.8;
          const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const output = noiseBuffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            output[i] = Math.random() * 2 - 1;
          }
          const whiteNoise = ctx.createBufferSource();
          whiteNoise.buffer = noiseBuffer;

          const filter = ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(600, now);

          const noiseGain = ctx.createGain();
          noiseGain.gain.setValueAtTime(0.08, now);
          noiseGain.gain.linearRampToValueAtTime(0.18, now + 0.2);
          noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);

          whiteNoise.connect(filter);
          filter.connect(noiseGain);
          noiseGain.connect(ctx.destination);

          whiteNoise.start(now);
          whiteNoise.stop(now + 0.8);
        } catch (e) {}
      },

      // Stadium Six (Boom + Massive Roar)
      playSixRoar() {
        try {
          const ctx = getAudioContext();
          const now = ctx.currentTime;

          // Deep explosive bass drop
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(40, now + 0.5);
          gain.gain.setValueAtTime(0.45, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.6);

          // Massive crowd noise filter
          const bufferSize = ctx.sampleRate * 1.5;
          const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const output = noiseBuffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            output[i] = Math.random() * 2 - 1;
          }
          const whiteNoise = ctx.createBufferSource();
          whiteNoise.buffer = noiseBuffer;

          const filter = ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(800, now);
          filter.Q.setValueAtTime(1.5, now);

          const noiseGain = ctx.createGain();
          noiseGain.gain.setValueAtTime(0.05, now);
          noiseGain.gain.linearRampToValueAtTime(0.28, now + 0.3);
          noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 1.4);

          whiteNoise.connect(filter);
          filter.connect(noiseGain);
          noiseGain.connect(ctx.destination);

          whiteNoise.start(now);
          whiteNoise.stop(now + 1.4);
        } catch (e) {}
      },

      // Wicket Fall (Buzzer drop + Crowd gasp)
      playWicketSound() {
        try {
          const ctx = getAudioContext();
          const now = ctx.currentTime;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(280, now);
          osc.frequency.exponentialRampToValueAtTime(85, now + 0.45);

          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(now);
          osc.stop(now + 0.5);
        } catch (e) {}
      }
    };

    /**
     * DYNAMIC LOGO GENERATORS WITH AUTOMATIC SVG SHIELD FALLBACKS
     */
    function renderTeamLogo(teamCode, sizeClasses = "w-10 h-10") {
      const team = AppState.teams[teamCode];
      if (!team) {
        return `<div class="${sizeClasses} rounded-full bg-slate-800 flex items-center justify-center font-bold text-xs text-slate-400">?</div>`;
      }
      return `
        <div class="relative inline-flex items-center justify-center shrink-0">
          <img 
            src="${team.logoPath}" 
            alt="${teamCode}" 
            class="${sizeClasses} object-contain rounded-full shadow-md"
            onerror="this.onerror=null; this.outerHTML='<div class=\\'${sizeClasses} rounded-full bg-gradient-to-tr ${team.gradient} p-0.5 shadow-md flex items-center justify-center\\'><span class=\\'w-full h-full bg-[#0D1424] rounded-full flex items-center justify-center font-black ${team.textColor} text-xs font-display tracking-wider\\'>${teamCode}</span></div>';"
          />
        </div>

    /**
     * PERSISTENCE & CLOUD ENGINE (INSTANT CRICBUZZ-GRADE SYNC)
     */
    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          AppState = Object.assign(AppState, JSON.parse(raw));
        } else {
          populateInitialStats();
          saveLocalState();
        }
      } catch (e) {
        populateInitialStats();
      }
    }

    function saveLocalState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(AppState));
      } catch (e) {}
    }

    async function syncData(isLocalMutation = true) {
      AppState.updatedAt = Date.now();
      saveLocalState();
      updateGlobalTicker();

      if (firestoreDB && isLocalMutation && isAdmin) {
        try {
          const docRef = window.FirebaseSDK.doc(firestoreDB, "nsl_tournament", "s2_state");
          await window.FirebaseSDK.setDoc(docRef, JSON.parse(JSON.stringify(AppState)));
          updateSyncHeartbeat(Date.now());
        } catch (err) {
          console.warn("Firestore sync error:", err);
        }
      }
    }

    function updateSyncHeartbeat(timestamp) {
      const pill = document.getElementById('syncHeartbeatPill');
      const text = document.getElementById('syncHeartbeatText');
      if (pill && text) {
        pill.classList.remove('hidden');
        pill.classList.add('inline-flex');
        const d = new Date(timestamp);
        const timeStr = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        text.innerText = `SYNC ${timeStr}`;
      }
    }

    async function initFirebase() {
      if (!window.FirebaseSDK) return;
      try {
        const app = window.FirebaseSDK.initializeApp(FIREBASE_CONFIG);
        firestoreDB = window.FirebaseSDK.getFirestore(app);

        const docRef = window.FirebaseSDK.doc(firestoreDB, "nsl_tournament", "s2_state");

        // Immediate fetch on open so spectators mid-match get exact live state instantaneously
        try {
          const initialSnap = await window.FirebaseSDK.getDoc(docRef);
          if (initialSnap.exists()) {
            const data = initialSnap.data();
            if (data.updatedAt && data.updatedAt >= (AppState.updatedAt || 0)) {
              AppState = Object.assign(AppState, data);
              saveLocalState();
              updateSyncHeartbeat(data.updatedAt);
              // If match is actively live, direct spectator straight to live center
              if (AppState.liveMatch && AppState.liveMatch.status === 'live' && AppState.currentView === 'home') {
                navigateTo('live', {}, false);
              } else {
                refreshCurrentView();
              }
            }
          }
        } catch (initialErr) {
          console.warn("Initial direct fetch fallback:", initialErr);
        }

        if (firestoreUnsubscribe) firestoreUnsubscribe();

        // Real-time instant snapshot listener (sub-second broadcast)
        firestoreUnsubscribe = window.FirebaseSDK.onSnapshot(docRef, { includeMetadataChanges: false }, (snap) => {
          if (snap.exists()) {
            const remote = snap.data();
            if (!remote.updatedAt || remote.updatedAt >= (AppState.updatedAt || 0)) {
              const oldBroadcastTime = AppState.lastBroadcast ? AppState.lastBroadcast.time : 0;
              AppState = Object.assign(AppState, remote);
              saveLocalState();
              updateSyncHeartbeat(remote.updatedAt || Date.now());
              refreshCurrentView();

              // Trigger broadcast popup & sound on spectator phones
              if (AppState.lastBroadcast && AppState.lastBroadcast.time > oldBroadcastTime) {
                triggerBroadcastUI(AppState.lastBroadcast);
              }
            }
          }
        }, (err) => {
          console.warn("Firestore sync offline fallback", err);
        });
      } catch (e) {
        console.warn("Firebase initialization skipped", e);
      }
    }

    window.addEventListener('firebase-sdk-ready', initFirebase);

      else if (type === 'wicket') SoundFX.playWicketSound();

    /**
     * NAVIGATION ROUTER WITH UNIVERSAL BACK BUTTON
     */
    function navigateTo(view, params = {}, trackHistory = true) {
      if (trackHistory && view !== AppState.currentView) {
        navigationHistory.push(view);
      }
      AppState.currentView = view;
      window.scrollTo(0, 0);

      // Bottom nav updates (only 4 primary tabs)
      document.querySelectorAll('nav button').forEach(b => {
        b.classList.remove('text-amber-400');
        b.classList.add('text-slate-400');
      });
      const activeBtn = document.getElementById(`nav-${view}`);
      if (activeBtn) {
        activeBtn.classList.remove('text-slate-400');
        activeBtn.classList.add('text-amber-400');
      }

      const container = document.getElementById('appContent');
      container.innerHTML = '';

      switch (view) {
        case 'home': renderHomeScreen(container); break;
        case 'live': renderLiveScorerScreen(container); break;
        case 'fixtures': renderFixturesScreen(container); break;
        case 'points': renderPointsScreen(container); break;
        case 'awards': renderAwardsScreen(container, params); break;
        case 'squads': renderSquadsScreen(container); break;
        case 'results': renderResultsScreen(container); break;
        case 'admin': renderAdminScreen(container); break;
        default: renderHomeScreen(container);
      }

      updateGlobalTicker();
      lucide.createIcons();
    }

    function navigateBack() {
      if (navigationHistory.length > 1) {
        navigationHistory.pop(); // remove current view
        const prev = navigationHistory[navigationHistory.length - 1];
        navigateTo(prev, {}, false);
      } else {
        navigateTo('home', {}, false);
      }
    }

    function confirmQuickRegister() {
      const teamId = document.getElementById('quickRegTeamSelect').value;
      const name = document.getElementById('quickRegNameInput').value.trim();
      const role = document.getElementById('quickRegRoleSelect').value;
      if (!name) return;

      if (!AppState.teams[teamId].squad.includes(name)) {
        AppState.teams[teamId].squad.push(name);
        AppState.playerStats[name] = {
          name, team: teamId, role, matches: 0, innings: 0, runs: 0, balls: 0, fours: 0, sixes: 0, highScore: 0, notOuts: 0, legalBallsBowled: 0, runsConceded: 0, wickets: 0, maidens: 0
        };
        closeModal();
        showToast(`${name} registered into ${teamId}!`);
        syncData();
        refreshCurrentView();
      } else {
        showToast("Player already exists in squad!");
      }
    }

     */
    function renderLiveScorerScreen(container) {
      const match = AppState.liveMatch;

      if (!match || match.status !== 'live') {
        container.innerHTML = `
          ${renderScreenHeader('Live Match Center')}
          <div class="py-16 text-center space-y-4">
            <div class="w-16 h-16 rounded-full bg-slate-800/80 border border-slate-700 flex items-center justify-center mx-auto text-slate-500">
              <i data-lucide="radio" class="w-8 h-8"></i>

            <h2 class="text-lg font-bold text-white uppercase tracking-wider">No Active Match in Progress</h2>
            <p class="text-xs text-slate-400 max-w-xs mx-auto">
              ${isAdmin ? 'Go to Fixtures to select Playing 11, conduct the 3D coin toss, and launch the match.' : 'The official has not started a match yet. Scores will sync live here once commenced.'}
            </p>
            ${isAdmin ? `
              <button onclick="navigateTo('fixtures')" class="px-5 py-2.5 rounded-xl bg-amber-500 text-slate-950 font-black text-xs uppercase tracking-wider shadow-lg">
                View Fixtures & Start
              </button>
            ` : ''}
          </div>
        `;
        return;
      }

      const inn = match.currentInnings === 1 ? match.innings1 : match.innings2;
      const batTeam = AppState.teams[inn.battingTeam];
      const bowlTeam = AppState.teams[inn.bowlingTeam];

      const legalBalls = inn.balls;
      const currentOverNumber = Math.floor(legalBalls / 6) + 1;
      const ovFormatted = `${Math.floor(legalBalls / 6)}.${legalBalls % 6}`;

      const striker = inn.batsmen[inn.striker] || { name: inn.striker, runs: 0, balls: 0, fours: 0, sixes: 0 };
      const nonStriker = inn.batsmen[inn.nonStriker] || { name: inn.nonStriker, runs: 0, balls: 0, fours: 0, sixes: 0 };
      const bowler = inn.bowlers[inn.currentBowler] || { name: inn.currentBowler, balls: 0, runs: 0, wickets: 0, maidens: 0 };

      const bowlerOv = `${Math.floor(bowler.balls / 6)}.${bowler.balls % 6}`;

      // CRR Calculation
      const crr = inn.balls > 0 ? ((inn.runs / inn.balls) * 6).toFixed(2) : "0.00";
      
      // Projected Runs at Various Rates (Innings 1)
      const remainingBalls = (match.totalOvers * 6) - inn.balls;
      const projAtCRR = remainingBalls > 0 ? Math.round(inn.runs + ((parseFloat(crr) / 6) * remainingBalls)) : inn.runs;
      const projAt10 = remainingBalls > 0 ? Math.round(inn.runs + ((10 / 6) * remainingBalls)) : inn.runs;
      const projAt12 = remainingBalls > 0 ? Math.round(inn.runs + ((12 / 6) * remainingBalls)) : inn.runs;

      // Chase calculation & Win Predictor
      let chaseWidgetHtml = '';
      let winProbA = 50;
      let winProbB = 50;

      if (match.currentInnings === 2) {
        const target = match.innings1.runs + 1;
        const needed = target - inn.runs;
        const ballsRemaining = Math.max(0, (match.totalOvers * 6) - inn.balls);
        const rrr = ballsRemaining > 0 ? ((needed / ballsRemaining) * 6).toFixed(2) : "0.00";

        // Dynamic Win Probability formula based on RRR and wickets lost
        const wicketsLost = inn.wickets;
        const rrrNum = parseFloat(rrr);
        if (needed <= 0) {
          winProbA = 100; winProbB = 0;
        } else if (ballsRemaining === 0) {
          winProbA = 0; winProbB = 100;
        } else {
          let baseProb = 50 + (10 - rrrNum) * 5 - (wicketsLost * 6);
          baseProb = Math.max(5, Math.min(95, Math.round(baseProb)));
          winProbA = baseProb;
          winProbB = 100 - baseProb;
        }

        chaseWidgetHtml = `
          <div class="bg-gradient-to-r from-amber-950/40 via-purple-950/40 to-slate-900 border border-amber-500/40 rounded-2xl p-3.5 shadow-lg space-y-2.5">
            <div class="flex items-center justify-between text-xs">
              <div>
                <span class="text-slate-400 text-[10px] block font-bold">Target</span>
                <span class="text-xl font-black text-white font-mono">${target}</span>
              </div>
              <div class="text-center">
                <span class="text-amber-400 font-black block text-sm sm:text-base">Need ${needed > 0 ? needed : 0} runs from ${ballsRemaining} balls</span>
                <span class="text-[11px] text-slate-300">Required Rate: <strong class="text-amber-300 font-mono">${rrr}</strong> • CRR: <strong class="text-amber-300 font-mono">${crr}</strong></span>
              </div>
              <div class="text-right">
                <span class="text-slate-400 text-[10px] block font-bold">Overs Left</span>
                <span class="text-xl font-black text-amber-400 font-mono">${Math.floor(ballsRemaining/6)}.${ballsRemaining%6}</span>
              </div>
            </div>

            <!-- Win Probability Predictor Bar -->
            <div class="pt-2 border-t border-slate-800">
              <div class="flex justify-between text-[10px] font-black uppercase tracking-wider mb-1">
                <span class="text-amber-400">${inn.battingTeam} Win: ${winProbA}%</span>
                <span class="text-slate-400">${inn.bowlingTeam} Win: ${winProbB}%</span>
              </div>
              <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden flex">
                <div class="h-full bg-gradient-to-r from-amber-500 to-yellow-400 transition-all duration-500" style="width: ${winProbA}%"></div>
                <div class="h-full bg-slate-700 transition-all duration-500" style="width: ${winProbB}%"></div>
              </div>
            </div>
          </div>
        `;
      } else {
        // Projected Score Widget for Innings 1
        chaseWidgetHtml = `
          <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-3 flex items-center justify-between text-xs">
            <div>

            <div class="text-center">
              <span class="text-slate-400 text-[10px] block font-bold uppercase">Projected Score (at CRR)</span>
              <span class="text-base font-black text-white font-mono">${projAtCRR} runs</span>
            </div>
            <div class="text-right">
              <span class="text-slate-400 text-[10px] block font-bold uppercase">At 10 / 12 RPO</span>
              <span class="text-xs font-mono font-bold text-slate-300">${projAt10} / ${projAt12}</span>
            </div>
          </div>
        `;
      }

      const superBallEligible = currentOverNumber >= 2 && currentOverNumber <= 7 && !inn.superBallUsed;

      container.innerHTML = `
        <div class="space-y-3.5">
          ${renderScreenHeader(`Match ${match.fixtureId}`, `Innings ${match.currentInnings}`)}

          <!-- Big Broadcast Main Scorecard Card -->
          <div class="rounded-3xl bg-gradient-to-br from-[#10192E] via-[#0B1120] to-[#070B12] border border-slate-800 p-5 shadow-2xl relative overflow-hidden">
            <div class="flex items-center justify-between">
              <div class="flex items-center space-x-3.5">
                ${renderTeamLogo(inn.battingTeam, "w-14 h-14")}
                <div>
                  <div class="flex items-baseline space-x-2">
                    <span class="font-display text-5xl sm:text-6xl font-black text-white tracking-tight leading-none">${inn.runs}/${inn.wickets}</span>
                    <span class="text-base font-bold text-slate-400">(${ovFormatted}/${match.totalOvers} ov)</span>
                  </div>
                  <div class="text-sm font-black text-amber-400 mt-1">${batTeam?.name}</div>
                </div>
              </div>

              <!-- Indicators: Free Hit & Super Ball -->
              <div class="flex flex-col items-end space-y-1.5">
                ${inn.isFreeHit ? `
                  <span class="px-3 py-1 rounded-full bg-red-600 text-white text-[11px] font-black uppercase tracking-wider shadow-lg animate-pulse">
                    FREE HIT
                  </span>
                ` : ''}
                ${inn.isSuperBallActive ? `
                  <span class="px-3 py-1 rounded-full bg-purple-600 text-white text-[11px] font-black uppercase tracking-wider shadow-lg shadow-purple-600/50 animate-bounce">
                    ⚡ SUPER BALL ACTIVE
                  </span>
                ` : ''}
                ${!inn.superBallUsed ? `
                  <span class="text-[10px] text-purple-400 font-bold">⚡ Super Ball Available</span>
                ` : `
                  <span class="text-[10px] text-slate-500 line-through">Super Ball Used</span>
                `}
              </div>
            </div>

            <!-- Big Current Batter & Bowler Strip -->
            <div class="mt-5 pt-4 border-t border-slate-800/80 grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
              <!-- Striker & Non Striker -->
              <div class="space-y-2">
                <div class="flex items-center justify-between text-white font-bold bg-slate-900/80 p-2.5 rounded-xl border border-amber-500/30">
                  <span class="flex items-center gap-1.5 truncate text-amber-300 font-bold">
                    <i data-lucide="crosshair" class="w-4 h-4 text-amber-400 shrink-0"></i>
                    ${striker.name} *

                    <span class="text-sm font-black text-white">${striker.runs}</span>
                    <span class="text-[11px] text-slate-400">(${striker.balls}b, ${striker.fours}x4, ${striker.sixes}x6)</span>

    function renderTimelineBalls(balls) {
      if (!balls || balls.length === 0) {
        return `<span class="text-xs text-slate-500 italic">No balls bowled yet in this over.</span>`;
      }
      return balls.map(b => {
        let bg = "bg-slate-800 text-slate-200 border-slate-700";
        if (b.isSuperBall) bg = "bg-purple-600 text-white border-purple-400 font-black animate-pulse";
        else if (b.isWicket) bg = "bg-rose-600 text-white border-rose-500 font-black";
        else if (b.runs === 6) bg = "bg-amber-500 text-slate-950 border-yellow-300 font-black";
        else if (b.runs === 4) bg = "bg-blue-600 text-white border-blue-400 font-black";
        else if (b.isWide) bg = "bg-yellow-600/40 text-yellow-300 border-yellow-500/50";
        else if (b.isNoBall) bg = "bg-orange-600/40 text-orange-300 border-orange-500/50";

        return `
          <span class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-mono border shrink-0 ${bg}">
            ${b.label}
          </span>
        `;
      }).join('');
    }

    /**
     * SCORING ENGINE LOGIC (Strict Tape-Ball & Superball Rules)
     */
    function recordDelivery({ runs = 0, isWide = false, isNoBall = false, isBoundary = false, isWicket = false, dismissalType = null }) {
      if (!isAdmin) return;
      const match = AppState.liveMatch;
      if (!match || match.status !== 'live') return;

      const inn = match.currentInnings === 1 ? match.innings1 : match.innings2;

      // Save deep snapshot into history (up to 16 balls for multi-ball undo)
      if (!inn.history) inn.history = [];
      inn.history.push(JSON.parse(JSON.stringify({
        innings: { ...inn, history: null },
        currentInnings: match.currentInnings
      })));
      if (inn.history.length > 16) inn.history.shift();

      let isSuperBallDelivery = inn.isSuperBallActive;
      let runsScoredOnBall = 0;
      let label = "";

      // Striker & Bowler references
      let striker = inn.batsmen[inn.striker];
      let bowler = inn.bowlers[inn.currentBowler];

      if (!striker) {
        striker = inn.batsmen[inn.striker] = { name: inn.striker, runs: 0, balls: 0, fours: 0, sixes: 0, isOut: false };
      }
      if (!bowler) {
        bowler = inn.bowlers[inn.currentBowler] = { name: inn.currentBowler, balls: 0, runs: 0, wickets: 0, maidens: 0 };
      }

      // 1. WIDE BALL
      if (isWide) {
        inn.runs += 1;
        bowler.runs += 1;
        inn.extras.wides += 1;
        label = "WD";

        // Super ball on Wide: Carries over to next legal delivery
        if (isSuperBallDelivery) {
          label = "⚡WD";
          inn.isSuperBallActive = true; // persists
        }
        triggerBroadcast("normal", "WIDE BALL", "+1 Extra", "⚠️");
      }
      // 2. NO BALL
      else if (isNoBall) {
        inn.runs += 1;
        bowler.runs += 1;
        inn.extras.noBalls += 1;
        inn.isFreeHit = true; // Next ball is Free Hit

        let batRuns = runs;
        if (isSuperBallDelivery) {
          batRuns = runs * 2;
        }

        striker.runs += batRuns;
        striker.balls += 1;
        inn.runs += batRuns;
        bowler.runs += batRuns;

        if (runs === 4) { striker.fours += 1; triggerBroadcast("four", "FOUR RUNS!", "+4 off No Ball", "💥"); }
        else if (runs === 6) { striker.sixes += 1; triggerBroadcast("six", "SIX RUNS!", "+6 off No Ball", "🚀"); }
        else { triggerBroadcast("normal", "NO BALL", "+1 & Free Hit", "⚠️"); }

        label = isSuperBallDelivery ? `⚡NB+${batRuns}` : `NB+${runs}`;

        // Strike rotation on odd runs off No Ball
        if (runs % 2 !== 0) {
          const temp = inn.striker;
          inn.striker = inn.nonStriker;
          inn.nonStriker = temp;
          // Superball automatically passed to new striker
          if (isSuperBallDelivery) {
            inn.isSuperBallActive = true;
          }
        }
      }
      // 3. WICKET DISMISSAL
      else if (isWicket) {
        striker.balls += 1;
        inn.balls += 1;
        bowler.balls += 1;

        // Check Free Hit rules: Run out only!
        const isFreeHit = inn.isFreeHit;
        const isRunOut = dismissalType === 'Run Out';

        if (isFreeHit && !isRunOut) {
          // Not out on free hit!
          showToast("Not Out! Free Hit Delivery.");
          label = "FH-0";

          // If super ball on Free Hit and bowled/caught, 5 runs STILL deducted
          if (isSuperBallDelivery) {
            inn.runs = Math.max(0, inn.runs - 5);
            label = "⚡FH(-5)";
            triggerBroadcast("superball", "SUPER BALL FREE HIT", "Not Out but -5 Runs Deducted!", "⚡");
            inn.isSuperBallActive = false;
            inn.superBallUsed = true;
          }
        } else {
          // Regular Legal Wicket OR Run Out on Free Hit
          striker.isOut = true;
          striker.dismissal = dismissalType || "Bowled";
          inn.wickets += 1;
          bowler.wickets += 1;
          label = "W";

          // Super Ball Wicket: 5 RUNS DEDUCTION
          if (isSuperBallDelivery) {
            inn.runs = Math.max(0, inn.runs - 5);
            label = "⚡W(-5)";
            triggerBroadcast("wicket", "SUPER BALL WICKET!", "OUT & -5 Runs Deducted", "☝️");
            inn.isSuperBallActive = false;
            inn.superBallUsed = true;
          } else {
            triggerBroadcast("wicket", "WICKET FALLS!", `${striker.name} ${striker.dismissal}`, "☝️");
          }
        }

        inn.isFreeHit = false; // Free hit consumed

        // Prompt for next batter if not all-out
        if (inn.wickets < (match.playingXI[inn.battingTeam].length - 1)) {
          openNextBatsmanModal();
        }
      }
      // 4. REGULAR LEGAL DELIVERY
      else {
        striker.balls += 1;
        inn.balls += 1;
        bowler.balls += 1;

        let scored = runs;
        // Super Ball: Doubles runs off bat
        if (isSuperBallDelivery) {
          scored = runs * 2;
          label = `⚡${scored}`;
          inn.isSuperBallActive = false;
          inn.superBallUsed = true;

          if (scored > 0) {
            triggerBroadcast("superball", "SUPER BALL SCORED!", `+${scored} Runs (Doubled Bat Runs)`, "⚡");
          } else {
            triggerBroadcast("superball", "SUPER BALL DOT", "0 Runs", "⚡");
          }
        } else {
          label = `${runs}`;
          if (runs === 4) {
            striker.fours += 1;
            triggerBroadcast("four", "FOUR RUNS!", "Boundary to the ropes", "💥");
          } else if (runs === 6) {
            striker.sixes += 1;
            triggerBroadcast("six", "MAXIMUM SIX!", "Massive Tape-Ball Hit", "🚀");
          }
        }

        striker.runs += scored;
        inn.runs += scored;
        bowler.runs += scored;

        inn.isFreeHit = false; // Consumed

        // Strike rotation on odd runs
        if (runs % 2 !== 0) {
          const temp = inn.striker;
          inn.striker = inn.nonStriker;
          inn.nonStriker = temp;
        }
      }

      // Add to timeline
      inn.timeline.push({
        label,
        runs,
        isSuperBall: isSuperBallDelivery,
        isWicket,
        isWide,
        isNoBall
      });

      // Check End of Over or End of Match
      checkOverAndMatchStatus();
      syncData();
      refreshCurrentView();
    }

    /**
     * SUPER BALL TRIGGER (Overs 2 to 7)
     */
    function triggerSuperBallCall() {
      if (!isAdmin) return;
      const match = AppState.liveMatch;
      if (!match) return;
      const inn = match.currentInnings === 1 ? match.innings1 : match.innings2;

      const currentOverNumber = Math.floor(inn.balls / 6) + 1;
      if (currentOverNumber < 2 || currentOverNumber > 7) {
        showToast("Super Ball is only allowed between Overs 2 and 7!");
        return;
      }
      if (inn.superBallUsed) {
        showToast("Super Ball already used in this innings!");
        return;
      }

      inn.isSuperBallActive = true;
      SoundFX.playSuperBallSiren();
      triggerBroadcast("superball", "SUPER BALL ACTIVATED!", "2X Runs • Wicket = -5 Runs Penalty", "⚡");
      syncData();
      refreshCurrentView();
    }

    /**
     * SWAP STRIKE MANUALLY
     */
    function swapStrikeManual() {
      if (!isAdmin) return;
      const match = AppState.liveMatch;
      if (!match) return;
      const inn = match.currentInnings === 1 ? match.innings1 : match.innings2;

      const temp = inn.striker;
      inn.striker = inn.nonStriker;
      inn.nonStriker = temp;

      showToast(`Strike swapped: ${inn.striker} is now on strike`);
      syncData();
      refreshCurrentView();
    }

    /**
     * MULTI-BALL UNDO (16 Balls History)
     */
    function undoLastDelivery() {
      if (!isAdmin) return;
      const match = AppState.liveMatch;
      if (!match) return;
      const inn = match.currentInnings === 1 ? match.innings1 : match.innings2;

      if (!inn.history || inn.history.length === 0) {
        showToast("No more balls to undo!");
        return;
      }

      const lastState = inn.history.pop();
      if (match.currentInnings === 1) {
        match.innings1 = { ...lastState.innings, history: inn.history };
      } else {
        match.innings2 = { ...lastState.innings, history: inn.history };
      }

      showToast("Delivery successfully undone!");
      syncData();
      refreshCurrentView();
    }

    /**
     * OVER & MATCH STATUS EVALUATOR
     */
    function checkOverAndMatchStatus() {
      const match = AppState.liveMatch;
      if (!match) return;
      const inn = match.currentInnings === 1 ? match.innings1 : match.innings2;
      const maxBalls = match.totalOvers * 6;
      const totalWickets = match.playingXI[inn.battingTeam].length - 1;

      // 1. Check if 2nd Innings Target has been passed
      if (match.currentInnings === 2) {
        const target = match.innings1.runs + 1;
        if (inn.runs >= target) {
          finalizeMatch(match);
          return;
        }
      }

      // 2. Check Innings Complete (All out or max overs reached)
      if (inn.balls >= maxBalls || inn.wickets >= totalWickets) {
        if (match.currentInnings === 1) {
          startSecondInnings(match);
        } else {
          finalizeMatch(match);
        }
        return;
      }

      // 3. Check End of Over (Legal balls divisible by 6)
      if (inn.balls > 0 && inn.balls % 6 === 0 && inn.timeline[inn.timeline.length - 1].isWide === false && inn.timeline[inn.timeline.length - 1].isNoBall === false) {
        // Automatic strike rotation at end of over
        const temp = inn.striker;
        inn.striker = inn.nonStriker;
        inn.nonStriker = temp;

        // Prompt for Next Bowler (Strict 2 Overs Max + No Consecutive Overs)
        openNextBowlerModal();
      }
    }

    /**
     * NAVIGATION ROUTER WITH UNIVERSAL BACK BUTTON
     */
    function navigateTo(view, params = {}, trackHistory = true) {
      if (trackHistory && view !== AppState.currentView) {
        navigationHistory.push(view);
      }
      AppState.currentView = view;
      window.scrollTo(0, 0);

      // Bottom nav updates (only 4 primary tabs)
      document.querySelectorAll('nav button').forEach(b => {
        b.classList.remove('text-amber-400');
        b.classList.add('text-slate-400');
      });
      const activeBtn = document.getElementById(`nav-${view}`);
      if (activeBtn) {
        activeBtn.classList.remove('text-slate-400');
        activeBtn.classList.add('text-amber-400');
      }

      const container = document.getElementById('appContent');
      container.innerHTML = '';

      switch (view) {
        case 'home': renderHomeScreen(container); break;
        case 'live': renderLiveScorerScreen(container); break;
        case 'fixtures': renderFixturesScreen(container); break;
        case 'points': renderPointsScreen(container); break;
        case 'awards': renderAwardsScreen(container, params); break;
        case 'squads': renderSquadsScreen(container); break;
        case 'results': renderResultsScreen(container); break;
        case 'rules': renderRulesScreen(container); break;
        case 'admin': renderAdminScreen(container); break;
        default: renderHomeScreen(container);
      }

      updateGlobalTicker();
      lucide.createIcons();
    }

    /**
     * BOWLER QUOTA ENFORCEMENT & OVER MANAGEMENT
     * - Strict max 2.0 overs per bowler
     * - Disallows consecutive overs
     */
    function openNextBowlerModal() {
      const match = AppState.liveMatch;
      if (!match) return;
      const inn = match.currentInnings === 1 ? match.innings1 : match.innings2;
      const bowlSquad = match.playingXI[inn.bowlingTeam];
      const prevBowler = inn.currentBowler;

      // Filter eligible bowlers:
      // 1. Not the previous bowler (no consecutive overs)
      // 2. Has bowled less than 12 legal balls (strictly < 2.0 overs)
      const eligibleBowlers = bowlSquad.map(player => {
        const stats = inn.bowlers[player] || { balls: 0, runs: 0, wickets: 0 };
        const oversBowled = `${Math.floor(stats.balls / 6)}.${stats.balls % 6}`;
        const isConsecutive = player === prevBowler;
        const isQuotaFilled = stats.balls >= 12; // 2.0 overs = 12 legal balls
        const canBowl = !isConsecutive && !isQuotaFilled;

        let reason = "";
        if (isQuotaFilled) reason = "Max 2.0 ov bowled";
        else if (isConsecutive) reason = "Cannot bowl consecutive overs";

        return {
          name: player,
          overs: oversBowled,
          runs: stats.runs,
          wickets: stats.wickets,
          canBowl,
          reason
        };
      });

      const modal = document.getElementById('modalContainer');
      modal.innerHTML = `
        <div class="bg-[#0F172A] border border-emerald-500/50 rounded-3xl p-5 max-w-sm w-full space-y-4 shadow-2xl">
          <div class="text-center">
            <span class="px-2.5 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 text-[10px] font-black uppercase tracking-wider">
              Over Finished
            </span>
            <h3 class="text-base font-black text-white uppercase tracking-wider mt-1.5">Select Next Bowler</h3>
            <p class="text-xs text-slate-400 mt-0.5">${inn.bowlingTeam} Fielding • Limit: 2.0 Overs Max</p>
          </div>

          <div class="space-y-1.5 max-h-64 overflow-y-auto pr-1">
            ${eligibleBowlers.map(b => `
              <button 
                ${b.canBowl ? `onclick="selectNextBowler('${b.name}')"` : 'disabled'}
                class="w-full p-2.5 rounded-xl border flex items-center justify-between text-left text-xs transition-all ${
                  b.canBowl 
                    ? 'bg-slate-900 hover:bg-emerald-950/60 border-slate-700 text-white cursor-pointer' 
                    : 'bg-slate-950/50 border-slate-800 text-slate-500 cursor-not-allowed opacity-60'
                }">
                <div>
                  <div class="font-bold flex items-center gap-1.5">
                    <span>${b.name}</span>
                    ${b.reason ? `<span class="text-[9px] px-1.5 py-0.2 rounded bg-slate-800 text-rose-400 font-semibold">${b.reason}</span>` : ''}
                  </div>
                  <div class="text-[10px] text-slate-400 mt-0.5 font-mono">
                    Figures: ${b.wickets}/${b.runs} (${b.overs}/2.0 ov)
                  </div>
                </div>
                ${b.canBowl ? `<i data-lucide="check" class="w-4 h-4 text-emerald-400"></i>` : ''}
              </button>
            `).join('')}
          </div>
        </div>
      `;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      lucide.createIcons();
    }

    let isFlipping = false;
    function flipCoin(teamA, teamB) {
      if (isFlipping) return;
      isFlipping = true;

      const coin = document.getElementById('coin3D');
      const winner = Math.random() < 0.5 ? teamA : teamB;
      matchSetupState.tossWinner = winner;

      const rotations = 5 * 360 + (winner === teamB ? 180 : 0);
      coin.style.transform = `rotateY(${rotations}deg)`;

      setTimeout(() => {
        isFlipping = false;
        document.getElementById('tossResultText').innerText = `🪙 ${AppState.teams[winner]?.name} Won The Toss!`;
        document.getElementById('tossResultBanner').classList.remove('hidden');
      }, 3100);
    }

    function setTossDecision(decision) {
      matchSetupState.tossDecision = decision;
      openOpenersPickerModal();
    }

    function openOpenersPickerModal() {
      const modal = document.getElementById('modalContainer');
      const tossWinner = matchSetupState.tossWinner;
      const otherTeam = tossWinner === matchSetupState.teamA ? matchSetupState.teamB : matchSetupState.teamA;

      const batTeam = matchSetupState.tossDecision === 'BAT' ? tossWinner : otherTeam;
      const bowlTeam = batTeam === matchSetupState.teamA ? matchSetupState.teamB : matchSetupState.teamA;

      const batSquad = matchSetupState.playingXI[batTeam];
      const bowlSquad = matchSetupState.playingXI[bowlTeam];

      modal.innerHTML = `

    function startMatchOfficially(batTeam, bowlTeam) {
      const striker = document.getElementById('strikerSelect').value;
      const nonStriker = document.getElementById('nonStrikerSelect').value;
      const bowler = document.getElementById('bowlerSelect').value;

      if (striker === nonStriker) {
        showToast("Striker and Non-Striker must be different players!");
        return;
      }

      AppState.liveMatch = {
        fixtureId: matchSetupState.fixtureId,
        teamA: matchSetupState.teamA,
        teamB: matchSetupState.teamB,
        totalOvers: 8,
        status: 'live',

        playingXI: matchSetupState.playingXI,
        innings1: {

          wickets: 0,

          superBallUsed: false,
          isSuperBallActive: false,
          isFreeHit: false,
          striker,
          nonStriker,
          currentBowler: bowler,
          extras: { wides: 0, noBalls: 0 },
          batsmen: {

      };

      closeModal();
      showToast("Match is officially LIVE!");
      triggerBroadcast("normal", "MATCH STARTED", `${batTeam} vs ${bowlTeam}`, "🏏");
      syncData();
      navigateTo('live');

        AppState.playerStats[name] = {

        syncData();
        refreshCurrentView();

              <label class="py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs uppercase border border-slate-700 text-center cursor-pointer">
                Import JSON
                <input type="file" id="importJsonInput" accept=".json" class="hidden" onchange="importBackupJSON(event)">
              </label>
            </div>

            ${isAdmin ? `
              <button onclick="resetTournamentPrompt()" class="w-full py-2.5 mt-2 rounded-xl bg-rose-600/20 hover:bg-rose-600/30 text-rose-400 border border-rose-500/40 font-black text-xs uppercase tracking-wider">
                Reset Tournament Database
              </button>
            ` : ''}
          </div>
        </div>
      `;
    }

    function exportBackupJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(AppState, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `NSL_S2_BACKUP_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importBackupJSON(e) {
      if (!isAdmin) {
        showToast("Admin authorization required to import backups!");
        return;
      }
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const imported = JSON.parse(evt.target.result);
          if (imported.teams && imported.fixtures) {
            AppState = imported;
            syncData();
            showToast("Database restored successfully!");
            refreshCurrentView();
          }
        } catch (err) {
          showToast("Invalid JSON file!");
        }
      };
      reader.readAsText(file);
    }

    function resetTournamentPrompt() {
      if (!isAdmin) return;
      if (confirm("Are you completely sure you want to reset all tournament fixtures, live matches, and scores?")) {
        AppState = {
          currentView: 'home',
          teams: JSON.parse(JSON.stringify(INITIAL_TEAMS)),
          fixtures: JSON.parse(JSON.stringify(INITIAL_FIXTURES)),
          playerStats: {},
          liveMatch: null,
          lastBroadcast: null,
          updatedAt: Date.now()
        };
        populateInitialStats();
        syncData();
        showToast("Tournament reset to original schedule.");
        navigateTo('home');
      }
    }

    /**
     * STANDINGS & NRR CALCULATOR
     */
    function calculateStandings() {
      const stats = {};
      Object.keys(AppState.teams).forEach(code => {
        stats[code] = {
          teamId: code,
          played: 0,
          won: 0,
          lost: 0,
          pts: 0,
          runsFor: 0,
          oversFor: 0,
          runsAgainst: 0,
          oversAgainst: 0,
          nrr: 0
        };
      });

      AppState.fixtures.forEach(f => {
        if (f.status === 'completed' && f.scorecard && f.type === 'GROUP') {
          const inn1 = f.scorecard.innings1;
          const inn2 = f.scorecard.innings2;
          if (!inn1 || !inn2) return;

          const team1 = inn1.battingTeam;
          const team2 = inn2.battingTeam;
          if (!stats[team1] || !stats[team2]) return;

          stats[team1].played += 1;
          stats[team2].played += 1;

          if (f.scorecard.result && f.scorecard.result.winner) {
            if (f.scorecard.result.winner === team1) {
              stats[team1].won += 1;
              stats[team1].pts += 2;
              stats[team2].lost += 1;
            } else if (f.scorecard.result.winner === team2) {
              stats[team2].won += 1;
              stats[team2].pts += 2;
              stats[team1].lost += 1;
            }
          }

          stats[team1].runsFor += inn1.runs;
          stats[team1].oversFor += inn1.balls / 6;
          stats[team1].runsAgainst += inn2.runs;
          stats[team1].oversAgainst += inn2.balls / 6;

          stats[team2].runsFor += inn2.runs;
          stats[team2].oversFor += inn2.balls / 6;
          stats[team2].runsAgainst += inn1.runs;
          stats[team2].oversAgainst += inn1.balls / 6;
        }
      });

      return Object.values(stats).map(t => {
        const forRR = t.oversFor > 0 ? (t.runsFor / t.oversFor) : 0;
        const againstRR = t.oversAgainst > 0 ? (t.runsAgainst / t.oversAgainst) : 0;
        t.nrr = forRR - againstRR;
        return t;
      }).sort((a, b) => b.pts - a.pts || b.nrr - a.nrr);
    }

    /**
     * MODAL & UI UTILITIES
     */
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const text = document.getElementById('toastMsg');
      if (!toast || !text) return;
      text.innerText = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
        toast.classList.remove('opacity-100');
      }, 2500);
    }

    function closeModal() {
      const modal = document.getElementById('modalContainer');
      if (modal) {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        modal.innerHTML = '';
      }
    }

    function openPlayerCardModal(playerName) {
      const p = AppState.playerStats[playerName] || {
        name: playerName,
        team: 'NSL',
        matches: 0,
        runs: 0,
        balls: 0,
        fours: 0,
        sixes: 0,
        highScore: 0,
        legalBallsBowled: 0,
        runsConceded: 0,
        wickets: 0
      };

      const strikeRate = p.balls > 0 ? ((p.runs / p.balls) * 100).toFixed(1) : "0.0";
      const econ = p.legalBallsBowled > 0 ? ((p.runsConceded / p.legalBallsBowled) * 6).toFixed(1) : "0.0";
      const oversBowled = `${Math.floor((p.legalBallsBowled || 0) / 6)}.${(p.legalBallsBowled || 0) % 6}`;

      const modal = document.getElementById('modalContainer');
      modal.innerHTML = `
        <div class="bg-[#0F172A] border border-amber-500/50 rounded-3xl p-5 max-w-xs w-full space-y-4 shadow-2xl text-center">
          <div>
            ${renderTeamLogo(p.team, "w-14 h-14 mx-auto mb-2")}
            <h3 class="text-base font-black text-white uppercase">${p.name}</h3>
            <span class="text-xs text-amber-400 font-bold">${AppState.teams[p.team]?.name || p.team}</span>
          </div>

          <div class="grid grid-cols-2 gap-2 text-left text-xs bg-slate-900/80 p-3 rounded-2xl border border-slate-800">
            <div><span class="text-slate-400 text-[10px] block font-bold">Matches</span><span class="text-white font-mono font-bold">${p.matches}</span></div>
            <div><span class="text-slate-400 text-[10px] block font-bold">Runs</span><span class="text-amber-400 font-mono font-bold">${p.runs}</span></div>
            <div><span class="text-slate-400 text-[10px] block font-bold">Strike Rate</span><span class="text-slate-300 font-mono font-bold">${strikeRate}</span></div>
            <div><span class="text-slate-400 text-[10px] block font-bold">Boundaries</span><span class="text-slate-300 font-mono font-bold">${p.fours}x4 • ${p.sixes}x6</span></div>
            <div><span class="text-slate-400 text-[10px] block font-bold">Wickets</span><span class="text-emerald-400 font-mono font-bold">${p.wickets}</span></div>
            <div><span class="text-slate-400 text-[10px] block font-bold">Economy</span><span class="text-slate-300 font-mono font-bold">${econ} (${oversBowled} ov)</span></div>
          </div>

          <button onclick="closeModal()" class="w-full py-2.5 rounded-xl bg-slate-800 text-slate-300 text-xs font-bold hover:bg-slate-700">
            Close
          </button>
        </div>
      `;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function shareScorecardWhatsApp(fixtureId) {
      const fix = AppState.fixtures.find(f => f.id === fixtureId);
      if (!fix || !fix.scorecard) return;
      const sc = fix.scorecard;
      const inn1 = sc.innings1;
      const inn2 = sc.innings2;

      let msg = `🏏 *NAWAB SUPER LEAGUE S2*\n`;
      msg += `*${fix.name} (${fix.type})*\n`;
      msg += `🏆 *${fix.result}*\n\n`;
      msg += `*1st Innings: ${inn1.battingTeam}* - ${inn1.runs}/${inn1.wickets} (${Math.floor(inn1.balls/6)}.${inn1.balls%6} ov)\n`;
      Object.values(inn1.batsmen).forEach(b => {
        if (b.balls > 0 || b.runs > 0) {
          msg += `• ${b.name}: ${b.runs} (${b.balls}b, ${b.fours}x4, ${b.sixes}x6)\n`;
        }
      });
      msg += `\n*2nd Innings: ${inn2.battingTeam}* - ${inn2.runs}/${inn2.wickets} (${Math.floor(inn2.balls/6)}.${inn2.balls%6} ov)\n`;
      Object.values(inn2.batsmen).forEach(b => {
        if (b.balls > 0 || b.runs > 0) {
          msg += `• ${b.name}: ${b.runs} (${b.balls}b, ${b.fours}x4, ${b.sixes}x6)\n`;
        }
      });
      msg += `\nFollow Live Scores on NSL S2 Web App!`;

      const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`;
      window.open(url, '_blank');
    }

    /**
     * INITIALIZATION
     */
    window.onload = function() {
      loadState();
      document.getElementById('nav-league-badge').innerHTML = renderLeagueLogo("w-9 h-9");
      updateAdminModeUI();
      navigateTo('home');
    };
  </script>
