<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NSL S2 - Nawab Super League Season 2</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Teko', 'sans-serif']
          },
          colors: {
            nsl: {
              gold: '#F59E0B',
              goldLight: '#FDE68A',
              dark: '#070B12',
              card: '#0D1424',
              cardLight: '#141E34',
              super: '#8B5CF6'
            }
          }
        }
      }
    };
  </script>

  <style>
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #070B12; }
    ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 4px; }
    .touch-target { touch-action: manipulation; }
    
    /* 3D Coin Toss Styles */
    .coin-perspective {
      perspective: 1000px;
    }
    .coin-3d {
      width: 130px;
      height: 130px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 3s cubic-bezier(0.15, 0.85, 0.35, 1.2);
    }
    .coin-face {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.6), 0 0 20px rgba(245, 158, 11, 0.3);
    }
    .coin-front {
      transform: rotateY(0deg);
    }
    .coin-back {
      transform: rotateY(180deg);
    }
  </style>
</head>
<body class="bg-[#070B12] text-slate-100 min-h-screen flex flex-col font-sans select-none antialiased">

  <!-- Main Top Header -->
  <header class="sticky top-0 z-40 bg-[#0D1424]/95 backdrop-blur-md border-b border-slate-800 px-3.5 py-2.5 flex items-center justify-between shadow-lg">
    <div class="flex items-center space-x-2.5 cursor-pointer" onclick="navigateTo('home')">
      <div id="nav-league-badge" class="shrink-0">
        <!-- Rendered dynamically -->
      </div>
      <div>
        <div class="flex items-center space-x-1.5">
          <span class="font-display text-2xl tracking-wider font-bold bg-gradient-to-r from-amber-400 via-yellow-200 to-amber-500 bg-clip-text text-transparent">NSL S2</span>
          <span class="text-[10px] px-1.5 py-0.2 rounded bg-amber-500/10 text-amber-400 font-extrabold border border-amber-500/30">TAPE-BALL</span>
        </div>
        <p class="text-[10px] text-slate-400 -mt-1 font-medium tracking-tight">Nawab Super League S2</p>
      </div>
    </div>

    <!-- Right Header Controls -->
    <div class="flex items-center space-x-2">
      <!-- Sync Status Badge -->
      <div id="syncBadge" onclick="openCloudSyncModal()" class="flex items-center space-x-1 px-2 py-1 rounded-full text-[10px] font-bold bg-slate-800 text-slate-400 border border-slate-700 cursor-pointer" title="Firebase Real-time Sync">
        <span id="syncDot" class="w-2 h-2 rounded-full bg-slate-500"></span>
        <span id="syncText">Local</span>
      </div>

      <!-- Admin / Spectator Badge -->
      <button onclick="handleAdminToggleClick()" id="adminToggleBtn" class="flex items-center space-x-1.5 px-2.5 py-1 rounded-lg text-xs font-bold border transition-all bg-slate-800 border-slate-700 text-slate-400">
        <i id="adminLockIcon" data-lucide="lock" class="w-3.5 h-3.5"></i>
        <span id="adminModeText">Spectator</span>
      </button>

      <!-- Quick Settings -->
      <button onclick="navigateTo('admin')" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 flex items-center justify-center text-slate-300">
        <i data-lucide="settings-2" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- Live Mini Match Ticker (Visible globally when a match is active) -->
  <div id="globalLiveTicker" class="hidden bg-gradient-to-r from-amber-600/20 via-purple-600/20 to-blue-600/20 border-b border-amber-500/30 px-3 py-1.5 cursor-pointer" onclick="navigateTo('live')">
    <div class="max-w-3xl mx-auto flex items-center justify-between text-xs">
      <div class="flex items-center space-x-2">
        <span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
        <span class="font-bold text-amber-400 font-display text-sm uppercase" id="tickerMatchTitle">LIVE MATCH</span>
      </div>
      <div class="font-bold text-white font-mono" id="tickerScoreSummary">0/0 (0.0 ov)</div>
      <div class="text-[10px] text-amber-300 font-bold flex items-center gap-0.5">Scorer Console &rarr;</div>
    </div>
  </div>

  <!-- Primary Dynamic Content Area -->
  <main id="appContent" class="flex-1 max-w-3xl w-full mx-auto p-3.5 pb-24 overflow-x-hidden"></main>

  <!-- Bottom Navigation Bar (8 Key Menus) -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-[#090F1C]/95 backdrop-blur-xl border-t border-slate-800/80 py-1.5 px-1 shadow-2xl">
    <div class="max-w-2xl mx-auto grid grid-cols-8 gap-0.5">
      <button onclick="navigateTo('home')" id="nav-home" class="flex flex-col items-center justify-center py-1 rounded-lg text-slate-400 hover:text-amber-400 transition-colors">
        <i data-lucide="home" class="w-4 h-4"></i>
        <span class="text-[8px] mt-0.5 font-bold">Home</span>
      </button>
      <button onclick="navigateTo('live')" id="nav-live" class="flex flex-col items-center justify-center py-1 rounded-lg text-slate-400 hover:text-amber-400 transition-colors relative">
        <i data-lucide="radio" class="w-4 h-4 text-rose-500"></i>
        <span id="navLiveDot" class="hidden absolute top-0.5 right-3 w-1.5 h-1.5 rounded-full bg-red-500 animate-ping"></span>
        <span class="text-[8px] mt-0.5 font-bold">Live</span>
      </button>
      <button onclick="navigateTo('fixtures')" id="nav-fixtures" class="flex flex-col items-center justify-center py-1 rounded-lg text-slate-400 hover:text-amber-400 transition-colors">
        <i data-lucide="calendar-days" class="w-4 h-4"></i>
        <span class="text-[8px] mt-0.5 font-bold">Fixtures</span>
      </button>
      <button onclick="navigateTo('points')" id="nav-points" class="flex flex-col items-center justify-center py-1 rounded-lg text-slate-400 hover:text-amber-400 transition-colors">
        <i data-lucide="table" class="w-4 h-4"></i>
        <span class="text-[8px] mt-0.5 font-bold">Points</span>
      </button>
      <button onclick="navigateTo('awards')" id="nav-awards" class="flex flex-col items-center justify-center py-1 rounded-lg text-slate-400 hover:text-amber-400 transition-colors">
        <i data-lucide="award" class="w-4 h-4"></i>
        <span class="text-[8px] mt-0.5 font-bold">Caps</span>
      </button>
      <button onclick="navigateTo('squads')" id="nav-squads" class="flex flex-col items-center justify-center py-1 rounded-lg text-slate-400 hover:text-amber-400 transition-colors">
        <i data-lucide="users" class="w-4 h-4"></i>
        <span class="text-[8px] mt-0.5 font-bold">Teams</span>
      </button>
      <button onclick="navigateTo('results')" id="nav-results" class="flex flex-col items-center justify-center py-1 rounded-lg text-slate-400 hover:text-amber-400 transition-colors">
        <i data-lucide="check-check" class="w-4 h-4"></i>
        <span class="text-[8px] mt-0.5 font-bold">Results</span>
      </button>
      <button onclick="navigateTo('admin')" id="nav-admin" class="flex flex-col items-center justify-center py-1 rounded-lg text-slate-400 hover:text-amber-400 transition-colors">
        <i data-lucide="shield-check" class="w-4 h-4"></i>
        <span class="text-[8px] mt-0.5 font-bold">Admin</span>
      </button>
    </div>
  </nav>

  <!-- Universal Modal Container -->
  <div id="modalContainer" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden items-center justify-center p-3 overflow-y-auto"></div>

  <!-- Firebase Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    window.FirebaseSDK = {
      initializeApp,
      getFirestore,
      doc,
      setDoc,
      onSnapshot
    };
    window.dispatchEvent(new Event('firebase-sdk-ready'));
  </script>

  <!-- Main Tournament Script -->
  <script>

    const STORAGE_KEY = "NSL_S2_TOURNAMENT_DATABASE_V3";
    let isAdmin = false;

    // Default Firebase Config (prefilled for nsl-s2)
    const DEFAULT_FIREBASE_CONFIG = {

        ]
      },
      'ASK': {

        ]
      },
      'NKG': {
        id: 'NKG',

      },

      { id: 2, type: 'GROUP', name: 'Match 2', teamA: 'ALW', teamB: 'NKG', overs: 8, status: 'locked', result: null, scorecard: null },
      { id: 3, type: 'GROUP', name: 'Match 3', teamA: 'ASK', teamB: 'ALW', overs: 8, status: 'locked', result: null, scorecard: null },
      { id: 4, type: 'GROUP', name: 'Match 4', teamA: 'KTG', teamB: 'NKG', overs: 8, status: 'locked', result: null, scorecard: null },
      { id: 5, type: 'GROUP', name: 'Match 5', teamA: 'ASK', teamB: 'NKG', overs: 8, status: 'locked', result: null, scorecard: null },

      { id: 7, type: 'PLAYOFF', name: 'Playoff (Knockout)', subtitle: '2nd vs 3rd Place', teamA: null, teamB: null, overs: 8, status: 'locked', result: null, scorecard: null },

    let AppState = {
      currentView: 'home',
      teams: JSON.parse(JSON.stringify(INITIAL_TEAMS)),
      fixtures: JSON.parse(JSON.stringify(INITIAL_FIXTURES)),
      playerStats: {},
      liveMatch: null,
      updatedAt: Date.now()
    };

    // Initialize Career Profiles
    function populateInitialStats() {
      const stats = {};
      Object.values(AppState.teams).forEach(team => {
        team.squad.forEach(player => {
          stats[player] = {
            name: player,
            team: team.id,
            matches: 0,
            innings: 0,
            runs: 0,
            balls: 0,
            fours: 0,
            sixes: 0,
            highScore: 0,
            notOuts: 0,
            legalBallsBowled: 0,
            runsConceded: 0,
            wickets: 0,
            maidens: 0,
            bestWickets: 0,
            bestRuns: 999,
            catches: 0
          };
        });
      });
      AppState.playerStats = stats;
    }

    /**
     * DYNAMIC LOGO GENERATORS WITH FALLBACKS
     */
    function renderTeamLogo(teamCode, sizeClasses = "w-10 h-10") {
      const team = AppState.teams[teamCode];
      if (!team) {
        return `<div class="${sizeClasses} rounded-full bg-slate-800 flex items-center justify-center font-bold text-xs text-slate-400">?</div>`;
      }
      return `
        <div class="relative inline-flex items-center justify-center shrink-0">
          <img 
            src="${team.logoPath}" 
            alt="${teamCode}" 
            class="${sizeClasses} object-contain rounded-full shadow-md"
            onerror="this.onerror=null; this.outerHTML='<div class=\\'${sizeClasses} rounded-full bg-gradient-to-tr ${team.gradient} p-0.5 shadow-md flex items-center justify-center\\'><span class=\\'w-full h-full bg-[#0D1424] rounded-full flex items-center justify-center font-black ${team.textColor} text-xs font-display tracking-wider\\'>${teamCode}</span></div>';"
          />
        </div>
      `;
    }

    function renderLeagueLogo(sizeClasses = "w-10 h-10") {
      return `
        <div class="relative inline-flex items-center justify-center shrink-0">
          <img 
            src="nsl_s2_logo.png" 
            alt="NSL S2" 
            class="${sizeClasses} object-contain drop-shadow"
            onerror="this.onerror=null; this.outerHTML='<div class=\\'${sizeClasses} rounded-xl bg-gradient-to-tr from-amber-600 via-amber-500 to-yellow-300 p-0.5 shadow-md flex items-center justify-center\\'><div class=\\'w-full h-full bg-[#0D1424] rounded-[10px] flex items-center justify-center font-black text-amber-400 text-xs font-display tracking-wider\\'>NSL</div></div>';"
          />
        </div>
      `;
    }

    /**
     * LOCAL & FIREBASE STORAGE
     */
    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          AppState = Object.assign(AppState, JSON.parse(raw));
        } else {
          populateInitialStats();
          saveLocalState();
        }
      } catch (e) {
        console.error("Storage load failed:", e);
        populateInitialStats();
      }
    }

    function saveLocalState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(AppState));
      } catch (e) {
        console.error("Storage save failed:", e);
      }
    }

    async function syncData(isLocalMutation = true) {
      AppState.updatedAt = Date.now();
      saveLocalState();
      updateGlobalTicker();

      if (firestoreDB && isLocalMutation && isAdmin) {
        try {
          const docRef = window.FirebaseSDK.doc(firestoreDB, "nsl_tournament", "s2_state");
          await window.FirebaseSDK.setDoc(docRef, JSON.parse(JSON.stringify(AppState)));
        } catch (err) {
          console.warn("Firestore write error:", err);
        }
      }
    }

    function initFirebase() {
      if (!window.FirebaseSDK) return;
      try {
        const app = window.FirebaseSDK.initializeApp(DEFAULT_FIREBASE_CONFIG);
        firestoreDB = window.FirebaseSDK.getFirestore(app);

        updateSyncBadgeUI(true);

        // Real-time listener for all viewers/spectators
        const docRef = window.FirebaseSDK.doc(firestoreDB, "nsl_tournament", "s2_state");
        if (firestoreUnsubscribe) firestoreUnsubscribe();

        firestoreUnsubscribe = window.FirebaseSDK.onSnapshot(docRef, (snap) => {
          if (snap.exists()) {
            const remoteData = snap.data();
            if (!remoteData.updatedAt || remoteData.updatedAt > (AppState.updatedAt || 0)) {
              AppState = Object.assign(AppState, remoteData);
              saveLocalState();
              refreshCurrentView();
            }
          }
        }, (err) => {
          console.warn("Firestore snapshot error:", err);
          updateSyncBadgeUI(false);
        });
      } catch (e) {
        console.warn("Firebase Init notice:", e);
        updateSyncBadgeUI(false);
      }
    }

    function updateSyncBadgeUI(isOnline) {
      const dot = document.getElementById('syncDot');
      const text = document.getElementById('syncText');
      if (dot && text) {
        if (isOnline) {
          dot.className = 'w-2 h-2 rounded-full bg-emerald-400 animate-pulse';
          text.innerText = 'Cloud Live';
        } else {
          dot.className = 'w-2 h-2 rounded-full bg-slate-500';
          text.innerText = 'Local Only';
        }
      }
    }

    window.addEventListener('firebase-sdk-ready', () => {
      initFirebase();
    });

    /**
     * ADMIN PIN CONTROLS
     */
    function handleAdminToggleClick() {
      if (isAdmin) {
        isAdmin = false;
        updateAdminModeUI();
        showToast("Switched to Spectator Mode (Read-Only)");
        refreshCurrentView();
      } else {
        openAdminPinModal();
      }
    }

    function openAdminPinModal() {
      const modal = document.getElementById('modalContainer');
      modal.innerHTML = `
        <div class="bg-[#0F172A] border border-amber-500/50 rounded-2xl p-5 max-w-xs w-full space-y-4 shadow-2xl">
          <div class="text-center">
            <div class="w-12 h-12 rounded-full bg-amber-500/20 text-amber-400 mx-auto flex items-center justify-center mb-2">
              <i data-lucide="key-round" class="w-6 h-6"></i>
            </div>
            <h3 class="text-base font-bold text-white uppercase tracking-wider">Admin Authorization</h3>
            <p class="text-xs text-slate-400 mt-1">Enter your 4-digit Scorer / Admin PIN to unlock full match management.</p>
          </div>

          <div>
            <input type="password" id="adminPinInput" maxlength="6" placeholder="Enter PIN (2443)" class="w-full text-center tracking-widest text-lg font-mono py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-amber-500">
          </div>

          <div class="flex items-center space-x-2">
            <button onclick="closeModal()" class="w-1/3 py-2.5 rounded-xl bg-slate-800 text-slate-400 text-xs font-bold">Cancel</button>
            <button onclick="verifyAdminPin()" class="w-2/3 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 text-xs font-black uppercase shadow-lg shadow-amber-500/30">Authorize</button>
          </div>
        </div>
      `;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      lucide.createIcons();
      setTimeout(() => document.getElementById('adminPinInput')?.focus(), 150);
    }

    function verifyAdminPin() {
      const pin = document.getElementById('adminPinInput').value;
      if (pin === ADMIN_PIN) {
        isAdmin = true;
        closeModal();
        updateAdminModeUI();
        showToast("Admin Mode Unlocked! Full controls enabled.");
        refreshCurrentView();
      } else {
        showToast("Incorrect Admin PIN!");
      }
    }

    function updateAdminModeUI() {
      const btn = document.getElementById('adminToggleBtn');
      const text = document.getElementById('adminModeText');
      const icon = document.getElementById('adminLockIcon');

      if (isAdmin) {
        btn.className = 'flex items-center space-x-1.5 px-2.5 py-1 rounded-lg text-xs font-bold border transition-all bg-emerald-500/20 border-emerald-500 text-emerald-400';
        text.innerText = 'Admin';
        icon.setAttribute('data-lucide', 'unlock');
      } else {
        btn.className = 'flex items-center space-x-1.5 px-2.5 py-1 rounded-lg text-xs font-bold border transition-all bg-slate-800 border-slate-700 text-slate-400';
        text.innerText = 'Spectator';
        icon.setAttribute('data-lucide', 'lock');
      }
      lucide.createIcons();
    }

    /**
     * NAVIGATION ROUTER
     */
    function navigateTo(view, params = {}) {
      AppState.currentView = view;
      window.scrollTo(0, 0);

      document.querySelectorAll('nav button').forEach(b => {
        b.classList.remove('text-amber-400');
        b.classList.add('text-slate-400');
      });
      const activeBtn = document.getElementById(`nav-${view}`);
      if (activeBtn) {
        activeBtn.classList.remove('text-slate-400');
        activeBtn.classList.add('text-amber-400');
      }

      const container = document.getElementById('appContent');
      container.innerHTML = '';

      switch (view) {
        case 'home': renderHomeScreen(container); break;
        case 'live': renderLiveScorerScreen(container); break;
        case 'fixtures': renderFixturesScreen(container); break;
        case 'points': renderPointsScreen(container); break;
        case 'awards': renderAwardsScreen(container, params); break;
        case 'squads': renderSquadsScreen(container); break;
        case 'results': renderResultsScreen(container); break;
        case 'admin': renderAdminScreen(container); break;
        default: renderHomeScreen(container);
      }

      updateGlobalTicker();
      lucide.createIcons();
    }

    function refreshCurrentView() {
      navigateTo(AppState.currentView);
    }

    function updateGlobalTicker() {
      const ticker = document.getElementById('globalLiveTicker');
      const liveDot = document.getElementById('navLiveDot');
      if (!ticker) return;

      if (AppState.liveMatch) {
        ticker.classList.remove('hidden');
        if (liveDot) liveDot.classList.remove('hidden');

    /**
     * LIVE SCORING ENGINE & SUPERBALL ALGORITHMS
     */
    function recordUndoSnapshot() {
      const match = AppState.liveMatch;
      if (!match) return;
      if (!match.history) match.history = [];
      match.history.push(JSON.parse(JSON.stringify({
        inn1: match.inn1,
        inn2: match.inn2,
        currentInnings: match.currentInnings,
        freeHit: match.freeHit,
        superBallActive: match.superBallActive,
        superBallUsedThisInnings: match.superBallUsedThisInnings,
        commentary: match.commentary
      })));
      if (match.history.length > 25) match.history.shift();
    }

    function undoDelivery() {
      const match = AppState.liveMatch;
      if (!match || !match.history || match.history.length === 0) {
        showToast("No deliveries to undo!");
        return;
      }
      const prev = match.history.pop();
      match.inn1 = prev.inn1;
      match.inn2 = prev.inn2;
      match.currentInnings = prev.currentInnings;
      match.freeHit = prev.freeHit;
      match.superBallActive = prev.superBallActive;
      match.superBallUsedThisInnings = prev.superBallUsedThisInnings;
      match.commentary = prev.commentary;

      syncData(true);
      refreshCurrentView();
      showToast("Undid last event");
    }

    function swapStrikeManual() {
      const match = AppState.liveMatch;
      const inn = match.currentInnings === 1 ? match.inn1 : match.inn2;
      const temp = inn.striker;
      inn.striker = inn.nonStriker;
      inn.nonStriker = temp;
      syncData(true);
      refreshCurrentView();
    }

    function activateSuperBall() {
      const match = AppState.liveMatch;
      const inn = match.currentInnings === 1 ? match.inn1 : match.inn2;
      const totalOvers = match.overs || 8;
      const currentOverIndex = Math.floor(inn.legalBalls / 6) + 1;

      if (currentOverIndex < 2 || currentOverIndex > (totalOvers - 1)) {
        showToast(`Superball only allowed in overs 2 to ${totalOvers - 1}!`);
        return;
      }
      if (match.superBallUsedThisInnings) {
        showToast("Superball already used in this innings!");
        return;
      }

      recordUndoSnapshot();
      match.superBallActive = true;
      match.superBallUsedThisInnings = true;
      syncData(true);
      refreshCurrentView();
      showToast("Superball Activated! Bat runs doubled, dismissal -5!");
    }

    function recordDelivery(runsOffBat) {
      recordUndoSnapshot();
      const match = AppState.liveMatch;
      const inn = match.currentInnings === 1 ? match.inn1 : match.inn2;

      let effectiveRuns = runsOffBat;
      let label = runsOffBat.toString();

      if (match.superBallActive) {
        effectiveRuns = runsOffBat * 2;
        label = `SB(${effectiveRuns})`;
        match.superBallActive = false;
      }

      inn.runs += effectiveRuns;
      inn.legalBalls += 1;

      const striker = inn.batters.find(b => b.name === inn.striker);
      if (striker) {
        striker.runs += effectiveRuns;
        striker.balls += 1;
        if (runsOffBat === 4) striker.fours += 1;
        if (runsOffBat === 6) striker.sixes += 1;
      }

      const bowler = inn.bowlers.find(b => b.name === inn.bowler);
      if (bowler) {
        bowler.legalBalls += 1;
        bowler.runsConceded += effectiveRuns;
      }

      match.freeHit = false;
      inn.currentOverBalls.push(label);

      // Commentary entry
      const overStr = `${Math.floor(inn.legalBalls / 6)}.${inn.legalBalls % 6}`;
      addCommentary(`${overStr}: ${inn.bowler} to ${inn.striker}, ${effectiveRuns} run(s) scored.`);

      // Rotate strike on odd runs
      if (runsOffBat % 2 === 1) {
        const temp = inn.striker;
        inn.striker = inn.nonStriker;
        inn.nonStriker = temp;
      }

      evaluatePostBallProgress();
    }

    function recordWide() {
      recordUndoSnapshot();
      const match = AppState.liveMatch;
      const inn = match.currentInnings === 1 ? match.inn1 : match.inn2;

      inn.runs += 1;
      inn.currentOverBalls.push('Wd');

      const bowler = inn.bowlers.find(b => b.name === inn.bowler);
      if (bowler) bowler.runsConceded += 1;

      addCommentary(`Wide delivery bowled by ${inn.bowler}. +1 extra.`);

      if (match.superBallActive) {
        showToast("Wide on Superball: +1 run. Superball persists to next delivery!");
      }

      evaluatePostBallProgress(true);
    }

    function executeNoBallScore(runsOffBat) {
      closeModal();
      recordUndoSnapshot();
      const match = AppState.liveMatch;
      const inn = match.currentInnings === 1 ? match.inn1 : match.inn2;

      let effectiveRuns = runsOffBat;
      if (match.superBallActive) {
        effectiveRuns = runsOffBat * 2;
        match.superBallActive = false;
      }

      const totalRuns = 1 + effectiveRuns;
      inn.runs += totalRuns;

      const striker = inn.batters.find(b => b.name === inn.striker);
      if (striker) {
        striker.runs += effectiveRuns;
        striker.balls += 1;
        if (runsOffBat === 4) striker.fours += 1;
        if (runsOffBat === 6) striker.sixes += 1;
      }

      const bowler = inn.bowlers.find(b => b.name === inn.bowler);
      if (bowler) bowler.runsConceded += totalRuns;

      inn.currentOverBalls.push(`NB+${effectiveRuns}`);
      match.freeHit = true;

      addCommentary(`No Ball by ${inn.bowler}! ${effectiveRuns} runs off bat + 1 extra. Free Hit next delivery.`);

      if (runsOffBat % 2 === 1) {
        const temp = inn.striker;
        inn.striker = inn.nonStriker;
        inn.nonStriker = temp;
      }

      evaluatePostBallProgress(true);
    }

    function confirmWicketDismissal() {
      const method = document.getElementById('w-dismissal-method').value;
      const dismissedPlayer = document.getElementById('w-out-batsman').value;
      const nextBatsmanEl = document.getElementById('w-next-batsman');
      const nextBatsman = nextBatsmanEl ? nextBatsmanEl.value : null;

      closeModal();
      recordUndoSnapshot();

      const match = AppState.liveMatch;
      const inn = match.currentInnings === 1 ? match.inn1 : match.inn2;

      // Free Hit Handling
      if (match.freeHit && method !== 'Run Out') {
        showToast("Free Hit: Dismissal is Not Out! (Only Run-Out applies)");
        if (match.superBallActive) {
          inn.runs = Math.max(0, inn.runs - 5);
          match.superBallActive = false;
          showToast("Superball + Free Hit: Not Out, but -5 runs deducted!");
        }
        inn.legalBalls += 1;
        match.freeHit = false;
        inn.currentOverBalls.push('Dot(FH)');
        addCommentary(`Free hit ball. Batter survived dismissal.`);
        evaluatePostBallProgress();
        return;
      }

      inn.legalBalls += 1;

      // Superball Penalty
      if (match.superBallActive) {
        inn.runs = Math.max(0, inn.runs - 5);
        showToast("SUPERBALL WICKET! -5 Runs deducted from total!");
        match.superBallActive = false;
      }

      inn.wickets += 1;
      inn.currentOverBalls.push('W');

      const batter = inn.batters.find(b => b.name === dismissedPlayer);
      if (batter) {
        batter.isOut = true;
        batter.dismissal = method;
        batter.balls += 1;
      }

      const bowler = inn.bowlers.find(b => b.name === inn.bowler);
      if (bowler) {
        bowler.legalBalls += 1;
        if (method !== 'Run Out' && method !== 'Retired Hurt') {
          bowler.wickets += 1;
        }
      }

      addCommentary(`WICKET! ${dismissedPlayer} dismissed (${method}) off ${inn.bowler}.`);

      const totalTeamPlayers = inn.batters.length;
      if (inn.wickets >= (totalTeamPlayers - 1) || !nextBatsman) {
        inn.isAllOut = true;
        evaluatePostBallProgress();
        return;
      }

      if (dismissedPlayer === inn.striker) {
        inn.striker = nextBatsman;
      } else {
        inn.nonStriker = nextBatsman;
      }

      match.freeHit = false;
      evaluatePostBallProgress();
    }

      if (!match.commentary) match.commentary = [];
      const inn = match.currentInnings === 1 ? match.inn1 : match.inn2;

    function evaluatePostBallProgress(isExtra = false) {
      const match = AppState.liveMatch;
      const inn = match.currentInnings === 1 ? match.inn1 : match.inn2;
      const totalOvers = match.overs || 8;
      const maxBalls = totalOvers * 6;

      // 2nd innings chase achieved
      if (match.currentInnings === 2 && inn.runs >= match.target) {
        finalizeMatch();
        return;
      }

      // Check All Out or overs quota reached
      if (inn.isAllOut || inn.legalBalls >= maxBalls) {
        if (match.currentInnings === 1) {
          triggerInningsBreak();
        } else {
          finalizeMatch();
        }
        return;
      }

      // Over completion handling
      if (!isExtra && inn.legalBalls % 6 === 0) {
        const temp = inn.striker;
        inn.striker = inn.nonStriker;
        inn.nonStriker = temp;
        inn.currentOverBalls = [];

        syncData(true);
        refreshCurrentView();
        if (isAdmin) openChangeBowlerModal(true);
        return;
      }

      syncData(true);
      refreshCurrentView();
    }

    function triggerInningsBreak() {
      const match = AppState.liveMatch;
      match.target = match.inn1.runs + 1;

      const battingSquad = match.inn1.bowlingTeam === match.teamA ? [...match.playingSquadA] : [...match.playingSquadB];
      const bowlingSquad = match.inn1.battingTeam === match.teamA ? [...match.playingSquadA] : [...match.playingSquadB];

      match.inn2 = {
        battingTeam: match.inn1.bowlingTeam,
        bowlingTeam: match.inn1.battingTeam,
        runs: 0, wickets: 0, legalBalls: 0,
        currentOverBalls: [], isAllOut: false,
        striker: battingSquad[0], nonStriker: battingSquad[1], bowler: bowlingSquad[0],
        batters: battingSquad.map(name => ({ name, team: match.inn1.bowlingTeam, runs: 0, balls: 0, fours: 0, sixes: 0, isOut: false, dismissal: '' })),
        bowlers: bowlingSquad.map(name => ({ name, team: match.inn1.battingTeam, legalBalls: 0, runsConceded: 0, wickets: 0 }))
      };

      const modal = document.getElementById('modalContainer');
      modal.innerHTML = `
        <div class="bg-[#0F172A] border border-amber-500/60 rounded-2xl p-5 max-w-sm w-full space-y-4 text-center">

    function startSecondInningsEngine() {
      closeModal();
      const match = AppState.liveMatch;
      match.currentInnings = 2;

    function finalizeMatch() {
      const match = AppState.liveMatch;
      const fixture = AppState.fixtures.find(f => f.id === match.fixtureId);
      const inn1 = match.inn1;
      const inn2 = match.inn2;

      let winnerId = null;
      let isTie = false;
      let summary = '';

      if (inn2.runs >= match.target) {
        winnerId = inn2.battingTeam;
        const wktsLeft = (inn2.batters.length - 1) - inn2.wickets;
        summary = `${AppState.teams[winnerId].name} won by ${wktsLeft} wicket(s)`;
      } else if (inn1.runs > inn2.runs) {
        winnerId = inn1.battingTeam;
        const runMargin = inn1.runs - inn2.runs;
        summary = `${AppState.teams[winnerId].name} won by ${runMargin} run(s)`;
      } else {
        isTie = true;
        summary = `Match Tied (${inn1.runs} - ${inn2.runs})`;
      }

      // Update Cumulative Career Stats
      const allBatters = [...inn1.batters, ...inn2.batters];
      const allBowlers = [...inn1.bowlers, ...inn2.bowlers];

      allBatters.forEach(b => {
        if (!AppState.playerStats[b.name]) {
          AppState.playerStats[b.name] = { name: b.name, team: b.team, matches: 0, innings: 0, runs: 0, balls: 0, fours: 0, sixes: 0, highScore: 0, notOuts: 0, legalBallsBowled: 0, runsConceded: 0, wickets: 0, maidens: 0, bestWickets: 0, bestRuns: 999, catches: 0 };
        }
        const p = AppState.playerStats[b.name];
        p.matches += 1;
        if (b.balls > 0 || b.isOut) {
          p.innings += 1;
          p.runs += b.runs;
          p.balls += b.balls;
          p.fours += b.fours;
          p.sixes += b.sixes;
          if (b.runs > p.highScore) p.highScore = b.runs;
          if (!b.isOut) p.notOuts += 1;
        }
      });

      allBowlers.forEach(b => {
        if (!AppState.playerStats[b.name]) return;
        const p = AppState.playerStats[b.name];
        if (b.legalBalls > 0) {
          p.legalBallsBowled += b.legalBalls;
          p.runsConceded += b.runsConceded;
          p.wickets += b.wickets;
          if (b.wickets > p.bestWickets || (b.wickets === p.bestWickets && b.runsConceded < p.bestRuns)) {
            p.bestWickets = b.wickets;
            p.bestRuns = b.runsConceded;
          }
        }
      });

      // Match Top Performers
      let topBatter = { name: 'None', runs: 0, balls: 0 };
      allBatters.forEach(b => { if (b.runs > topBatter.runs) topBatter = b; });

      fixture.status = 'completed';

        summary,
        topBatter: { name: topBatter.name, runs: topBatter.runs, balls: topBatter.balls },

    function updatePlayoffsSeedings() {
      const groupMatches = AppState.fixtures.filter(f => f.type === 'GROUP');
      const allGroupDone = groupMatches.every(m => m.status === 'completed');

      const playoff = AppState.fixtures.find(f => f.type === 'PLAYOFF');
      const grandFinal = AppState.fixtures.find(f => f.type === 'FINAL');

      if (allGroupDone) {
        const standings = calculatePointsTableData();
        if (playoff && playoff.status === 'locked') {
          playoff.teamA = standings[1].id;
          playoff.teamB = standings[2].id;
          playoff.status = 'unlocked';
        }

        if (grandFinal) {
          grandFinal.teamA = standings[0].id;
          if (playoff && playoff.status === 'completed' && playoff.result) {
            grandFinal.teamB = playoff.result.winner;
            if (grandFinal.status === 'locked') grandFinal.status = 'unlocked';
          }
        }
      }
    }

    /**
     * 4. POINTS TABLE & NRR SCREEN
     */
    function calculatePointsTableData() {
      const table = {};
      Object.keys(AppState.teams).forEach(id => {
        table[id] = {
          id: id,
          name: AppState.teams[id].name,
          shortName: AppState.teams[id].shortName,
          p: 0, w: 0, l: 0, t: 0, pts: 0,
          runsScored: 0, legalBallsFaced: 0,
          runsConceded: 0, legalBallsBowled: 0,
          nrr: 0.000
        };
      });

      AppState.fixtures.filter(f => f.type === 'GROUP' && f.status === 'completed' && f.result).forEach(match => {
        const tA = match.result.teamA.id;
        const tB = match.result.teamB.id;

        table[tA].p += 1;
        table[tB].p += 1;

        const maxBalls = (match.overs || 8) * 6;

        const inn1 = match.scorecard.inn1;
        const inn2 = match.scorecard.inn2;

        const inn1Balls = inn1.isAllOut ? maxBalls : inn1.legalBalls;
        const inn2Balls = inn2.isAllOut ? maxBalls : inn2.legalBalls;

        table[inn1.battingTeam].runsScored += inn1.runs;
        table[inn1.battingTeam].legalBallsFaced += inn1Balls;
        table[inn1.bowlingTeam].runsConceded += inn1.runs;
        table[inn1.bowlingTeam].legalBallsBowled += inn1Balls;

        table[inn2.battingTeam].runsScored += inn2.runs;
        table[inn2.battingTeam].legalBallsFaced += inn2Balls;
        table[inn2.bowlingTeam].runsConceded += inn2Runs = inn2.runs;
        table[inn2.bowlingTeam].legalBallsBowled += inn2Balls;

        if (match.result.isTie) {
          table[tA].t += 1; table[tB].t += 1;
          table[tA].pts += 1; table[tB].pts += 1;
        } else if (match.result.winner === tA) {
          table[tA].w += 1; table[tA].pts += 2;
          table[tB].l += 1;
        } else if (match.result.winner === tB) {
          table[tB].w += 1; table[tB].pts += 2;
          table[tA].l += 1;
        }
      });

      const standings = Object.values(table).map(t => {
        let forRate = 0, againstRate = 0;
        if (t.legalBallsFaced > 0) {
          const overs = Math.floor(t.legalBallsFaced / 6) + (t.legalBallsFaced % 6) / 6;
          forRate = t.runsScored / (overs || 1);
        }
        if (t.legalBallsBowled > 0) {
          const overs = Math.floor(t.legalBallsBowled / 6) + (t.legalBallsBowled % 6) / 6;
          againstRate = t.runsConceded / (overs || 1);
        }
        t.nrr = (forRate - againstRate);
        return t;
      });

      standings.sort((a, b) => b.pts !== a.pts ? b.pts - a.pts : b.nrr - a.nrr);
      return standings;
    }

    function downloadJsonBackup() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(AppState));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `NSL_S2_Backup_${Date.now()}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showToast("Tournament JSON backup downloaded!");
    }

    function importJsonBackup(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const parsed = JSON.parse(evt.target.result);
          if (parsed.teams && parsed.fixtures) {
            AppState = Object.assign(AppState, parsed);
            syncData(true);
            refreshCurrentView();
            showToast("Backup restored successfully!");
          } else {
            showToast("Invalid backup JSON format!");
          }
        } catch (err) {
          showToast("Failed to parse backup file!");
        }
      };
      reader.readAsText(file);
    }

    function confirmResetTournament() {
      if (confirm("Reset tournament back to start? All completed matches and points will be reset.")) {
        AppState.teams = JSON.parse(JSON.stringify(INITIAL_TEAMS));
        AppState.fixtures = JSON.parse(JSON.stringify(INITIAL_FIXTURES));
        AppState.liveMatch = null;
        populateInitialStats();
        syncData(true);
        refreshCurrentView();
        showToast("Tournament reset to Match 1 state.");

    }

                  <label class="text-[10px] text-slate-400 uppercase font-bold block mb-1">Elected To</label>
                  <div class="grid grid-cols-2 gap-2">
                    <button onclick="wizardState.tossDecision = 'bat'; updateTossHighlight();" id="toss-dec-bat" class="py-2 rounded-lg border text-xs font-bold uppercase ${wizardState.tossDecision === 'bat' ? 'bg-emerald-500/20 border-emerald-500 text-emerald-400' : 'bg-slate-900 border-slate-800 text-slate-400'}">
                      Bat First
                    </button>
                    <button onclick="wizardState.tossDecision = 'bowl'; updateTossHighlight();" id="toss-dec-bowl" class="py-2 rounded-lg border text-xs font-bold uppercase ${wizardState.tossDecision === 'bowl' ? 'bg-purple-500/20 border-purple-500 text-purple-400' : 'bg-slate-900 border-slate-800 text-slate-400'}">
                      Bowl First
                    </button>
                  </div>
                </div>
              </div>

              <div class="flex items-center space-x-2 pt-2">
                <button onclick="wizardState.step = 1; renderPreMatchWizardModal(); lucide.createIcons();" class="w-1/3 py-2.5 rounded-lg bg-slate-800 text-slate-300 text-xs font-bold uppercase">Back</button>
                <button onclick="wizardState.step = 3; renderPreMatchWizardModal(); lucide.createIcons();" class="w-2/3 py-2.5 rounded-lg bg-amber-500 text-slate-950 text-xs font-bold uppercase">Next: Openers</button>
              </div>
            </div>
          ` : `
            <!-- Step 3: Openers & Bowler -->
            ${renderPreMatchStep3Content()}
          `}
        </div>
      `;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      lucide.createIcons();
    }

    function toggleWizardSquad(teamChar, player) {
      const arr = teamChar === 'A' ? wizardState.playingSquadA : wizardState.playingSquadB;
      const idx = arr.indexOf(player);
      if (idx > -1) {
        if (arr.length <= 4) { showToast("Minimum 4 players required!"); return; }
        arr.splice(idx, 1);
      } else {
        arr.push(player);
      }
      const badge = document.getElementById(`squad-count-${teamChar.toLowerCase()}`);
      if (badge) badge.innerText = `${arr.length} Players`;
    }

    function triggerCoinFlipAnimation() {
      const coin = document.getElementById('coinElement');
      const flipBtn = document.getElementById('tossFlipBtn');
      if (!coin) return;

      flipBtn.disabled = true;
      const isTeamA = Math.random() < 0.5;
      const rotations = 6 * 360 + (isTeamA ? 0 : 180);

      coin.style.transform = `rotateY(${rotations}deg)`;

      setTimeout(() => {
        wizardState.tossWinner = isTeamA ? wizardState.teamA : wizardState.teamB;
        updateTossHighlight();
        showToast(`${AppState.teams[wizardState.tossWinner].name} won the toss!`);
        flipBtn.disabled = false;
      }, 3000);
    }

    function updateTossHighlight() {
      const btnA = document.getElementById('toss-win-a');
      const btnB = document.getElementById('toss-win-b');
      const decBat = document.getElementById('toss-dec-bat');
      const decBowl = document.getElementById('toss-dec-bowl');

      if (btnA && btnB) {
        btnA.className = `p-2.5 rounded-lg border text-xs font-bold flex items-center justify-center space-x-1.5 ${wizardState.tossWinner === wizardState.teamA ? 'bg-amber-500/20 border-amber-500 text-amber-400' : 'bg-slate-900 border-slate-800 text-slate-300'}`;
        btnB.className = `p-2.5 rounded-lg border text-xs font-bold flex items-center justify-center space-x-1.5 ${wizardState.tossWinner === wizardState.teamB ? 'bg-amber-500/20 border-amber-500 text-amber-400' : 'bg-slate-900 border-slate-800 text-slate-300'}`;
      }

      if (decBat && decBowl) {
        decBat.className = `py-2 rounded-lg border text-xs font-bold uppercase ${wizardState.tossDecision === 'bat' ? 'bg-emerald-500/20 border-emerald-500 text-emerald-400' : 'bg-slate-900 border-slate-800 text-slate-400'}`;
        decBowl.className = `py-2 rounded-lg border text-xs font-bold uppercase ${wizardState.tossDecision === 'bowl' ? 'bg-purple-500/20 border-purple-500 text-purple-400' : 'bg-slate-900 border-slate-800 text-slate-400'}`;
      }
    }

    function renderPreMatchStep3Content() {
      let battingTeamId = wizardState.tossDecision === 'bat' ? wizardState.tossWinner : (wizardState.tossWinner === wizardState.teamA ? wizardState.teamB : wizardState.teamA);
      let bowlingTeamId = battingTeamId === wizardState.teamA ? wizardState.teamB : wizardState.teamA;

      const battingSquad = battingTeamId === wizardState.teamA ? wizardState.playingSquadA : wizardState.playingSquadB;
      const bowlingSquad = bowlingTeamId === wizardState.teamA ? wizardState.playingSquadA : wizardState.playingSquadB;

      if (!wizardState.striker && battingSquad.length > 0) wizardState.striker = battingSquad[0];
      if (!wizardState.nonStriker && battingSquad.length > 1) wizardState.nonStriker = battingSquad[1];
      if (!wizardState.openingBowler && bowlingSquad.length > 0) wizardState.openingBowler = bowlingSquad[0];

      return `
        <div class="space-y-4">
          <div>
            <h3 class="text-base font-bold text-white">Opening Batsmen & Bowler</h3>
            <p class="text-xs text-slate-400">Set initial strike and bowling attack</p>
          </div>

          <div class="rounded-xl border border-slate-800 bg-slate-900/60 p-3.5 space-y-2.5">
            <span class="text-xs font-bold text-emerald-400 uppercase">Batting: ${AppState.teams[battingTeamId].name}</span>
            <div>
              <label class="text-[10px] text-slate-400 uppercase font-bold block mb-1">Striker (*)</label>
              <select onchange="wizardState.striker = this.value" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white">
                ${battingSquad.map(p => `<option value="${p}" ${wizardState.striker === p ? 'selected' : ''}>${p}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="text-[10px] text-slate-400 uppercase font-bold block mb-1">Non-Striker</label>
              <select onchange="wizardState.nonStriker = this.value" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white">
                ${battingSquad.map(p => `<option value="${p}" ${wizardState.nonStriker === p ? 'selected' : ''}>${p}</option>`).join('')}
              </select>
            </div>
          </div>

          <div class="rounded-xl border border-slate-800 bg-slate-900/60 p-3.5 space-y-2">
            <span class="text-xs font-bold text-purple-400 uppercase">Bowling: ${AppState.teams[bowlingTeamId].name}</span>
            <div>
              <label class="text-[10px] text-slate-400 uppercase font-bold block mb-1">Opening Bowler</label>
              <select onchange="wizardState.openingBowler = this.value" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white">
                ${bowlingSquad.map(p => `<option value="${p}" ${wizardState.openingBowler === p ? 'selected' : ''}>${p}</option>`).join('')}
              </select>
            </div>
          </div>

          <div class="flex items-center space-x-2 pt-2">
            <button onclick="wizardState.step = 2; renderPreMatchWizardModal(); lucide.createIcons();" class="w-1/3 py-2.5 rounded-lg bg-slate-800 text-slate-300 text-xs font-bold uppercase">Back</button>
            <button onclick="commitLaunchMatch()" class="w-2/3 py-2.5 rounded-lg bg-gradient-to-r from-amber-500 to-yellow-500 text-slate-950 font-bold text-xs uppercase tracking-wider">Start Match Console</button>
          </div>
        </div>
      `;
    }

    function commitLaunchMatch() {
      if (wizardState.striker === wizardState.nonStriker) {
        showToast("Striker and Non-Striker must be different players!");
        return;
      }

      let battingTeamId = wizardState.tossDecision === 'bat' ? wizardState.tossWinner : (wizardState.tossWinner === wizardState.teamA ? wizardState.teamB : wizardState.teamA);
      let bowlingTeamId = battingTeamId === wizardState.teamA ? wizardState.teamB : wizardState.teamA;

      const battingSquad = battingTeamId === wizardState.teamA ? [...wizardState.playingSquadA] : [...wizardState.playingSquadB];
      const bowlingSquad = bowlingTeamId === wizardState.teamA ? [...wizardState.playingSquadA] : [...wizardState.playingSquadB];

      const fixture = AppState.fixtures.find(f => f.id === wizardState.fixtureId);
      fixture.status = 'in_progress';
      fixture.overs = wizardState.overs;

      AppState.liveMatch = {
        fixtureId: wizardState.fixtureId,
        matchName: fixture.name,
        teamA: wizardState.teamA,
        teamB: wizardState.teamB,
        overs: wizardState.overs,
        playingSquadA: wizardState.playingSquadA,
        playingSquadB: wizardState.playingSquadB,
        currentInnings: 1,
        freeHit: false,
        superBallActive: false,
        superBallUsedThisInnings: false,
        target: null,
        history: [],
        commentary: [{ over: '0.0', text: `Match started! ${AppState.teams[battingTeamId].name} batting first (${wizardState.overs} overs).` }],
        inn1: {
          battingTeam: battingTeamId,
          bowlingTeam: bowlingTeamId,
          runs: 0, wickets: 0, legalBalls: 0,
          currentOverBalls: [], isAllOut: false,
          striker: wizardState.striker,
          nonStriker: wizardState.nonStriker,
          bowler: wizardState.openingBowler,
          batters: battingSquad.map(name => ({ name, team: battingTeamId, runs: 0, balls: 0, fours: 0, sixes: 0, isOut: false, dismissal: '' })),
          bowlers: bowlingSquad.map(name => ({ name, team: bowlingTeamId, legalBalls: 0, runsConceded: 0, wickets: 0 }))
        },
        inn2: null
      };

      closeModal();
      syncData(true);
      navigateTo('live');
    }

    /**
     * MODAL DIALOGS: PLAYER PROFILE, FULL SCORECARD, CLOUD SYNC
     */
    function openPlayerProfileModal(playerName) {
      const stats = AppState.playerStats[playerName] || {
        runs: 0, balls: 0, fours: 0, sixes: 0, highScore: 0, notOuts: 0,
        legalBallsBowled: 0, runsConceded: 0, wickets: 0, catches: 0
      };
      const strikeRate = stats.balls > 0 ? ((stats.runs / stats.balls) * 100).toFixed(1) : '0.0';
      const oversBowled = `${Math.floor(stats.legalBallsBowled / 6)}.${stats.legalBallsBowled % 6}`;
      const economy = stats.legalBallsBowled > 0 ? ((stats.runsConceded / stats.legalBallsBowled) * 6).toFixed(2) : '0.00';

      const modal = document.getElementById('modalContainer');
      modal.innerHTML = `
        <div class="bg-[#0F172A] border border-amber-500/50 rounded-2xl p-5 max-w-sm w-full space-y-4">
          <div class="flex items-center justify-between pb-2 border-b border-slate-800">
            <div class="flex items-center space-x-2">
              ${renderTeamLogo(stats.team, 'w-8 h-8')}
              <div>
                <h3 class="font-bold text-base text-white leading-tight">${playerName}</h3>
                <span class="text-[10px] text-slate-400">${AppState.teams[stats.team] ? AppState.teams[stats.team].name : ''}</span>
              </div>
            </div>
            <button onclick="closeModal()" class="w-7 h-7 rounded-lg bg-slate-800 text-slate-400 flex items-center justify-center"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>

          <div class="grid grid-cols-3 gap-2 text-center text-xs">
            <div class="bg-black/40 p-2 rounded-lg border border-slate-800"><div class="text-[9px] text-slate-400 uppercase">Runs</div><div class="font-display text-2xl font-bold text-amber-400">${stats.runs}</div></div>
            <div class="bg-black/40 p-2 rounded-lg border border-slate-800"><div class="text-[9px] text-slate-400 uppercase">Balls</div><div class="font-display text-2xl font-bold text-white">${stats.balls}</div></div>
            <div class="bg-black/40 p-2 rounded-lg border border-slate-800"><div class="text-[9px] text-slate-400 uppercase">SR</div><div class="font-display text-2xl font-bold text-emerald-400">${strikeRate}</div></div>
            <div class="bg-black/40 p-2 rounded-lg border border-slate-800"><div class="text-[9px] text-slate-400 uppercase">High Score</div><div class="font-display text-2xl font-bold text-yellow-300">${stats.highScore}</div></div>
            <div class="bg-black/40 p-2 rounded-lg border border-slate-800"><div class="text-[9px] text-slate-400 uppercase">4s / 6s</div><div class="font-display text-2xl font-bold text-blue-400">${stats.fours}/${stats.sixes}</div></div>
            <div class="bg-black/40 p-2 rounded-lg border border-slate-800"><div class="text-[9px] text-slate-400 uppercase">Wickets</div><div class="font-display text-2xl font-bold text-purple-400">${stats.wickets}</div></div>
            <div class="bg-black/40 p-2 rounded-lg border border-slate-800"><div class="text-[9px] text-slate-400 uppercase">Overs</div><div class="font-display text-2xl font-bold text-white">${oversBowled}</div></div>
            <div class="bg-black/40 p-2 rounded-lg border border-slate-800"><div class="text-[9px] text-slate-400 uppercase">Economy</div><div class="font-display text-2xl font-bold text-emerald-400">${economy}</div></div>
            <div class="bg-black/40 p-2 rounded-lg border border-slate-800"><div class="text-[9px] text-slate-400 uppercase">BBI</div><div class="font-display text-2xl font-bold text-purple-300">${stats.bestWickets > 0 ? `${stats.bestWickets}/${stats.bestRuns}` : '-'}</div></div>
          </div>
        </div>
      `;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      lucide.createIcons();
    }

    function viewDetailedScorecardModal() {
      if (!AppState.liveMatch) return;
      renderScorecardModalTemplate(AppState.liveMatch.matchName, AppState.liveMatch.inn1, AppState.liveMatch.inn2);
    }

    function viewScorecardModal(fixtureId) {
      const fix = AppState.fixtures.find(f => f.id === fixtureId);
      if (!fix || !fix.scorecard) return;
      renderScorecardModalTemplate(fix.name, fix.scorecard.inn1, fix.scorecard.inn2, fix.result?.summary);
    }

    function renderScorecardModalTemplate(title, inn1, inn2, summary = '') {
      const modal = document.getElementById('modalContainer');
      modal.innerHTML = `
        <div class="bg-[#0F172A] border border-slate-700 rounded-2xl p-4 max-w-lg w-full max-h-[85vh] overflow-y-auto space-y-4">
          <div class="flex items-center justify-between pb-2 border-b border-slate-800">
            <div>
              <h3 class="font-bold text-sm text-white">${title} Scorecard</h3>
              ${summary ? `<p class="text-[10px] text-amber-400 font-semibold">${summary}</p>` : ''}
            </div>
            <button onclick="closeModal()" class="w-7 h-7 rounded-lg bg-slate-800 text-slate-400 flex items-center justify-center"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>

          <!-- Innings 1 -->
          ${renderInningsBlock(inn1)}

          <!-- Innings 2 -->
          ${inn2 ? renderInningsBlock(inn2) : ''}
        </div>
      `;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      lucide.createIcons();
    }

    function renderInningsBlock(inn) {
      const batTeam = AppState.teams[inn.battingTeam];
      return `
        <div class="rounded-xl border border-slate-800 bg-[#070B12] p-3 space-y-2">
          <div class="flex items-center justify-between pb-1 border-b border-slate-800 text-xs font-bold text-white">
            <div class="flex items-center space-x-1.5">
              ${renderTeamLogo(batTeam.id, 'w-6 h-6')}
              <span>${batTeam.name}</span>
            </div>
            <span class="text-amber-400 font-mono">${inn.runs}/${inn.wickets} (${inn.overs || `${Math.floor(inn.legalBalls / 6)}.${inn.legalBalls % 6}`} ov)</span>
          </div>

          <div class="space-y-1 text-[11px]">
            ${inn.batters.filter(b => b.balls > 0 || b.isOut).map(b => `
              <div class="flex items-center justify-between text-slate-300">
                <span class="truncate max-w-[140px]">${b.name} ${b.isOut ? `<span class="text-[9px] text-slate-500">(${b.dismissal})</span>` : '*'}</span>
                <span class="font-mono">${b.runs} (${b.balls}b, ${b.fours}x4, ${b.sixes}x6)</span>
              </div>
            `).join('')}
          </div>

          <div class="pt-2 border-t border-slate-800 text-[10px] text-slate-400 space-y-0.5">
            <span class="uppercase font-bold block">Bowling Figures:</span>
            ${inn.bowlers.filter(bw => bw.legalBalls > 0).map(bw => `
              <div class="flex items-center justify-between">
                <span>${bw.name}</span>
                <span class="font-mono">${Math.floor(bw.legalBalls / 6)}.${bw.legalBalls % 6} ov, ${bw.runsConceded} r, ${bw.wickets} w</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function openCloudSyncModal() {
      const modal = document.getElementById('modalContainer');
      modal.innerHTML = `
        <div class="bg-[#0F172A] border border-slate-700 rounded-2xl p-5 max-w-sm w-full space-y-3">
          <div class="flex items-center justify-between pb-1 border-b border-slate-800">
            <h3 class="font-bold text-sm text-white flex items-center gap-2">
              <i data-lucide="cloud" class="w-4 h-4 text-emerald-400"></i>
              Cloud Sync Details
            </h3>
            <button onclick="closeModal()" class="w-7 h-7 rounded-lg bg-slate-800 text-slate-400 flex items-center justify-center"><i data-lucide="x" class="w-4 h-4"></i></button>
          </div>
          <p class="text-xs text-slate-400">Firebase Firestore is connected automatically to project: <strong class="text-emerald-400">nsl-s2</strong>. Any scored ball updates all viewers in real-time without refreshing.</p>
          <div class="bg-black/50 p-3 rounded-lg border border-slate-800 text-xs font-mono text-slate-300 space-y-1">
            <div>Auth: <strong>Ready</strong></div>
            <div>Database: <strong>Firestore (default)</strong></div>
            <div>Doc: <strong>nsl_tournament/s2_state</strong></div>
          </div>
          <button onclick="closeModal()" class="w-full py-2 rounded-lg bg-amber-500 text-slate-950 font-bold text-xs uppercase">Close</button>
        </div>
      `;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      lucide.createIcons();
    }

    function closeModal() {
      const modal = document.getElementById('modalContainer');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      modal.innerHTML = '';
    }

    function showToast(msg) {
      const toast = document.createElement('div');
      toast.className = 'fixed top-12 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-xl bg-[#0F172A] border border-amber-500/60 text-amber-400 text-xs font-bold shadow-2xl backdrop-blur-md flex items-center gap-1.5';
      toast.innerHTML = `<i data-lucide="info" class="w-3.5 h-3.5"></i> <span>${msg}</span>`;
      document.body.appendChild(toast);
      lucide.createIcons();
      setTimeout(() => toast.remove(), 2600);
    }

    // App Startup
    window.onload = function() {
      loadState();
      document.getElementById('nav-league-badge').innerHTML = renderLeagueLogo('w-8 h-8');
      navigateTo('home');
    };
  </script>
</body>
</html>
